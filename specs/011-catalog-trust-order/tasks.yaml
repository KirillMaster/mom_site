tasks:
  # ---------- S1: backend images (US7) ----------
  - id: T001
    title: 'OriginalPath, угловой водяной знак, превью без знака'
    description: 'ArtworkImage.OriginalPath (nullable) + EF-миграция; ImageService.AddCornerWatermark: правый нижний угол, высота текста ≤3% меньшей стороны (мин. 12 px), alpha ≤ 0.4, отступ ~2%; CreateThumbnailAsync больше не накладывает знак; ArtworkImageService.StoreAsync сохраняет путь оригинала в OriginalPath'
    context: 'Крупный знак по центру мешает смотреть картину; оригиналы лежат в S3, но не связаны с записями (US7)'
    story_ref: US7
    requirement_refs: [FR-013]
    depends_on: []
    parallelizable: false
    entity_refs: [artwork-image]
    contract_refs: []
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'MomSite.Tests: WatermarkGeometry (чистая функция размера/позиции знака) — для 3000×2000 высота ≤ 60 px, позиция у правого нижнего угла; для 300×200 высота ≥ 12 px; StoreAsync возвращает/сохраняет OriginalPath (мок IImageService)'
      - order: 2
        action: 'Модель и миграция'
        detail: 'Core: ArtworkImage.OriginalPath string?; Infrastructure: dotnet ef migrations add AddArtworkImageOriginalPath (миграции применяются при старте, Program.cs)'
      - order: 3
        action: 'ImageService'
        detail: 'Вынести геометрию в WatermarkGeometry; AddCornerWatermark использует её; убрать знак из обеих веток CreateThumbnailAsync (local/S3); AddWatermarkAsync продолжает писать artworks/watermarked_{guid}'
      - order: 4
        action: 'StoreAsync'
        detail: 'Вернуть кортеж (watermarked, thumb, original) и записать OriginalPath во всех местах создания ArtworkImage (контроллеры admin artworks); DeleteFiles оригинал НЕ удаляет'
    technical_notes:
      - path: backend/MomSite.Infrastructure/Services/ImageService.cs
        note: 'AddCornerWatermark сейчас вызывается в 4 местах (161, 232 превью; 288, 340 копия)'
      - path: backend/MomSite.Infrastructure/Services/ArtworkImageService.cs
        note: 'Оригинал остаётся в S3 по artworks/{guid}.ext'
    acceptance_criteria:
      - id: AC-1
        description: 'dotnet test зелёный; новая загрузка даёт знак в углу, превью без знака, OriginalPath заполнен'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Изображение 3000×2000']
        when: 'Считается геометрия знака'
        then: ['Высота текста ≤ 60 px, правый край и низ в пределах 3% от краёв']
        verification: [automated]
        level: unit

  - id: T002
    title: 'Перерендер знака из оригиналов S3 (admin)'
    description: 'IS3Service.ListObjectsAsync(prefix); чистая WatermarkPairing.Match(originals, watermarked) — пары по LastModified (оригинал не позже копии, окно 120 с, то же расширение, без повторного использования оригинала); RewatermarkService; POST api/admin/images/rewatermark?dryRun=true&take=25'
    context: 'Перерендер существующих 427 работ без потери оригиналов (US7, FR-014)'
    story_ref: US7
    requirement_refs: [FR-014]
    depends_on: [T001]
    parallelizable: false
    entity_refs: [artwork-image, rewatermark-report]
    contract_refs: [rewatermark-endpoint]
    steps:
      - order: 1
        action: 'Тесты пар'
        detail: 'WatermarkPairing: точная пара; копия раньше оригинала → нет пары; разница > 120 с → skipped; два оригинала у одной копии → ближайший, второй не используется; разные расширения → нет пары'
      - order: 2
        action: 'S3 листинг'
        detail: 'ListObjectsV2 с пагинацией, возвращает (Key, LastModified); local-ветка — по файловой системе'
      - order: 3
        action: 'Сервис'
        detail: 'Берёт ArtworkImage с OriginalPath == null (take, по Id); ключ копии из ImagePath; при dryRun только отчёт; иначе: AddWatermarkAsync(original) → новый ImagePath, CreateThumbnailAsync(original) → новый ThumbnailPath, OriginalPath = original; Artwork.ImagePath/ThumbnailPath обновить, если совпадали со старыми; старые копию и превью удалить после SaveChanges; оригинал не трогать; ошибки по одному изображению → failed, не прерывать пачку'
      - order: 4
        action: 'Эндпоинт'
        detail: '[Authorize] admin controller; dryRun по умолчанию true; take 1..100 (по умолчанию 25); ответ — отчёт data-model rewatermark-report, remaining = число без OriginalPath после операции'
    technical_notes:
      - path: backend/MomSite.Infrastructure/Services/S3Service.cs
        note: 'Листинга сейчас нет — добавить в IS3Service и реализацию'
    acceptance_criteria:
      - id: AC-1
        description: 'Повторный запуск не трогает уже перерендеренные (идемпотентность по OriginalPath); без авторизации 401'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Оригинал artworks/a.jpg 10:00:00 и копия artworks/watermarked_b.jpg 10:00:03']
        when: 'WatermarkPairing.Match'
        then: ['Пара a↔b']
        verification: [automated]
        level: unit
      - id: TS-2
        given: ['Изображение без пары']
        when: 'POST rewatermark?dryRun=false'
        then: ['id в skipped, файлы не изменены']
        verification: [automated]
        level: integration


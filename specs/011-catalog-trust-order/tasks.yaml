  - id: T004
    title: 'Очистка LLM-описаний'
    description: 'MomSite.Core/Services/DescriptionCleaner.Clean(string?) — удаляет абзацы, начинающиеся с известных шаблонов генерации («Эта картина», «Картина «…» — это», «В этой работе», «Работа погружает», «Художник мастерски» и т.п.), оставляет фактические строки (техника, размер, год, место); идемпотентный запуск при старте после Migrate()'
    context: 'Сгенерированный текст снижает доверие (US8); пример — id 428/429'
    story_ref: US8
    requirement_refs: [FR-015]
    depends_on: []
    parallelizable: true
    entity_refs: [artwork]
    contract_refs: []
    steps:
      - order: 1
        action: 'Тесты'
        detail: '«Холст на подрамнике , масло, 80х65, Севастополь 2012г.» + LLM-абзацы → только первая строка; чисто LLM-текст → пусто (null); авторский текст без шаблонов не меняется; повторный вызов не меняет результат'
      - order: 2
        action: 'Запуск'
        detail: 'Program.cs после Migrate(): пройти Artworks, где Clean(d) != d, сохранить, залогировать количество; новый текст не добавлять'
    technical_notes:
      - path: backend/MomSite.Core/Services/DescriptionCleaner.cs
        note: 'Чистая функция без зависимостей'
    acceptance_criteria:

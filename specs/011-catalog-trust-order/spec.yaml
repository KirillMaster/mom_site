feature: "Каталог, доверие и картина на заказ"
branch: "feature/011-catalog-trust-order"
created: "2026-10-03"
status: "Draft"
input: "011-catalog-trust-order. Финальная фича ревизии дизайна 2026-10-02 (решения утверждены, не пересогласовывать): главная с оффером и сеткой «в наличии» на оптимизированных изображениях; блок доверия и отзывы на главной и странице работы; редактируемый в админке блок «Как купить» на странице работы; схема масштаба картины рядом с диваном; фильтры каталога по теме, размеру и наличию, отдельный раздел работ Всеволода Сухоруких, выставочные фото на странице «О художнице»; страница «Картина на заказ» с целью Метрики; небольшой полупрозрачный водяной знак в углу с перерендером существующих изображений из оригиналов S3; удаление сгенерированных ИИ абзацев из описаний работ."

user_stories:
  - id: "US1"
    title: "Главная сразу предлагает выбрать картину или заказать свою"
    priority: "P1"
    description: "Первый экран главной объясняет, кто художник и что можно сделать: подзаголовок «Живопись маслом из Крыма. Работы в коллекциях 12 стран», две кнопки — «Выбрать картину» (галерея) и «Картина на заказ». Ниже — сетка из 6–8 работ «Сейчас в наличии», изображения отдаются в уменьшенном оптимизированном виде, поэтому главная грузится быстро."
    motivation:
      problem: "Сейчас на главной только «Художник-импрессионист» и одна кнопка, а карусель грузит оригиналы из S3 — главная открывается около 30 секунд."
      value: "Посетитель за секунды понимает оффер и видит доступные работы; быстрая загрузка снижает отказы."
      consequence_if_skipped: "Медленная главная без ясного предложения теряет большую часть мобильного трафика."
    why_priority: "Главная — основная точка входа, производительность и оффер дают наибольший эффект на конверсию."
    independent_test: "Открыть главную на 390 и 1280 px: виден подзаголовок, две кнопки ведут на /gallery и /order, сетка из 6–8 работ в наличии, изображения грузятся через оптимизатор с ограниченной шириной."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель открывает главную"
        when: "Первый экран отрисован"
        then: "Видны подзаголовок «Живопись маслом из Крыма. Работы в коллекциях 12 стран» и кнопки «Выбрать картину» → /gallery и «Картина на заказ» → /order"
      - id: "AS-2"
        given: "В каталоге есть работы со статусом «в наличии» в категориях, показываемых на главной"
        when: "Посетитель прокручивает к блоку «Сейчас в наличии»"
        then: "Показаны от 6 до 8 работ в наличии с музейной этикеткой, каждая ведёт на свою страницу"
      - id: "AS-3"
        given: "Главная загружена на мобильном"
        when: "Браузер запрашивает изображения работ"
        then: "Изображения запрашиваются через оптимизатор с шириной не больше требуемой по сетке, а не исходные файлы"
    acceptance_criteria:
      - id: "AC-1"
        description: "Hero содержит подзаголовок и две кнопки с правильными ссылками"
        done: false
      - id: "AC-2"
        description: "Сетка «Сейчас в наличии» показывает 6–8 опубликованных работ со статусом Available; если таких меньше 6 — показывает сколько есть, блок скрывается при 0"
        done: false
      - id: "AC-3"
        description: "На главной нет тегов img с исходными URL S3; все изображения работ идут через оптимизатор с атрибутом sizes"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Данные главной с 10 работами, 9 из них в наличии"
        when: "Рендерится секция «Сейчас в наличии»"
        then:
          - "Отрисовано 8 карточек, все со статусом в наличии, ссылки ведут на страницы работ"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Открыта главная на проде"
        when: "Проверяются hero и изображения"
        then:
          - "Обе кнопки ведут на /gallery и /order, все src картинок работ начинаются с /_next/image"
        verification:
          - "automated"
        level: "e2e"

  - id: "US2"
    title: "Посетитель видит, что художнику доверяют"
    priority: "P1"
    description: "Полоса доверия (член Союза художников России, работы в музейных собраниях, коллекционеры в 12 странах) и 2–3 опубликованных отзыва показаны на главной и на странице работы; на странице работы первыми идут отзывы об этой работе."
    motivation:
      problem: "Отзывы спрятаны на отдельной странице, факты о статусе художника не видны при выборе картины."
      value: "Социальное доказательство рядом с решением о покупке снижает сомнения и повышает число обращений."
      consequence_if_skipped: "Покупатель уходит сравнивать и не возвращается."
    why_priority: "Доверие — главный барьер при покупке картины онлайн у незнакомого художника."
    independent_test: "Открыть главную и страницу работы с отзывом: видна полоса доверия из трёх фактов и 2–3 отзыва, отзыв об этой работе стоит первым."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель на главной или на странице работы"
        when: "Прокручивает страницу"
        then: "Видит полосу доверия с тремя фактами"
      - id: "AS-2"
        given: "У работы есть опубликованный отзыв"
        when: "Посетитель открывает её страницу"
        then: "Блок отзывов показывает 2–3 отзыва, первым — отзыв об этой работе, и ссылку «Все отзывы»"
    acceptance_criteria:
      - id: "AC-1"
        description: "Полоса доверия одинакова на главной и странице работы"
        done: false
      - id: "AC-2"
        description: "Отзывы берутся только опубликованные; если отзывов нет — блок скрыт"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Список из 4 отзывов, один привязан к работе 7"
        when: "Выбираются отзывы для страницы работы 7"
        then:
          - "Возвращено 3 отзыва, первый привязан к работе 7"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Открыта страница работы на проде"
        when: "Ищется полоса доверия"
        then:
          - "Полоса доверия видна и содержит «Союз художников России»"
        verification:
          - "automated"
        level: "e2e"

  - id: "US3"
    title: "На странице работы понятно, как её купить"
    priority: "P1"
    description: "Блок «Как купить» на странице работы: доставка (СДЭК, упаковка), оплата, сертификат подлинности, возврат. Текст редактируется в админке на странице контента; если не заполнен, показывается текст по умолчанию."
    motivation:
      problem: "Покупатель не знает, как происходит покупка, доставка и оплата, и вынужден писать с вопросами или уходит."
      value: "Ответы на типовые вопросы рядом с кнопкой «Узнать цену» снимают барьеры."
      consequence_if_skipped: "Часть готовых купить не пишет из-за неопределённости."
    why_priority: "Прямо влияет на переход от просмотра к обращению."
    independent_test: "Открыть страницу работы — блок «Как купить» с 4 пунктами; изменить текст в админке — на странице показывается новый текст."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Текст «Как купить» в админке не заполнен"
        when: "Посетитель открывает страницу работы"
        then: "Показан текст по умолчанию с пунктами о доставке, оплате, сертификате и возврате"
      - id: "AS-2"
        given: "Администратор сохранил свой текст «Как купить»"
        when: "Посетитель открывает страницу работы"
        then: "Показан сохранённый текст"
    acceptance_criteria:
      - id: "AC-1"
        description: "Текст хранится как контент страницы с ключами how-to-buy/body и редактируется в существующей админке страниц"
        done: false
      - id: "AC-2"
        description: "Публичный API отдаёт текст или пустое значение; фронтенд при пустом значении показывает текст по умолчанию"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "В БД нет записи how-to-buy/body"
        when: "Запрашивается публичный эндпоинт «Как купить»"
        then:
          - "Ответ 200 с пустым текстом"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-2"
        given:
          - "Компонент получил пустой текст"
        when: "Рендерится блок"
        then:
          - "Показаны 4 пункта текста по умолчанию"
        verification:
          - "automated"
        level: "unit"

  - id: "US4"
    title: "Посетитель видит размер картины в интерьере"
    priority: "P2"
    description: "Рядом с характеристиками работы — схема масштаба: силуэт дивана шириной около 200 см и прямоугольник картины в пропорциях её ширины и высоты над ним. Показывается только если размер известен."
    motivation:
      problem: "Цифры «80 × 65 см» плохо представляются; покупатели боятся ошибиться с размером."
      value: "Наглядная схема помогает понять, впишется ли картина."
      consequence_if_skipped: "Остаётся неуверенность в размере, лишние вопросы."
    why_priority: "Полезно, но вторично относительно оффера и доверия."
    independent_test: "Открыть работу с размером 80 × 65 — видна схема с диваном и прямоугольником; у работы без размера схемы нет."
    acceptance_scenarios:
      - id: "AS-1"
        given: "У работы указаны ширина и высота"
        when: "Посетитель открывает страницу работы"
        then: "Видна схема, ширина прямоугольника относится к ширине дивана как ширина картины к 200 см"
      - id: "AS-2"
        given: "У работы нет размера"
        when: "Посетитель открывает страницу работы"
        then: "Схема не показывается"
    acceptance_criteria:
      - id: "AC-1"
        description: "Пропорции схемы вычисляются из WidthCm/HeightCm; картины шире 300 см ограничиваются областью схемы"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Работа 100 × 50 см"
        when: "Рендерится схема масштаба"
        then:
          - "Ширина прямоугольника картины равна половине ширины дивана, высота — четверти ширины дивана"
        verification:
          - "automated"
        level: "unit"

  - id: "US5"
    title: "Каталог можно отфильтровать по теме, размеру и наличию"
    priority: "P1"
    description: "В галерее фильтры: тема (категория), размер S/M/L по большей стороне (до 40 см, до 80 см, больше 80 см), «только в наличии». Работы Всеволода Сухоруких — отдельный раздел, не входят в общий вид. Фото с выставок не показываются в галерее, а перенесены на страницу «О художнице»."
    motivation:
      problem: "427 работ без фильтров по размеру и наличию; в общей ленте смешаны работы другого автора и фото выставок."
      value: "Покупатель быстро находит картину нужного размера и не путается в авторстве."
      consequence_if_skipped: "Поиск подходящей работы долгий, растут отказы из галереи."
    why_priority: "Каталог — путь к покупке для посетителей с конкретной задачей."
    independent_test: "В галерее выбрать размер M и «в наличии» — остаются только работы с большей стороной 41–80 см в наличии; работ Сухоруких и фото выставок в общем виде нет; раздел Сухоруких открывается отдельно; на /about есть фото выставок."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель в галерее"
        when: "Выбирает размер M"
        then: "Показаны только работы с большей стороной больше 40 и не больше 80 см; работы без размера скрыты"
      - id: "AS-2"
        given: "Посетитель в галерее без выбранной темы"
        when: "Смотрит общий список"
        then: "Нет работ категорий «Пейзажи Всеволода Сухоруких» и «Фото с выставок»"
      - id: "AS-3"
        given: "Посетитель выбирает раздел работ Всеволода Сухоруких"
        when: "Раздел открыт"
        then: "Показаны только его работы с пометкой авторства"
      - id: "AS-4"
        given: "Посетитель открывает «О художнице»"
        when: "Прокручивает к выставкам"
        then: "Видит фото с выставок"
      - id: "AS-5"
        given: "Выбраны фильтры"
        when: "Посетитель обновляет страницу или делится ссылкой"
        then: "Фильтры сохраняются в адресе страницы"
    acceptance_criteria:
      - id: "AC-1"
        description: "Фильтры комбинируются (И); счётчик показывает число найденных работ; есть сброс"
        done: false
      - id: "AC-2"
        description: "Фильтр по цене не вводится — ни у одной работы нет цены (отклонение)"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Работы 30×30, 60×50, 100×80, без размера"
        when: "Применяется фильтр размера S, M, L"
        then:
          - "S → 30×30, M → 60×50, L → 100×80; работа без размера не попадает ни в один"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Работы трёх категорий, включая Сухоруких и фото выставок"
        when: "Строится общий вид без темы"
        then:
          - "Остаются только работы художницы"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-3"
        given:
          - "Галерея на проде"
        when: "Выбирается размер и «в наличии»"
        then:
          - "Адрес содержит параметры фильтра, список не пуст или показан пустой результат со сбросом"
        verification:
          - "automated"
        level: "e2e"

  - id: "US6"
    title: "Можно заказать картину по своему сюжету"
    priority: "P1"
    description: "Страница /order «Картина на заказ»: как проходит заказ (сюжет, размер, сроки, эскиз), форма — имя, контакт, сюжет, желаемый размер, комментарий. Отправка создаёт обращение с темой «Картина на заказ» и цель Метрики custom_order_submit. Ссылки на страницу — в hero, футере и в кнопке «Хочу похожую»."
    motivation:
      problem: "Заказные работы — значимая часть продаж, но на сайте нет страницы и формы для них."
      value: "Отдельный путь для заказов собирает обращения, которые сейчас теряются."
      consequence_if_skipped: "Заказчики, не нашедшие готовую работу, уходят."
    why_priority: "Новый источник обращений с высокой ценностью."
    independent_test: "Открыть /order, заполнить форму — обращение создано с темой «Картина на заказ», в Метрике цель custom_order_submit; страница есть в sitemap."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель на /order"
        when: "Заполняет имя, контакт и сюжет и отправляет"
        then: "Обращение сохранено с темой «Картина на заказ», показано подтверждение, отправлена цель custom_order_submit"
      - id: "AS-2"
        given: "Посетитель не заполнил обязательные поля"
        when: "Отправляет форму"
        then: "Показаны ошибки у полей, запрос не отправлен"
      - id: "AS-3"
        given: "Посетитель на странице работы нажимает «Хочу похожую»"
        when: "Переходит"
        then: "Открывается /order с упоминанием этой работы в комментарии"
    acceptance_criteria:
      - id: "AC-1"
        description: "Используется существующий публичный эндпоинт обращений, без нового backend"
        done: false
      - id: "AC-2"
        description: "Страница /order есть в sitemap и в футере"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Форма заказа с валидными данными"
        when: "Отправляется"
        then:
          - "Вызван API обращений с темой «Картина на заказ» и цель custom_order_submit"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Прод"
        when: "Открывается /order"
        then:
          - "Страница отдаёт 200, форма видна; /sitemap.xml содержит /order"
        verification:
          - "automated"
        level: "e2e"

  - id: "US7"
    title: "Водяной знак не мешает смотреть картину"
    priority: "P2"
    description: "Новый водяной знак — небольшая полупрозрачная надпись «angelamoiseenko.ru» в правом нижнем углу вместо крупной надписи по центру снизу. Новые загрузки сразу получают новый знак; существующие изображения перерендериваются из сохранённых оригиналов S3 командой администратора, которая сначала работает в режиме проверки."
    motivation:
      problem: "Крупный знак внизу по центру мешает восприятию картины и есть даже на превью."
      value: "Картина смотрится чисто, защита авторства сохраняется."
      consequence_if_skipped: "Водяной знак портит впечатление от работ."
    why_priority: "Важно для впечатления, но требует аккуратной операции над S3."
    independent_test: "Загрузить новую работу — знак мелкий в правом нижнем углу; запустить перерендер в режиме проверки — отчёт о найденных парах оригинал/копия; запустить реально — изображения обновлены."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Администратор загружает новое изображение"
        when: "Изображение обработано"
        then: "Знак расположен в правом нижнем углу, высота текста не больше 3% меньшей стороны (минимум 12 px), непрозрачность не больше 40%; превью без знака"
      - id: "AS-2"
        given: "Для существующего изображения найден оригинал"
        when: "Администратор запускает перерендер без режима проверки"
        then: "Из оригинала созданы новые копия со знаком и превью, пути в БД обновлены, оригинал сохранён и путь к нему записан"
      - id: "AS-3"
        given: "Для изображения оригинал не найден однозначно"
        when: "Запускается перерендер"
        then: "Изображение пропускается и попадает в отчёт, текущие файлы не трогаются"
    acceptance_criteria:
      - id: "AC-1"
        description: "Путь к оригиналу сохраняется в БД для новых загрузок"
        done: false
      - id: "AC-2"
        description: "Перерендер идемпотентен, по умолчанию dry-run, доступен только администратору"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Изображение 2000×1500"
        when: "Накладывается водяной знак"
        then:
          - "Пиксели знака только в правой нижней четверти, центр снизу не изменён"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Список объектов S3: оригинал и копия со знаком с разницей во времени 3 с, и одиночная копия"
        when: "Строятся пары для перерендера"
        then:
          - "Первая копия сопоставлена с оригиналом, одиночная — в списке пропущенных"
        verification:
          - "automated"
        level: "unit"

  - id: "US8"
    title: "В описаниях работ нет сгенерированного текста"
    priority: "P2"
    description: "Абзацы, похожие на автоматическое описание изображения («На предоставленном изображении…», «На представленной картине…»), удаляются из описаний работ; фактические строки (техника, размер, место, год) сохраняются. Новый текст не придумывается."
    motivation:
      problem: "В двух описаниях оказались абзацы, сгенерированные ИИ, — это подрывает доверие."
      value: "Описания только от автора."
      consequence_if_skipped: "Покупатель видит шаблонный текст и сомневается в подлинности."
    why_priority: "Малый объём, но важен для доверия."
    independent_test: "После миграции у «Бархатный сезон» описание пустое, у «Цветы лета» осталась только строка «Холст на подрамнике , масло, 80х65, Севастополь 2012г.»."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Описание содержит фактическую строку и сгенерированный абзац"
        when: "Применяется очистка"
        then: "Остаётся только фактическая строка"
      - id: "AS-2"
        given: "Описание без сгенерированных шаблонов"
        when: "Применяется очистка"
        then: "Описание не меняется"
    acceptance_criteria:
      - id: "AC-1"
        description: "Очистка — миграция данных, применяется при старте API, повторный запуск ничего не меняет"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Описание «Холст, масло, 80х65\\n\\nНа предоставленном изображении изображён букет…»"
        when: "Вызывается функция очистки"
        then:
          - "Результат «Холст, масло, 80х65»"
        verification:
          - "automated"
        level: "unit"

edge_cases:
  - id: "EC-1"
    description: "В наличии меньше 6 работ в категориях главной"
    expected_behavior: "Сетка показывает сколько есть; при 0 блок скрыт"
  - id: "EC-2"
    description: "У работы размер только по одной стороне"
    expected_behavior: "Схема масштаба не показывается, в фильтр размера работа не попадает"
  - id: "EC-3"
    description: "Категория Сухоруких или фото выставок отсутствует или переименована"
    expected_behavior: "Галерея работает без отдельного раздела; категории определяются по имени в одном месте"
  - id: "EC-4"
    description: "S3 недоступен во время перерендера"
    expected_behavior: "Текущее изображение не меняется, ошибка в отчёте, обработка продолжается со следующего"
  - id: "EC-5"
    description: "Отправка формы заказа не удалась"
    expected_behavior: "Показана ошибка с предложением написать в мессенджер, введённые данные сохраняются в форме"

functional_requirements:
  - id: "FR-001"
    text: "The home hero MUST show the subtitle «Живопись маслом из Крыма. Работы в коллекциях 12 стран» and two actions: «Выбрать картину» linking to /gallery and «Картина на заказ» linking to /order."
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "The home page MUST show an «Сейчас в наличии» grid of 6–8 published Available artworks from home categories, each with the museum label and a link to its artwork page; the grid MUST be hidden when there are none."
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "All artwork images on the home page MUST be served through the framework image optimiser with a sizes attribute matching the grid, never as original S3 URLs."
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "A trust strip with three facts (member of the Union of Artists of Russia, works in museum collections, collectors in 12 countries) MUST appear on the home page and the artwork page."
    story_refs:
      - "US2"
  - id: "FR-005"
    text: "The home page and artwork page MUST show 2–3 published reviews with a link to all reviews; on the artwork page reviews of that artwork come first; the block is hidden without reviews."
    story_refs:
      - "US2"
  - id: "FR-006"
    text: "The artwork page MUST show a «Как купить» block covering delivery, payment, certificate of authenticity and returns, whose text is editable in the admin page-content editor under page how-to-buy, key body, with a default text when empty."
    story_refs:
      - "US3"
  - id: "FR-007"
    text: "A public endpoint MUST return the «Как купить» text (or null) without authentication."
    story_refs:
      - "US3"
  - id: "FR-008"
    text: "The artwork page MUST show a scale diagram with a ~200 cm sofa and the artwork rectangle proportional to WidthCm × HeightCm when both are known."
    story_refs:
      - "US4"
  - id: "FR-009"
    text: "The gallery MUST provide combinable filters by theme (category), size S (longer side ≤ 40 cm), M (≤ 80 cm), L (> 80 cm) and «только в наличии», reflected in the URL query, with a result count and reset."
    story_refs:
      - "US5"
  - id: "FR-010"
    text: "Works of Vsevolod Sukhorukikh MUST be excluded from the default gallery view and available as a separate section labelled with his authorship; exhibition photos MUST be excluded from the gallery and shown on the About page."
    story_refs:
      - "US5"
  - id: "FR-011"
    text: "A /order page MUST describe the custom-order process and provide a form (name, contact, subject, desired size, comment) that posts to the existing contact-message endpoint with subject «Картина на заказ» and fires the Metrika goal custom_order_submit."
    story_refs:
      - "US6"
  - id: "FR-012"
    text: "/order MUST be in the sitemap and linked from the hero, the footer and the «Хочу похожую» action, which pre-fills the artwork title in the comment."
    story_refs:
      - "US6"
  - id: "FR-013"
    text: "New watermarked images MUST carry a small semi-transparent text mark in the bottom-right corner; thumbnails MUST NOT carry a watermark; the original upload path MUST be stored."
    story_refs:
      - "US7"
  - id: "FR-014"
    text: "An admin-only re-render operation MUST rebuild watermarked images and thumbnails from S3 originals, default to dry-run, report matched/skipped/failed items, never delete originals, and be idempotent."
    story_refs:
      - "US7"
  - id: "FR-015"
    text: "A data migration MUST remove LLM-generated paragraphs from artwork descriptions by known opening patterns while keeping factual lines, and MUST NOT add new text."
    story_refs:
      - "US8"

key_entities:
  - id: "E-1"
    name: "Изображение работы"
    description: "Копия со знаком, превью и новый путь к оригиналу в S3"
  - id: "E-2"
    name: "Контент «Как купить»"
    description: "Запись контента страницы how-to-buy/body"
  - id: "E-3"
    name: "Обращение «Картина на заказ»"
    description: "Существующее обращение с темой «Картина на заказ» и полями формы в тексте"

success_criteria:
  - id: "SC-001"
    description: "Главная на мобильном загружается (событие load) быстрее 5 секунд вместо ~30"
    measurable_via: "Playwright на проде"
  - id: "SC-002"
    description: "Не меньше 3 обращений «Картина на заказ» за 30 дней после релиза"
    measurable_via: "Админка обращений и цель Метрики custom_order_submit"
  - id: "SC-003"
    description: "Доля переходов «галерея → работа» растёт не меньше чем на 10% за 30 дней"
    measurable_via: "Яндекс.Метрика"
  - id: "SC-004"
    description: "0 описаний работ с шаблонами сгенерированного текста"
    measurable_via: "Запрос к публичному API галереи"

assumptions:
  - id: "A-1"
    description: "Решения ревизии дизайна 2026-10-02 утверждены пользователем: 3 фичи по очереди, стиль «Мастерская у моря», «Как купить» редактируется в админке, водяной знак перерендеривается из оригиналов"
  - id: "A-2"
    description: "Факты полосы доверия (Союз художников России, музейные собрания, 12 стран) взяты из биографии на сайте"
  - id: "A-3"
    description: "Оригиналы загрузок хранятся в S3 под artworks/{guid}.ext, но путь к ним в БД не записан; пары оригинал/копия восстанавливаются по времени загрузки объектов (оригинал, затем превью, затем копия в пределах 120 с) и расширению"
  - id: "A-4"
    description: "Фильтр по цене не вводится, так как ни у одной работы нет цены"
  - id: "A-5"
    description: "Категории определяются по имени: «Пейзажи Всеволода Сухоруких», «Фото с выставок»"

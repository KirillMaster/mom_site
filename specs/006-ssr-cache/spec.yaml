feature: "Кэширование серверного рендеринга публичных страниц"
branch: "feature/006-ssr-cache"
created: "2026-10-02"
status: "Draft"
input: "ISR-кэш в файловой системе для всех публичных страниц: быстрая отдача HTML поисковикам и посетителям, мгновенное обновление после правок в админке, устойчивость к недоступности API."

user_stories:
  - id: "US1"
    title: "Публичные страницы отдаются из кэша"
    priority: "P1"
    description: "Посетитель и поисковый бот получают готовый HTML любой публичной страницы (главная, галерея, страница работы, видео, о художнице, контакты, отзывы) без ожидания запроса к API."
    motivation:
      problem: "Сейчас каждая страница рендерится заново на каждый запрос с обращением к API — медленный TTFB и нагрузка на сервер."
      value: "TTFB < 200 мс, лучше ранжирование и Core Web Vitals."
      consequence_if_skipped: "Страницы работ открываются медленно, страдает SEO."
    why_priority: "Основная цель фичи."
    independent_test: "Повторный запрос страницы работы отдаёт закэшированный HTML (заголовок x-nextjs-cache: HIT) быстрее 200 мс."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Страница работы уже открывалась"
        when: "Её открывают повторно"
        then: "HTML отдаётся из кэша, TTFB < 200 мс"
      - id: "AS-2"
        given: "Страница работы ещё не открывалась после деплоя"
        when: "Её открывают впервые"
        then: "Страница рендерится и сохраняется в кэш; следующий запрос — из кэша"
      - id: "AS-3"
        given: "Кэш страницы старше часа"
        when: "Её открывают"
        then: "Отдаётся сохранённая версия, в фоне строится свежая"
    acceptance_criteria:
      - id: "AC-1"
        description: "Все публичные страницы кэшируются (без принудительно динамического рендера)"
        done: false
      - id: "AC-2"
        description: "Время жизни кэша — 1 час"
        done: false
      - id: "AC-3"
        description: "Сборка не обращается к API"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Собранный фронт и работающий API"
        when: "Страница запрашивается дважды"
        then:
          - "Второй ответ имеет x-nextjs-cache HIT"
        verification:
          - "automated"
        level: "e2e"
      - id: "TS-2"
        given:
          - "Исходники публичных страниц"
        when: "Проверяется конфигурация сегментов"
        then:
          - "Нет force-dynamic, revalidate = 3600"
        verification:
          - "automated"
        level: "unit"

  - id: "US2"
    title: "Правки в админке сразу видны на сайте"
    priority: "P1"
    description: "После сохранения любой правки в админке публичные страницы обновляются без ожидания истечения кэша."
    motivation:
      problem: "С кэшем на час правки владелицы появлялись бы с задержкой."
      value: "Админка остаётся самодостаточной и предсказуемой."
      consequence_if_skipped: "Владелица видит старые данные и думает, что сохранение не сработало."
    why_priority: "Без инвалидации кэш ломает UX админки."
    independent_test: "Изменить название работы в админке — через несколько секунд публичная страница показывает новое название."
    acceptance_scenarios:
      - id: "AS-4"
        given: "Страница работы закэширована"
        when: "Администратор меняет название и сохраняет"
        then: "В течение 10 секунд публичная страница и галерея показывают новое название"
      - id: "AS-5"
        given: "Запрос на сброс кэша без верного секрета"
        when: "Он отправлен"
        then: "Запрос отклоняется, кэш не сбрасывается"
      - id: "AS-6"
        given: "Сброс кэша недоступен (фронт не отвечает)"
        when: "Администратор сохраняет правку"
        then: "Сохранение в админке проходит успешно, ошибка сброса только логируется"
    acceptance_criteria:
      - id: "AC-4"
        description: "Любая успешная запись в админке инициирует сброс кэша всех публичных страниц"
        done: false
      - id: "AC-5"
        description: "Сброс защищён секретом и недоступен извне сайта"
        done: false
      - id: "AC-6"
        description: "Сбой сброса не ломает сохранение"
        done: false
    test_scenarios:
      - id: "TS-3"
        given:
          - "Admin API"
        when: "Выполняется успешный POST/PUT/DELETE админки"
        then:
          - "Вызван сброс кэша фронта"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-4"
        given:
          - "Endpoint сброса"
        when: "Запрос без секрета или с неверным секретом"
        then:
          - "401, сброс не выполнен"
        verification:
          - "automated"
        level: "unit"

  - id: "US3"
    title: "Кэш прогрет после деплоя и после сброса"
    priority: "P2"
    description: "Сразу после деплоя и после сброса кэша все страницы из sitemap рендерятся заранее, чтобы первый посетитель и бот не ждали."
    motivation:
      problem: "После деплоя кэш пуст, первые запросы медленные."
      value: "Стабильно быстрый TTFB для ботов."
      consequence_if_skipped: "Первые визиты после деплоя медленные."
    why_priority: "Улучшение поверх основного кэша."
    independent_test: "После деплоя первый запрос страницы работы — HIT."
    acceptance_scenarios:
      - id: "AS-7"
        given: "Деплой завершён, healthcheck пройден"
        when: "Скрипт деплоя завершается"
        then: "Все URL из sitemap запрошены с ограниченным параллелизмом"
      - id: "AS-8"
        given: "Кэш сброшен из админки"
        when: "Проходит минута"
        then: "Страницы из sitemap снова в кэше"
    acceptance_criteria:
      - id: "AC-7"
        description: "Прогрев по sitemap после деплоя с параллелизмом 3"
        done: false
      - id: "AC-8"
        description: "Фоновый прогрев после сброса кэша"
        done: false
    test_scenarios:
      - id: "TS-5"
        given:
          - "sitemap с N URL"
        when: "Запущен прогрев"
        then:
          - "Все N URL запрошены, не более 3 одновременно"
        verification:
          - "automated"
        level: "unit"

  - id: "US4"
    title: "Сайт работает при недоступном API"
    priority: "P2"
    description: "Если API временно недоступен, посетители видят последнюю закэшированную версию страниц."
    motivation:
      problem: "Сейчас при падении API публичные страницы ломаются."
      value: "Устойчивость и сохранение позиций в поиске."
      consequence_if_skipped: "Бот может проиндексировать страницу ошибки."
    why_priority: "Защитное поведение."
    independent_test: "Остановить API — закэшированная страница работы по-прежнему отдаётся с 200."
    acceptance_scenarios:
      - id: "AS-9"
        given: "Страница закэширована, API остановлен"
        when: "Кэш устарел и страницу запрашивают"
        then: "Отдаётся последняя версия, ошибка фоновой регенерации не заменяет кэш"
    acceptance_criteria:
      - id: "AC-9"
        description: "Ошибка получения данных при регенерации не перезаписывает кэш пустой страницей"
        done: false
    test_scenarios:
      - id: "TS-6"
        given:
          - "Функция загрузки данных страницы"
        when: "API отвечает ошибкой"
        then:
          - "Функция бросает исключение, а не возвращает пустые данные"
        verification:
          - "automated"
        level: "unit"

edge_cases:
  - id: "EC-1"
    description: "Старые ссылки вида /gallery?artwork=N"
    expected_behavior: "По-прежнему 301 на страницу работы, при этом страница галереи кэшируется"
  - id: "EC-2"
    description: "Несуществующий slug работы"
    expected_behavior: "404, страница ошибки не кэшируется как валидная работа"
  - id: "EC-3"
    description: "Несколько правок подряд в админке"
    expected_behavior: "Каждая сбрасывает кэш; прогрев не запускается параллельно сам с собой"
  - id: "EC-4"
    description: "Деплой нового кода"
    expected_behavior: "Кэш начинается с чистого листа"

functional_requirements:
  - id: "FR-001"
    text: "Все публичные страницы MUST рендериться статически с периодической регенерацией раз в час."
    story_refs: ["US1"]
  - id: "FR-002"
    text: "Сборка фронта MUST проходить без доступа к API; страницы строятся при первом запросе."
    story_refs: ["US1"]
  - id: "FR-003"
    text: "WHEN администратор успешно сохраняет любые данные THEN система MUST сбросить кэш всех публичных страниц."
    story_refs: ["US2"]
  - id: "FR-004"
    text: "Сброс кэша MUST требовать секрет и MUST быть недоступен из интернета."
    story_refs: ["US2"]
  - id: "FR-005"
    text: "Ошибка сброса кэша MUST NOT влиять на результат операции в админке."
    story_refs: ["US2"]
  - id: "FR-006"
    text: "После деплоя и после сброса кэша система MUST прогреть все URL из sitemap с параллелизмом не более 3."
    story_refs: ["US3"]
  - id: "FR-007"
    text: "Ошибка загрузки данных при регенерации MUST NOT заменять закэшированную страницу."
    story_refs: ["US4"]
  - id: "FR-008"
    text: "Старые ссылки /gallery?artwork=N MUST продолжать перенаправлять на страницу работы."
    story_refs: ["US1"]

key_entities: []

success_criteria:
  - id: "SC-001"
    description: "TTFB закэшированной страницы работы на проде < 200 мс"
    measurable_via: "curl -w %{time_starttransfer} на проде"
  - id: "SC-002"
    description: "Правка в админке видна на сайте в течение 10 секунд"
    measurable_via: "E2E/ручная проверка на проде"
  - id: "SC-003"
    description: "Первый запрос страницы работы после деплоя — из кэша"
    measurable_via: "Заголовок x-nextjs-cache на проде"

assumptions:
  - id: "A-1"
    description: "Кэш хранится в файловой системе контейнера фронта без volume и сбрасывается при деплое."
  - id: "A-2"
    description: "Сброс кэша — целиком для всех публичных страниц; точечная инвалидация не нужна при текущем объёме (~300 страниц)."

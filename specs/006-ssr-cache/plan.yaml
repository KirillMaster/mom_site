feature: "Кэширование серверного рендеринга публичных страниц"
branch: "feature/006-ssr-cache"
summary: "Перевод публичных страниц Next.js 14 с force-dynamic на ISR (revalidate 3600, файловый кэш .next/cache внутри контейнера), загрузчики данных бросают ошибку вместо отдачи пустой страницы, backend после каждой успешной записи в админке fire-and-forget вызывает внутренний POST /internal/revalidate на фронте (секрет X-Revalidate-Secret), фронт делает revalidatePath('/', 'layout') и фоновый прогрев по sitemap; nginx закрывает /internal извне; deploy_remote.sh прогревает кэш после healthcheck."

technical_context:
  language_version: "TypeScript strict, Next.js 14.0 App Router; C# / .NET 8"
  primary_dependencies:
    - "Next.js ISR (segment config revalidate, revalidatePath)"
    - "ASP.NET Core 8 IHttpClientFactory + action filter / MediatR-независимый сервис"
    - "nginx (reverse proxy), Docker Compose prod, bash deploy_remote.sh"
  storage: "файловый кэш Next (.next/cache, .next/server/app) в контейнере фронта, без volume"
  testing: "Jest (route handler, warmup, конфигурация сегментов), xUnit + WebApplicationFactory (вызов инвалидации), Playwright/curl (x-nextjs-cache HIT на проде)"
  target_platform: "Linux Docker (prod)"
  project_type: "web_application"
  performance_goals: "TTFB закэшированной страницы < 200 мс; прогрев ~300 URL с параллелизмом 3"
  constraints: "сборка без доступа к API; админка не кэшируется; ошибка инвалидации не влияет на ответ админки; файлы ≤ 200 строк, функции ≤ 50"
  scale_scope: "~300 публичных URL, 1 администратор, 1 инстанс фронта"

constitution_check:
  - principle_id: "P1"
    status: "pass"
    justification: "spec/plan/tasks через yamlkit, реализация через bob-pipeline"
  - principle_id: "P2"
    status: "pass"
    justification: "интерфейс ICacheInvalidator в Core, HTTP-реализация в Infrastructure, фильтр в API"
  - principle_id: "P3"
    status: "pass"
    justification: "маленькие модули: route handler, warmup, invalidator"
  - principle_id: "P4"
    status: "pass"
    justification: "секрет в заголовке, сравнение constant-time, /internal закрыт в nginx (deny all / 404)"
  - principle_id: "P5"
    status: "pass"
    justification: "unit (jest/xUnit), integration (WebApplicationFactory), e2e проверка заголовков на проде"
  - principle_id: "P6"
    status: "pass"
    justification: "ветка feature/006-ssr-cache, PR в main"
  - principle_id: "P7"
    status: "pass"
    justification: "полный HTML из кэша для ботов, нет кэширования страниц-ошибок"
  - principle_id: "P8"
    status: "pass"
    justification: "основная цель — производительность (TTFB)"
  - principle_id: "P9"
    status: "pass"
    justification: "правки владелицы видны в течение 10 секунд"
  - principle_id: "P10"
    status: "not_applicable"

project_structure:
  layout: "web_application"
  description: "Существующая структура: backend (Clean Architecture), frontend (Next.js App Router), инфраструктура в корне."
  directories:
    - "frontend/app/*/page.tsx, frontend/app/layout.tsx (revalidate вместо force-dynamic, generateStaticParams)"
    - "frontend/app/internal/revalidate/route.ts"
    - "frontend/lib/cacheWarmup.ts"
    - "backend/MomSite.Core/Interfaces/ICacheInvalidator.cs"
    - "backend/MomSite.Infrastructure/Services/FrontendCacheInvalidator.cs"
    - "backend/MomSite.API/Filters/InvalidateCacheFilter.cs"
    - "nginx.conf, docker-compose.prod.yml, scripts/deploy_remote.sh"

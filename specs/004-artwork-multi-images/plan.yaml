feature: "Несколько фотографий одной картины"
branch: "feature/004-artwork-multi-images"
summary: "Новая сущность ArtworkImage (1..10 фото на работу, SortOrder 0 = обложка, поля Artwork.ImagePath/ThumbnailPath синхронизируются с обложкой), EF-миграция с переносом текущих фото, admin endpoints для добавления/удаления/порядка, публичный DTO отдаёт images[]; на фронте — серверно-рендеримая галерея (миниатюры на десктопе, scroll-snap карусель на мобайле) с существующим yet-another-react-lightbox, мультизагрузка с drag&drop в админке, бейдж количества в сетке."

technical_context:
  language_version: "C# / .NET 8; TypeScript strict, Next.js 14.0 App Router, React 18"
  primary_dependencies:
    - "ASP.NET Core 8, EF Core 8 + Npgsql"
    - "существующий IImageService (S3 Timeweb, миниатюра 300x300, водяной знак)"
    - "Next.js 14, Tailwind, @tanstack/react-query (админка)"
    - "yet-another-react-lightbox + Zoom (уже в проекте)"
  storage: "PostgreSQL (таблица ArtworkImages), S3 для файлов"
  testing: "xUnit + WebApplicationFactory (Testing env, EnsureCreated); Jest + RTL; Playwright"
  target_platform: "Linux Docker (prod), браузеры десктоп/мобайл"
  project_type: "web_application"
  performance_goals: "Lighthouse 90+, без CLS при переключении фото, основное фото priority, остальные lazy"
  constraints: "без новых библиотек каруселей; обратная совместимость публичного DTO; файлы ≤ 200 строк (стремиться), функции ≤ 50 строк"
  scale_scope: "десятки–сотни работ, 1 администратор"

constitution_check:
  - principle_id: "P1"
    status: "pass"
    justification: "spec/plan/tasks через yamlkit, реализация через bob-pipeline"
  - principle_id: "P2"
    status: "pass"
    justification: "сущность в Core, конфигурация EF в Infrastructure, endpoints и DTO в API"
  - principle_id: "P3"
    status: "pass"
    justification: "логику порядка/обложки выносим в небольшой сервис, компоненты галереи разбиты на мелкие"
  - principle_id: "P4"
    status: "pass"
    justification: "новые endpoints под [Authorize], валидация файлов и id на backend"
  - principle_id: "P5"
    status: "pass"
    justification: "unit+integration (xUnit), компонентные (Jest), e2e (Playwright) на каждый слайс"
  - principle_id: "P6"
    status: "pass"
    justification: "ветка feature/004-artwork-multi-images, PR в main"
  - principle_id: "P7"
    status: "pass"
    justification: "все фото в SSR-HTML, JSON-LD image[], alt «Название — фото N»"
  - principle_id: "P8"
    status: "pass"
    justification: "фото из S3, lazy для неосновных, фиксированный aspect-контейнер против CLS"
  - principle_id: "P9"
    status: "pass"
    justification: "русские сообщения, подтверждение удаления, e2e админки; ручная проверка владелицей"
  - principle_id: "P10"
    status: "pass"
    justification: "mobile-first карусель на CSS scroll-snap, минимум JS"

project_structure:
  layout: "web_application"
  description: "Существующая структура: backend (Clean Architecture) и frontend (Next.js App Router)."
  directories:
    - "backend/MomSite.Core/Models/ (ArtworkImage, Artwork.Images)"
    - "backend/MomSite.Infrastructure/Data/ (DbContext config, Migrations/AddArtworkImages)"
    - "backend/MomSite.API/Controllers/ (ArtworkImagesController или расширение ArtworksController)"
    - "backend/MomSite.API/DTOs/ (ArtworkImageDto, images[] в ArtworkDto/ArtworkAdminDto)"
    - "backend/MomSite.Tests/"
    - "frontend/app/gallery/[slug]/ (ArtworkGallery, ArtworkViewer)"
    - "frontend/app/gallery/ (бейдж в сетке)"
    - "frontend/app/admin/artworks/ (мультизагрузка, менеджер фото)"
    - "frontend/lib/api.ts, frontend/hooks/useApi.ts"
    - "frontend/e2e/"

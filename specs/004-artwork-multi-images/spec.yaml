feature: "Несколько фотографий одной картины"
branch: "feature/004-artwork-multi-images"
created: "2026-10-02"
status: "Draft"
input: "Несколько фотографий одной картины: загрузка нескольких изображений в админке, галерея изображений на странице картины в духе theograce.com, бейдж количества фото в сетке галереи. Цель — SEO и удобный UI/UX."

user_stories:
  - id: "US1"
    title: "Загрузка и управление несколькими фото картины в админке"
    priority: "P1"
    description: "Владелица сайта добавляет к картине несколько фотографий (общий вид, детали, в интерьере), удаляет лишние, меняет порядок и выбирает обложку — без помощи разработчика."
    motivation:
      problem: "Сейчас у картины может быть только одно фото, детали фактуры и вид в интерьере показать нельзя."
      value: "Покупатель видит работу со всех сторон, растёт доверие и конверсия в запрос цены."
      consequence_if_skipped: "Публичная галерея на странице работы не получит контента."
    why_priority: "Без контента в админке публичная галерея бессмысленна."
    independent_test: "В админке загрузить 3 фото к работе, поменять порядок, сделать второе обложкой, удалить одно — после перезагрузки состояние сохранено."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Работа с одним фото открыта на редактирование"
        when: "Администратор выбирает или перетаскивает 3 файла и сохраняет"
        then: "У работы 4 фото, превью видны до сохранения, порядок — в порядке выбора, обложка не изменилась"
      - id: "AS-2"
        given: "У работы 4 фото"
        when: "Администратор перетаскивает фото в новый порядок"
        then: "Новый порядок сохраняется и отображается на публичной странице"
      - id: "AS-3"
        given: "У работы 4 фото"
        when: "Администратор нажимает «Сделать обложкой» у третьего фото"
        then: "Это фото становится первым, и именно оно показывается в сетке галереи, превью соцсетей и sitemap"
      - id: "AS-4"
        given: "У работы 4 фото"
        when: "Администратор удаляет одно фото и подтверждает"
        then: "Остаётся 3 фото; если удалена обложка — обложкой становится следующее фото"
      - id: "AS-5"
        given: "У работы 10 фото"
        when: "Администратор пытается добавить ещё"
        then: "Загрузка отклоняется с понятным сообщением на русском о лимите 10 фото"
    acceptance_criteria:
      - id: "AC-1"
        description: "Можно выбрать несколько файлов сразу и перетащить файлы в область загрузки; превью показываются до сохранения"
        done: false
      - id: "AC-2"
        description: "Можно удалить отдельное фото с подтверждением"
        done: false
      - id: "AC-3"
        description: "Можно изменить порядок перетаскиванием и назначить обложку"
        done: false
      - id: "AC-4"
        description: "Лимиты 10 фото на работу и 15 МБ на файл соблюдаются с понятными сообщениями"
        done: false
      - id: "AC-5"
        description: "Нельзя удалить последнее фото работы"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Работа с одним фото"
        when: "Через admin API загружаются 3 изображения"
        then:
          - "У работы 4 изображения с порядком 0..3"
          - "Обложка работы не изменилась"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-2"
        given:
          - "Работа с 4 фото"
        when: "Отправляется новый порядок"
        then:
          - "Порядок сохранён"
          - "Обложка работы совпадает с первым фото"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-3"
        given:
          - "Работа с 10 фото"
        when: "Загружается ещё одно"
        then:
          - "Ответ 400 с сообщением о лимите, фото не добавлено"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-4"
        given:
          - "Работа с одним фото"
        when: "Удаляется единственное фото"
        then:
          - "Ответ 400, фото не удалено"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-5"
        given:
          - "Админ-форма редактирования работы с 3 фото"
        when: "Пользователь удаляет фото, меняет порядок и назначает обложку"
        then:
          - "UI отображает актуальный список, вызываются соответствующие операции"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-6"
        given:
          - "Залогиненный администратор"
        when: "Загружает 2 фото к работе в браузере"
        then:
          - "Фото видны в админке и на публичной странице работы"
        verification:
          - "automated"
        level: "e2e"

  - id: "US2"
    title: "Галерея фото на странице картины"
    priority: "P1"
    description: "Посетитель на странице картины видит основное фото и может просмотреть все остальные: на компьютере — через миниатюры, на телефоне — свайпом; любое фото открывается в полноэкранном просмотре с зумом и листанием."
    motivation:
      problem: "Посетитель видит только одно фото и не может оценить детали и масштаб работы."
      value: "Удобный просмотр как в современных арт-магазинах повышает вовлечённость и запросы цены."
      consequence_if_skipped: "Загруженные доп. фото никто не увидит."
    why_priority: "Это основная пользовательская ценность фичи."
    independent_test: "Открыть страницу работы с 4 фото на десктопе и мобильном: переключить миниатюрой, свайпнуть, открыть полноэкранный просмотр и пролистать стрелками."
    acceptance_scenarios:
      - id: "AS-6"
        given: "Работа с 4 фото, десктоп"
        when: "Посетитель кликает по третьей миниатюре"
        then: "Основное фото меняется на третье, миниатюра выделена как активная"
      - id: "AS-7"
        given: "Открыто основное фото N"
        when: "Посетитель кликает по нему"
        then: "Открывается полноэкранный просмотр с зумом на фото N; стрелки и клавиши ←/→ листают все фото; Esc закрывает"
      - id: "AS-8"
        given: "Работа с 4 фото, мобильный экран"
        when: "Посетитель свайпает влево"
        then: "Показывается следующее фото, точки-индикаторы отражают текущую позицию; миниатюр нет"
      - id: "AS-9"
        given: "Работа с одним фото"
        when: "Посетитель открывает страницу"
        then: "Страница выглядит как раньше: без миниатюр, точек и стрелок"
    acceptance_criteria:
      - id: "AC-6"
        description: "Десктоп: основное фото + полоса миниатюр, клик переключает"
        done: false
      - id: "AC-7"
        description: "Мобайл: свайп-карусель на всю ширину с точками"
        done: false
      - id: "AC-8"
        description: "Полноэкранный просмотр листает все фото кнопками и клавиатурой, зум сохраняется"
        done: false
      - id: "AC-9"
        description: "Одно фото — без элементов навигации"
        done: false
    test_scenarios:
      - id: "TS-7"
        given:
          - "Компонент галереи с 4 изображениями"
        when: "Клик по третьей миниатюре"
        then:
          - "Основное изображение — третье, активная миниатюра помечена aria-current"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-8"
        given:
          - "Открыт полноэкранный просмотр на фото 1 из 4"
        when: "Нажата клавиша →, затем ←, затем Esc"
        then:
          - "Показано фото 2, затем 1, затем просмотр закрыт"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-9"
        given:
          - "Компонент галереи с одним изображением"
        when: "Рендер"
        then:
          - "Нет миниатюр, точек и стрелок"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-10"
        given:
          - "Работа с несколькими фото на проде/стенде"
        when: "Посетитель открывает страницу на десктопе и в мобильном viewport"
        then:
          - "Миниатюры переключают фото; на мобильном свайп и точки работают"
        verification:
          - "automated"
        level: "e2e"

  - id: "US3"
    title: "SEO всех фото картины"
    priority: "P1"
    description: "Поисковые системы видят все фото картины в серверном HTML и в структурированных данных, что улучшает индексацию в поиске по картинкам."
    motivation:
      problem: "Поисковики знают только одно изображение работы."
      value: "Больше изображений в Яндекс/Google Картинках, богаче сниппет."
      consequence_if_skipped: "Доп. фото не дают SEO-эффекта."
    why_priority: "SEO — приоритет №1 публичной части по конституции."
    independent_test: "curl страницы работы без JS: в HTML присутствуют все фото с alt, в JSON-LD image — массив всех URL."
    acceptance_scenarios:
      - id: "AS-10"
        given: "Работа «Сирень» с 3 фото"
        when: "Поисковый бот запрашивает страницу без выполнения JS"
        then: "В HTML есть 3 изображения с alt «Сирень — фото 1/2/3», JSON-LD содержит image из 3 URL, первое — обложка"
    acceptance_criteria:
      - id: "AC-10"
        description: "Все фото присутствуют в серверном HTML с alt «Название — фото N»"
        done: false
      - id: "AC-11"
        description: "Structured data image — массив всех фото, обложка первой"
        done: false
      - id: "AC-12"
        description: "Основное фото загружается приоритетно, остальные лениво"
        done: false
    test_scenarios:
      - id: "TS-11"
        given:
          - "Данные работы с 3 изображениями"
        when: "Серверный рендер страницы работы"
        then:
          - "В разметке 3 img с alt «Название — фото N»"
          - "JSON-LD image — массив из 3 URL"
        verification:
          - "automated"
        level: "unit"

  - id: "US4"
    title: "Бейдж количества фото в сетке галереи"
    priority: "P3"
    description: "В сетке галереи карточка работы с несколькими фото показывает небольшой бейдж с количеством фото."
    motivation:
      problem: "Посетитель не знает, что у работы есть дополнительные фото."
      value: "Стимулирует переход на страницу работы."
      consequence_if_skipped: "Доп. фото менее заметны."
    why_priority: "Приятное дополнение, не блокирует основную ценность."
    independent_test: "В сетке у работы с 3 фото виден бейдж «3», у работы с 1 фото бейджа нет."
    acceptance_scenarios:
      - id: "AS-11"
        given: "Работа с 3 фото и работа с 1 фото в сетке"
        when: "Посетитель открывает /gallery"
        then: "У первой бейдж с числом 3, у второй бейджа нет; карточки показывают обложки"
    acceptance_criteria:
      - id: "AC-13"
        description: "Бейдж показывается только при количестве фото больше 1"
        done: false
    test_scenarios:
      - id: "TS-12"
        given:
          - "Карточки работ с 3 и 1 фото"
        when: "Рендер сетки"
        then:
          - "Бейдж «3» только у первой"
        verification:
          - "automated"
        level: "unit"

edge_cases:
  - id: "EC-1"
    description: "Существующие работы до фичи имеют одно фото"
    expected_behavior: "После обновления каждая работа имеет ровно одно фото-обложку, совпадающее с прежним; публичные страницы не меняются"
  - id: "EC-2"
    description: "Удаление фото-обложки"
    expected_behavior: "Обложкой становится следующее по порядку фото"
  - id: "EC-3"
    description: "Попытка удалить последнее фото"
    expected_behavior: "Операция отклоняется с сообщением, что у работы должно быть хотя бы одно фото"
  - id: "EC-4"
    description: "Файл не изображение или больше 15 МБ"
    expected_behavior: "Файл отклоняется с понятным сообщением, остальные файлы пакета не теряются молча (сообщение говорит, что именно не загружено)"
  - id: "EC-5"
    description: "Порядок содержит чужие или несуществующие id фото"
    expected_behavior: "Запрос отклоняется, порядок не меняется"
  - id: "EC-6"
    description: "Удаление работы целиком"
    expected_behavior: "Удаляются все её фото"
  - id: "EC-7"
    description: "Создание новой работы с несколькими фото сразу"
    expected_behavior: "Первое выбранное фото становится обложкой, остальные добавляются по порядку"

functional_requirements:
  - id: "FR-001"
    text: "The system MUST хранить у каждой работы упорядоченный список от 1 до 10 фото, где первое фото — обложка."
    story_refs: ["US1"]
  - id: "FR-002"
    text: "The system MUST поддерживать прежние поля основного изображения и миниатюры работы равными обложке после любой операции с фото."
    story_refs: ["US1", "US3"]
  - id: "FR-003"
    text: "WHEN система обновляется THEN каждая существующая работа MUST получить ровно одно фото, равное её текущему изображению."
    story_refs: ["US1"]
  - id: "FR-004"
    text: "The admin MUST иметь возможность добавить одно или несколько фото к работе за одну операцию; каждое фото проходит прежнюю обработку (оптимизация, миниатюра, хранение в объектном хранилище)."
    story_refs: ["US1"]
  - id: "FR-005"
    text: "The system MUST отклонять добавление, если итоговое число фото превысит 10, или файл больше 15 МБ, или не является изображением, с понятным сообщением на русском."
    story_refs: ["US1"]
  - id: "FR-006"
    text: "The admin MUST иметь возможность удалить отдельное фото (с подтверждением); удаление последнего фото MUST отклоняться."
    story_refs: ["US1"]
  - id: "FR-007"
    text: "The admin MUST иметь возможность задать новый порядок фото и назначить обложку; порядок с id, не принадлежащими работе, MUST отклоняться."
    story_refs: ["US1"]
  - id: "FR-008"
    text: "Все операции с фото MUST быть доступны только авторизованному администратору."
    story_refs: ["US1"]
  - id: "FR-009"
    text: "Публичные данные галереи MUST содержать у каждой работы упорядоченный список её фото."
    story_refs: ["US2", "US3", "US4"]
  - id: "FR-010"
    text: "Страница работы MUST на широких экранах показывать основное фото и полосу миниатюр, на узких — свайп-карусель с индикатором позиции; при одном фото — без элементов навигации."
    story_refs: ["US2"]
  - id: "FR-011"
    text: "Полноэкранный просмотр MUST открываться на текущем фото, листать все фото кнопками и клавишами ←/→, закрываться по Esc и сохранять зум."
    story_refs: ["US2"]
  - id: "FR-012"
    text: "Серверный HTML страницы работы MUST содержать все фото с alt «Название — фото N», а структурированные данные — массив всех изображений с обложкой первой."
    story_refs: ["US3"]
  - id: "FR-013"
    text: "Основное фото MUST загружаться приоритетно, остальные — лениво."
    story_refs: ["US3"]
  - id: "FR-014"
    text: "Карточка в сетке галереи MUST показывать обложку и бейдж с количеством фото, если их больше одного."
    story_refs: ["US4"]
  - id: "FR-015"
    text: "Удаление работы MUST удалять все её фото."
    story_refs: ["US1"]

key_entities:
  - id: "E-1"
    name: "Artwork (Работа)"
    description: "Картина; сохраняет поля обложки для обратной совместимости и владеет упорядоченным списком фото."
  - id: "E-2"
    name: "ArtworkImage (Фото работы)"
    description: "Одно фото работы: путь к изображению, путь к миниатюре, порядковый номер (0 — обложка)."

success_criteria:
  - id: "SC-001"
    description: "Владелица добавляет 5 фото к работе и настраивает порядок менее чем за 2 минуты без помощи"
    measurable_via: "Ручная проверка пользователем в админке"
  - id: "SC-002"
    description: "100% фото работы присутствуют в HTML, который получает поисковый бот без JS"
    measurable_via: "curl страницы работы на проде и подсчёт изображений"
  - id: "SC-003"
    description: "Страница работы с несколькими фото сохраняет оценку производительности Lighthouse 90+ и не даёт сдвигов макета при переключении фото"
    measurable_via: "Lighthouse на проде"
  - id: "SC-004"
    description: "Существующие работы после обновления выглядят идентично прежним"
    measurable_via: "E2E/визуальная проверка страниц работ с одним фото"

assumptions:
  - id: "A-1"
    description: "Подписи к отдельным фото не нужны, alt генерируется автоматически."
  - id: "A-2"
    description: "Сохранение порядка и обложки в админке применяется сразу (отдельными операциями), а новые файлы при редактировании загружаются при сохранении формы."
  - id: "A-3"
    description: "Полноэкранный просмотр — существующий лайтбокс с зумом, расширенный листанием."
  - id: "A-4"
    description: "Внешние библиотеки каруселей не используются."

feature: Блог художницы для органического трафика
branch: feature/005-growth-foundation
created: '2026-10-02'
status: Draft
status_note: 'Вход — research.md (решения по хранению, SEO, модели, UX). Вопросы владельцу из research §10 закрыты допущениями A-1…A-7; ответы мамы могут поменять только тексты и рубрики, не объём MVP'
input: 'Формат блога для SEO и органики: мама пишет сама в админке, статьи связаны с работами и ведут к контакту; Яндекс-ориентированное SEO'

user_stories:
  - id: US1
    title: Читатель находит и читает статью
    priority: P1
    description: 'Посетитель из поиска открывает /blog/<адрес> и читает статью с обложкой, рубрикой, датой и временем чтения; видит блок «Работы по теме» и одну кнопку связи'
    motivation:
      problem: 'На сайте нет текстового контента под информационные запросы — органика приходит только по имени художницы'
      value: 'Статьи по запросам «картина в интерьер», «пейзажи Крыма» приводят новых людей к работам'
      consequence_if_skipped: 'Сайт остаётся визиткой, зависимость от соцсетей и рекламы'
    why_priority: 'Без публичной статьи блог не даёт трафика'
    independent_test: 'Опубликованная статья открывается по адресу, в выдаче HTML есть заголовок, текст, работы и кнопка связи'
    acceptance_scenarios:
      - id: AS-1
        given: 'Опубликованная статья с 3 работами по теме'
        when: 'Посетитель открывает её адрес'
        then: 'Видит заголовок, обложку, дату, рубрику, время чтения, текст, 3 карточки работ со ссылками на их страницы и кнопку «Задать вопрос / подобрать работу»'
      - id: AS-2
        given: 'Статья в черновике или с датой публикации в будущем'
        when: 'Открывают её адрес без входа в админку'
        then: 'Страница не найдена'
    acceptance_criteria:
      - id: AC-1
        description: 'Текст статьи приходит в первом HTML-ответе (без загрузки скриптами)'
        done: false
      - id: AC-2
        description: 'Проданные работы в блоке показываются без призыва к покупке'
        done: false
      - id: AC-3
        description: 'Клик по кнопке связи ведёт в контакты и фиксируется как цель аналитики'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Статья опубликована']
        when: 'Запрос публичной статьи по адресу'
        then: ['Ответ содержит статью и работы по теме']
        verification: [automated]
        level: integration
      - id: TS-2
        given: ['Статья — черновик']
        when: 'Публичный запрос по адресу'
        then: ['Не найдено']
        verification: [automated]
        level: integration
      - id: TS-3
        given: ['Опубликованная статья']
        when: 'Открыть страницу в браузере на телефоне'
        then: ['Статья читается, кнопка связи ведёт в контакты']
        verification: [automated]
        level: e2e

  - id: US2
    title: Список статей и рубрики
    priority: P1
    description: 'Посетитель открывает «Блог» из меню, листает список статей по страницам и фильтрует по рубрике'
    motivation:
      problem: 'Без индекса статьи не связаны между собой и с меню'
      value: 'Перелинковка и вход в блог из навигации'
      consequence_if_skipped: 'Статьи — сироты, хуже индексируются'
    why_priority: 'Нужен для навигации и индексации'
    independent_test: 'На /blog видны опубликованные статьи по 12 на страницу; страница рубрики показывает только её статьи и описание'
    acceptance_scenarios:
      - id: AS-1
        given: '15 опубликованных статей'
        when: 'Открывают «Блог»'
        then: '12 новых сверху, ссылка на вторую страницу'
      - id: AS-2
        given: 'Рубрика без опубликованных статей'
        when: 'Открывают её адрес'
        then: 'Страница не найдена'
    acceptance_criteria:
      - id: AC-1
        description: 'Ссылка «Блог» есть в меню и футере'
        done: false
      - id: AC-2
        description: 'Страница рубрики показывает её название и описание'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Статьи в двух рубриках']
        when: 'Запрос списка с фильтром рубрики'
        then: ['Только статьи рубрики, по дате убыв.']
        verification: [automated]
        level: integration

  - id: US3
    title: Мама пишет и публикует статью сама
    priority: P1
    description: 'В админке мама создаёт статью в визуальном редакторе (как в Word), вставляет картинки, выбирает рубрику и работы по теме, смотрит предпросмотр и публикует сразу или на дату'
    motivation:
      problem: 'Любая публикация сейчас требует разработчика'
      value: 'Регулярные статьи без участия разработчика'
      consequence_if_skipped: 'Блог не будет пополняться'
    why_priority: 'Блог живёт только при самостоятельной публикации'
    independent_test: 'Нетехнический пользователь создаёт статью с картинкой и 3 работами и публикует её без подсказок разработчика'
    acceptance_scenarios:
      - id: AS-1
        given: 'Админ в редакторе новой статьи'
        when: 'Вводит заголовок, текст с подзаголовком и картинкой, выбирает рубрику и работы, нажимает «Опубликовать»'
        then: 'Статья видна на сайте; адрес сформирован из заголовка автоматически'
      - id: AS-2
        given: 'Статья не заполнена (нет обложки, анонса или работ)'
        when: 'Нажимает «Опубликовать»'
        then: 'Видит мягкий чек-лист с недостающим и может опубликовать всё равно'
      - id: AS-3
        given: 'Вкладка закрыта случайно во время правки'
        when: 'Открывает редактор снова'
        then: 'Предлагается восстановить несохранённый текст'
    acceptance_criteria:
      - id: AC-1
        description: 'В редакторе только подзаголовки двух уровней, список, цитата, ссылка, картинка; у картинки обязательна подпись для поисковиков'
        done: false
      - id: AC-2
        description: 'Вставка картинки из буфера загружает её в хранилище, а не встраивает в текст'
        done: false
      - id: AC-3
        description: 'Адрес статьи меняется только до первой публикации'
        done: false
      - id: AC-4
        description: 'Поля для поисковиков свёрнуты, заполнены по умолчанию и показывают счётчик символов'
        done: false
      - id: AC-5
        description: 'Статусы в списке: Черновик / Запланировано / Опубликовано'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Админ залогинен']
        when: 'Создать → опубликовать → открыть на сайте'
        then: ['Статья видна с работами']
        verification: [automated]
        level: e2e
      - id: TS-2
        given: ['Тело с script, onerror, iframe и style']
        when: 'Сохранение статьи'
        then: ['Опасная разметка удалена, разрешённая сохранена']
        verification: [automated]
        level: unit

  - id: US4
    title: Поисковики и Дзен получают статьи
    priority: P2
    description: 'Статьи попадают в sitemap с реальной датой изменения, имеют разметку для поисковиков и соцсетей, RSS-ленту для Дзена; при публикации Яндекс уведомляется'
    motivation:
      problem: 'Новые страницы индексируются медленно'
      value: 'Быстрая индексация и богатые сниппеты; кросспостинг в Дзен без ручной работы'
      consequence_if_skipped: 'Статьи неделями не появляются в поиске'
    why_priority: 'Ускоряет отдачу, но блог работает и без неё'
    independent_test: 'В sitemap и RSS есть опубликованные статьи; разметка статьи проходит валидатор; при публикации уходит уведомление Яндексу'
    acceptance_scenarios:
      - id: AS-1
        given: 'Статья опубликована'
        when: 'Открывают sitemap и RSS'
        then: 'Статья есть с датой изменения; черновиков нет'
      - id: AS-2
        given: 'Уведомление Яндексу не прошло'
        when: 'Публикация'
        then: 'Статья опубликована, ошибка в логе'
    acceptance_criteria:
      - id: AC-1
        description: 'У статьи один H1, канонический адрес без UTM, разметка статьи и хлебных крошек, превью для соцсетей с обложкой'
        done: false
      - id: AC-2
        description: 'Автор в разметке статьи ссылается на художницу из разметки сайта'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Опубликованная и черновая статьи']
        when: 'Генерация sitemap и RSS'
        then: ['Есть только опубликованная']
        verification: [automated]
        level: unit

edge_cases:
  - id: EC-1
    description: 'Два заголовка дают одинаковый адрес'
    expected_behavior: 'К адресу добавляется суффикс -2, -3'
  - id: EC-2
    description: 'Работу из «Работ по теме» скрыли или удалили'
    expected_behavior: 'Она пропадает из блока, статья не ломается'
  - id: EC-3
    description: 'Вставлен текст из Word с лишними стилями'
    expected_behavior: 'Стили отбрасываются, структура (абзацы, списки, жирный) остаётся'
  - id: EC-4
    description: 'Картинка больше лимита или не изображение'
    expected_behavior: 'Понятная ошибка, текст не теряется'
  - id: EC-5
    description: 'Удаление рубрики со статьями'
    expected_behavior: 'Запрещено с сообщением, сколько статей в ней'
  - id: EC-6
    description: 'Отложенная статья, дата наступила'
    expected_behavior: 'Появляется на сайте без ручных действий в пределах времени обновления кэша'

functional_requirements:
  - id: FR-001
    text: 'Система MUST хранить статьи с адресом, заголовком, анонсом, телом, обложкой с подписью, рубрикой, полями для поисковиков и датой публикации; пустая дата = черновик, будущая = запланировано'
    story_refs: [US1, US3]
  - id: FR-002
    text: 'Публичная часть MUST показывать только статьи с датой публикации не позже текущего момента; остальные — не найдено'
    story_refs: [US1, US2]
  - id: FR-003
    text: 'Система MUST очищать тело статьи от опасной разметки по белому списку при каждом сохранении'
    story_refs: [US3]
  - id: FR-004
    text: 'Система MUST связывать статью с произвольным числом работ в заданном порядке и показывать только видимые работы'
    story_refs: [US1, US3]
  - id: FR-005
    text: 'Список статей MUST разбиваться по 12 на страницу, фильтроваться по рубрике; пустая рубрика — не найдено'
    story_refs: [US2]
  - id: FR-006
    text: 'Админка MUST позволять создавать, править, предпросматривать, публиковать, планировать, снимать с публикации и удалять статьи и рубрики; только для вошедшего админа'
    story_refs: [US3]
  - id: FR-007
    text: 'Загрузка картинок для статей MUST идти в существующее хранилище изображений с проверкой типа и размера'
    story_refs: [US3]
  - id: FR-008
    text: 'Адрес MUST формироваться транслитерацией заголовка, быть уникальным и не меняться после первой публикации'
    story_refs: [US3]
  - id: FR-009
    text: 'Страница статьи MUST иметь заголовок и описание для поисковиков, канонический адрес, разметку статьи и хлебных крошек, превью для соцсетей'
    story_refs: [US4]
  - id: FR-010
    text: 'Опубликованные статьи и непустые рубрики MUST быть в sitemap с реальной датой изменения и в RSS-ленте'
    story_refs: [US4]
  - id: FR-011
    text: 'WHEN статья публикуется или меняется THEN система SHOULD уведомить Яндекс (IndexNow); сбой не блокирует публикацию'
    story_refs: [US4]
  - id: FR-012
    text: 'Клик по кнопке связи в статье MUST отправлять цель в существующую аналитику'
    story_refs: [US1]

key_entities:
  - id: E-1
    name: Статья
    description: 'Текст с обложкой, рубрикой, датой публикации, полями для поисковиков'
  - id: E-2
    name: Рубрика блога
    description: 'Название, адрес, описание, порядок; отдельна от разделов галереи'
  - id: E-3
    name: Связь статья — работа
    description: 'Работы по теме с порядком показа'

success_criteria:
  - id: SC-001
    description: 'Мама публикует статью с картинкой и работами без помощи разработчика за ≤ 30 минут после подготовки текста'
    measurable_via: 'Пробная публикация с наблюдением'
  - id: SC-002
    description: 'Через 3 месяца опубликовано ≥ 8 статей'
    measurable_via: 'Счётчик опубликованных в админке'
  - id: SC-003
    description: 'Через 6 месяцев блог даёт ≥ 15% поисковых визитов сайта'
    measurable_via: 'Отчёт аналитики по страницам входа'
  - id: SC-004
    description: 'Страница статьи на телефоне загружается и становится читаемой за ≤ 2,5 с'
    measurable_via: 'Lighthouse mobile'

assumptions:
  - id: A-1
    description: 'Раздел называется «Блог»; переименование — текстом в админке'
  - id: A-2
    description: 'Стартовые рубрики: Крым и Севастополь, Как выбрать картину, Истории картин, Театр и цирк, Мастерская; правятся в админке'
  - id: A-3
    description: 'CTA ведёт в существующую форму контактов (продажа через контакт); после 007 — дополнительно кнопка Telegram-бота'
  - id: A-4
    description: 'Про проданные работы писать можно — показываются как портфолио без призыва к покупке'
  - id: A-5
    description: 'Только русский язык; комментарии, теги, Турбо-страницы, MDX и внешняя CMS не делаются'
  - id: A-6
    description: 'Лендинги мастер-классов и «дизайнерам» — отдельная спека; автопост в Telegram/VK и Дзен через RSS — вне MVP кода'
  - id: A-7
    description: 'Подтверждение сайта в Вебмастере, Wordstat делает владелец; ключ IndexNow задаётся через env (он публичен по протоколу, но не хардкодится)'

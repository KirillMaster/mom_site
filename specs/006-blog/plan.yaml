feature: 006-blog
branch: feature/005-growth-foundation
summary: >-
  Новые сущности BlogPost, BlogCategory, BlogPostArtwork (M:N к Artwork) в PostgreSQL одной
  миграцией. Публичный API /api/public/blog (список с пагинацией и рубрикой, статья по
  адресу, рубрики) и админ CRUD /api/admin/blog + загрузка картинок через существующий
  IImageService (папка blog). Тело — HTML, очищаемый на backend HtmlSanitizer по белому
  списку. Фронт: SSR /blog, /blog/[slug], /blog/category/[slug] с generateMetadata,
  BlogPosting/BreadcrumbList JSON-LD (отдельный компонент), sitemap, RSS route handler;
  админка /admin/blog с редактором TipTap, подгружаемым динамически. IndexNow-пинг при
  публикации — fire-and-forget. Видимость работ по теме — общий фильтр Visible() из 005.
technical_context:
  language_version: C# 12 / .NET 8 (backend); TypeScript 5 strict / Next.js 14.0 App Router, React 18 (frontend)
  primary_dependencies:
    - EF Core 8 + Npgsql (новые таблицы)
    - HtmlSanitizer (Ganss.Xss, MIT) — очистка BodyHtml (новая зависимость Infrastructure)
    - IImageService / S3Service (существуют) — картинки статей
    - '@tiptap/react + starter-kit + extension-link + extension-image (MIT) — только админка, next/dynamic'
    - react-query (useApi) в админке; next/image в публичной части
  storage: PostgreSQL — BlogPosts, BlogCategories, BlogPostArtworks; картинки в S3 (Timeweb) папка blog
  testing: xUnit (unit — sanitizer, slug uniquify, видимость по PublishedAt; integration — public/admin эндпоинты); Jest (компоненты статьи, редактора, sitemap/RSS); Playwright (создал → опубликовал → увидел, черновик → 404)
  target_platform: Linux Docker (mom_site_api_prod, mom_site_frontend_prod), браузеры mobile-first
  project_type: web_application
  performance_goals: LCP статьи на мобильном ≤ 2,5 с (SSR + ISR revalidate 300 с, priority только у обложки); публичный бандл без TipTap
  constraints: Только [Authorize] для admin; санитизация при каждом сохранении; картинки ≤ 15 МБ jpeg/png/webp с авто-уменьшением; редактор в простом режиме без HTML (A-8); slug ^[a-z0-9-]{1,120}$ неизменен после публикации; ключ IndexNow через env; файлы ≤ 200 строк (P3)
  scale_scope: Десятки статей в год, 1 автор, 5–6 рубрик

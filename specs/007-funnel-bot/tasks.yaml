- id: T006
  title: Расширить уведомления Telegram и Email под заявки без email
  description: TelegramNotifier.BuildText добавляет Телефон и Telegram; EmailNotifier не падает при пустом Email
  context: Мама должна сразу написать клиенту, у которого может не быть email

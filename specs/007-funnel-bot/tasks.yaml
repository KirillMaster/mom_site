  parallelizable: true
  entity_refs:
  - contact-message
  contract_refs:
  - telegram-notifier
  - feedback-notifier
  steps:
  - order: 1
    action: Заголовок
    detail: 'В TelegramNotifier.BuildText: при UtmSource == "telegram_bot" первая строка «Новая заявка из Telegram-бота», иначе прежняя «Новое сообщение с сайта»'
  - order: 2
    action: Опциональные строки
    detail: 'Email только если не пуст; `Телефон: …` если Phone; `Telegram: @username`, иначе `Telegram: tg://user?id=<id>` если есть TelegramUserId'
  - order: 3
    action: Email-канал
    detail: 'EmailNotifier: Email через `?? "-"`; ReplyTo только при непустом Email; Phone и Telegram добавить в text и html (через кодирование)'
  - order: 4
    action: Тесты
    detail: 'TelegramNotifierTests.cs и EmailNotifierTests.cs: заявка бота без email, с username, без username, без телефона; заявка формы не меняется'
  technical_notes:
  - path: backend/MomSite.Infrastructure/Notifications/TelegramNotifier.cs
    note: BuildText - public static, тесты вызывают напрямую
  - path: backend/MomSite.Infrastructure/Notifications/EmailNotifier.cs
    note: message.Email используется ~строки 46-62 и 86
  - path: backend/MomSite.Infrastructure/Notifications/LeadSource.cs
    note: Describe не меняется
  acceptance_criteria:
  - id: AC-1
    description: В уведомлении есть телефон и/или ссылка на Telegram клиента
    done: false
  - id: AC-2
    description: Заявка формы выглядит как раньше
    done: false
  - id: AC-3
    description: Email-канал не падает при Email = null
    done: false

  - T002
  parallelizable: false
  entity_refs:
  - contact-message
  contract_refs:
  - lead-service
  - lead-service-impl
  - feedback-notifier
  steps:
  - order: 1
    action: Объявить интерфейс
    detail: 'backend/MomSite.Core/Interfaces/ILeadService.cs: `Task<LeadSubmitResult> SubmitAsync(ContactMessage message, CancellationToken ct = default)`; record LeadSubmitResult(Id, NotifiedChannels) в том же файле'
  - order: 2
    action: Реализовать
    detail: 'backend/MomSite.Infrastructure/Services/LeadService.cs: Add + SaveChangesAsync (ошибка БД пробрасывается); затем foreach IFeedbackNotifier где IsEnabled: try NotifyAsync, catch логируется и не пробрасывается; считать успешные каналы'
  - order: 3
    action: Зарегистрировать
    detail: 'В Program.cs рядом с AddScoped<IFeedbackNotifier,...>: `AddScoped<ILeadService, LeadService>()`'
  - order: 4
    action: Логи
    detail: Только Id и тип notifier'а; без имени, телефона, текста
  technical_notes:
  - path: backend/MomSite.API/Controllers/PublicController.cs
    note: Исходная логика в приватных TryPersistContactMessageAsync и NotifyContactMessageAsync (~строки 472-505) переносится
  - path: backend/MomSite.API/Program.cs
    note: DI notifier'ов ~строки 158-165
  - path: backend/MomSite.Core/Interfaces/IFeedbackNotifier.cs
    note: IsEnabled, NotifyAsync(ContactMessage)
  acceptance_criteria:
  - id: AC-1
    description: Сохранение и уведомление выполняются в одном сервисе
    done: false
  - id: AC-2
    description: Сбой notifier'а не пробрасывается, лид сохранён
    done: false
  - id: AC-3
    description: Сбой БД пробрасывается
    done: false

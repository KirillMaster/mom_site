- id: T013
  title: 'FunnelPollingService: приём апдейтов и исполнение ответов'
  description: 'BackgroundService с long polling: апдейт в BotInput, вызов FunnelDialog, исполнение Replies и Lead'
  context: Связывает Telegram, автомат и общий сервис лидов
  story_ref: US1
  requirement_refs:
  - FR-001
  - FR-006
  - FR-008
  - FR-011
  depends_on:
  - T004
  - T007
  - T009
  - T010
  - T012
  parallelizable: false
  entity_refs:
  - funnel-state
  - lead-quota
  - contact-message
  contract_refs:
  - bot-api-client
  - funnel-dialog
  - lead-service
  steps:
  - order: 1
    action: Отключение
    detail: 'backend/MomSite.Infrastructure/TelegramBot/FunnelPollingService.cs: при пустом FUNNEL_BOT_TOKEN ExecuteAsync пишет одно предупреждение и завершается'
  - order: 2
    action: Цикл
    detail: getUpdates(offset=last+1, timeout=50); сетевая ошибка - пауза 5 с; 429 - ждать retry_after; исключения не роняют сервис
  - order: 3
    action: Фильтр
    detail: Игнорировать апдейты, где chat.type != "private"
  - order: 4
    action: Перевод в BotInput
    detail: 'backend/MomSite.Infrastructure/TelegramBot/BotInputMapper.cs: /start [payload] -> Start; /cancel -> Cancel; callback_query -> Callback (+ answerCallbackQuery); contact -> Contact; text -> Text; прочее -> Unsupported'
  - order: 5
    action: Исполнение
    detail: Состояние в IMemoryCache `funnel:{chatId}` (TTL 24 ч); Handle -> сохранить State -> отправить Replies через ChatSendGate -> при Lead проверить LeadQuota, создать scope (IServiceScopeFactory) и вызвать ILeadService.SubmitAsync; при ошибке БД
      ответить «Не удалось отправить, попробуйте позже», диалог не завершать
  - order: 6
    action: Логи
    detail: chatId и этап; без текста, телефона, имени, токена
  technical_notes:
  - path: backend/MomSite.API/Program.cs
    note: ILeadService и DbContext scoped, сервис singleton - только через IServiceScopeFactory
  - path: backend/MomSite.Infrastructure/TelegramBot/
    note: Файл <= 200 строк; при росте вынести обработку апдейта в FunnelUpdateHandler.cs
  acceptance_criteria:
  - id: AC-1
    description: Без токена сервис не стартует, сайт работает
    done: false
  - id: AC-2
    description: Апдейты из групп игнорируются
    done: false
  - id: AC-3
    description: Сбой Telegram не роняет api
    done: false
  - id: AC-4
    description: Лид уходит только через ILeadService
    done: false
  test_scenarios:
  - id: TS-1
    given:
    - токен пуст
    when: запуск сервиса
    then:
    - завершается без ошибки, одно предупреждение
    verification:
    - automated
    level: unit
  - id: TS-2
    given:
    - апдейт из группы
    when: обработка
    then:
    - ответа и лида нет
    verification:
    - automated
    level: unit
  - id: TS-3

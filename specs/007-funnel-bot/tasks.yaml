feature: 007-funnel-bot
tasks:
- id: T001
  title: Передать FUNNEL_BOT_TOKEN в api-контейнер
  description: Добавить переменную окружения FUNNEL_BOT_TOKEN в docker-compose.prod.yml без значения
  context: Публичный бот включается только по токену; токен живёт в серверном .env, не в репозитории
  story_ref: US1
  requirement_refs:
  - FR-011
  depends_on: []
  parallelizable: true
  entity_refs: []
  contract_refs: []
  steps:
  - order: 1
    action: Добавить переменную
    detail: 'В docker-compose.prod.yml, сервис api, блок environment, после TELEGRAM_CHAT_IDS: `- FUNNEL_BOT_TOKEN=${FUNNEL_BOT_TOKEN:-}`; пустое значение = бот выключен'
  - order: 2
    action: Проверить отсутствие секретов
    detail: '`git grep -nE "bot[0-9]{6,}:"` ничего не находит; в dev docker-compose.yml переменную не добавлять'
  - order: 3
    action: Зафиксировать ручной шаг
    detail: Токен кладёт владелец в серверный .env; deploy.yml и scripts/deploy_remote.sh TELEGRAM_* не передают, менять их не нужно
  technical_notes:
  - path: docker-compose.prod.yml
    note: Telegram-переменные уже в environment сервиса api (~строки 23-24); extra_hosts api.telegram.org уже закреплён
  - path: scripts/deploy_remote.sh
    note: 'Не передаёт TELEGRAM_*; .env живёт на сервере. Расхождение: quickstart говорит про GitHub secret, фактически используется серверный .env'
  acceptance_criteria:
  - id: AC-1
    description: Переменная FUNNEL_BOT_TOKEN объявлена в api prod-compose, дефолт пустой
    done: false
  - id: AC-2
    description: В репозитории нет значений токенов
    done: false
  test_scenarios:
  - id: TS-1
    given:
    - docker-compose.prod.yml изменён
    when: выполнено `docker compose -f docker-compose.prod.yml config` при пустом FUNNEL_BOT_TOKEN
    then:
    - команда проходит, переменная пустая
    verification:
    - automated
    level: integration
- id: T002
  title: Расширить модель ContactMessage полями бота
  description: Email сделать nullable, добавить Phone, TelegramUsername, TelegramUserId в модель, конфигурацию EF и admin-DTO
  context: Заявка из бота хранится в существующей таблице; email у неё нет, зато есть телефон и Telegram
  story_ref: US2
  requirement_refs:
  - FR-004
  depends_on: []
  parallelizable: false
  entity_refs:
  - contact-message
  contract_refs:
  - lead-service
  steps:
  - order: 1
    action: Изменить модель
    detail: 'В backend/MomSite.Core/Models/ContactMessage.cs: `string? Email` без [Required]; добавить `[MaxLength(100)] string? Phone`, `[MaxLength(64)] string? TelegramUsername`, `long? TelegramUserId`'
  - order: 2
    action: Обновить конфигурацию EF
    detail: 'В ApplicationDbContext.OnModelCreating, блок ContactMessage: убрать IsRequired у Email (HasMaxLength(200) оставить), Phone HasMaxLength(100), TelegramUsername HasMaxLength(64)'
  - order: 3
    action: Обновить admin-DTO
    detail: 'В ContactMessageAdminDto: `string? Email`, добавить Phone, TelegramUsername, TelegramUserId; дополнить ToAdminDto в MappingExtensions.cs'
  - order: 4
    action: Не трогать DTO формы
    detail: 'ContactMessageDto.Email остаётся [Required]: форма сайта по-прежнему требует email'
  - order: 5
    action: Собрать
    detail: '`cd backend && dotnet build`; поправить места, где Email считался non-null (см. T006)'
  technical_notes:
  - path: backend/MomSite.Core/Models/ContactMessage.cs
    note: Email сейчас [Required] string
  - path: backend/MomSite.Infrastructure/Data/ApplicationDbContext.cs
    note: Блок конфигурации ContactMessage ~строки 104-120
  - path: backend/MomSite.API/DTOs/ContactMessageAdminDto.cs
    note: Email сейчас non-null string
  - path: backend/MomSite.API/DTOs/MappingExtensions.cs
    note: ToAdminDto ~строки 121-135
  - path: specs/008-conversion-quick-wins
    note: 'ПЕРЕСЕЧЕНИЕ: 008 тоже делает Email nullable и добавляет Phone (<=100, миграция AddContactPhone, ContactMessageDto : IValidatableObject). Phone здесь тоже <=100 (в data-model 007 указано 32 - выровнять). Кто сливается вторым, не дублирует поле,
      а ребейзит модель, DTO и миграцию'
  acceptance_criteria:
  - id: AC-1
    description: ContactMessage содержит Phone, TelegramUsername, TelegramUserId; Email nullable
    done: false
  - id: AC-2
    description: Сборка зелёная, ContactMessageDto не изменён
    done: false
  test_scenarios:
  - id: TS-1
    given:
    - модель обновлена
    when: dotnet build
    then:
    - 0 ошибок
    verification:
    - automated
    level: unit
- id: T003
  title: Миграция БД для полей заявки из бота
  description: Сгенерировать EF-миграцию AddContactBotFields
  context: Новые колонки и nullable Email должны попасть в Postgres при деплое
  story_ref: US2
  requirement_refs:
  - FR-004
  depends_on:
  - T002
  parallelizable: false
  entity_refs:
  - contact-message
  contract_refs: []
  steps:
  - order: 1
    action: Проверить миграции 008
    detail: Если AddContactPhone из 008 уже в ветке - в этой миграции только TelegramUsername и TelegramUserId; иначе также Email nullable и Phone
  - order: 2
    action: Сгенерировать
    detail: '`cd backend && dotnet ef migrations add AddContactBotFields --project MomSite.Infrastructure --startup-project MomSite.API`'
  - order: 3
    action: Проверить Up/Down
    detail: 'Up: Email nullable, Phone varchar(100), TelegramUsername varchar(64), TelegramUserId bigint, все NULL; Down обратим'
  - order: 4
    action: Применить локально
    detail: '`dotnet ef database update` на dev-Postgres'
  technical_notes:
  - path: backend/MomSite.Infrastructure/Data/Migrations
    note: Последняя миграция 20261002174348_AddBlog; меняется ApplicationDbContextModelSnapshot.cs - конфликт при мердже с 008 разрешать вручную
  - path: docker-compose.prod.yml
    note: Миграции применяются при деплое сервисом api
  acceptance_criteria:
  - id: AC-1
    description: Миграция создана и применяется к чистой и существующей БД
    done: false
  - id: AC-2
    description: Существующие заявки сохраняют Email
    done: false
  test_scenarios:
  - id: TS-1
    given:
    - БД с заявками формы
    when: применена миграция
    then:
    - старые строки не изменились, новые колонки NULL
    verification:
    - manual
    level: integration

    verification:
    - automated
    level: unit
- id: T007
  title: Клиент Bot API и DTO апдейтов
  description: Реализовать тонкий TelegramBotClient (getUpdates, sendMessage, sendPhoto, answerCallbackQuery) и DTO апдейтов
  context: Бот принимает и отправляет сообщения без внешнего пакета
  story_ref: US1
  requirement_refs:
  - FR-001
  - FR-011
  depends_on:
  - T001
  parallelizable: true
  entity_refs: []
  contract_refs:
  - bot-api-client
  - telegram-bot-client
  steps:
  - order: 1
    action: DTO
    detail: 'backend/MomSite.Infrastructure/TelegramBot/BotUpdateDtos.cs: Update, Message, Chat(id,type), User(id,username,first_name), Contact(phone_number), CallbackQuery, разметки клавиатур; System.Text.Json с JsonPropertyName'
  - order: 2
    action: Интерфейс
    detail: 'backend/MomSite.Infrastructure/TelegramBot/IBotApiClient.cs: GetUpdatesAsync(offset, ct), SendMessageAsync, SendPhotoAsync, AnswerCallbackQueryAsync'
  - order: 3
    action: Реализация
    detail: backend/MomSite.Infrastructure/TelegramBot/TelegramBotClient.cs на именованном HttpClient "FunnelBot" (Timeout 60 с); getUpdates timeout=50, allowed_updates=[message, callback_query]; ошибки API (в т.ч. 429 с retry_after) и сетевые возвращать
      результатом, не бросать
  - order: 4
    action: Токен не в логах
    detail: Логировать только имя метода и error_code; не логировать URL, exception.ToString(), текст и телефон
  - order: 5
    action: Тесты
    detail: 'backend/MomSite.Tests/TelegramBot/TelegramBotClientTests.cs с фейковым HttpMessageHandler: разбор getUpdates, request_contact, 429, сетевая ошибка'
  technical_notes:
  - path: backend/MomSite.Infrastructure/Notifications/TelegramNotifier.cs
    note: Образец похода в Bot API
  - path: backend/MomSite.API/Program.cs
    note: 'Serilog Override System.Net.Http.HttpClient -> Warning уже стоит: URL с токеном в лог не попадает'
  - path: backend/MomSite.Infrastructure/TelegramBot/
    note: Новая папка; каждый файл <= 200 строк (P3)
  acceptance_criteria:
  - id: AC-1
    description: Все 4 метода работают против фейкового Bot API
    done: false
  - id: AC-2
    description: Ошибки Telegram не бросают исключений наружу
    done: false
  - id: AC-3
    description: Токен не появляется в логах
    done: false
  test_scenarios:
  - id: TS-1
    given:
    - фейковый ответ getUpdates с message и callback_query
    when: GetUpdatesAsync
    then:
    - Update десериализован с from.username и contact.phone_number
    verification:
    - automated
    level: unit
  - id: TS-2
    given:
    - ответ 429 retry_after=3
    when: SendMessageAsync
    then:
    - результат с retry_after, исключения нет
    verification:
    - automated
    level: unit

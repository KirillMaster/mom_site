feature: Минимальная воронка в публичном Telegram-боте и страница политики конфиденциальности
branch: feature/005-growth-foundation
created: '2026-10-02'
status: Draft
status_note: 'Технические решения D1–D7 и таблица переиспользования — design-notes.md (вход для /yamlkit-plan)'
input: Минимальная воронка в публичном Telegram-боте @angela_moiseenko_bot + страница
  /privacy. Черновик со всеми решениями — specs/007-funnel-bot/design-notes.md. Не
  дублировать существующий функционал (ContactMessage, IFeedbackNotifier/TelegramNotifier,
  LeadSource, PageContent). Лиды — в те же чаты, что и заявки с сайта.

user_stories:
  - id: US1
    title: Посетитель оставляет заявку через публичный бот за несколько нажатий
    priority: P1
    description: Посетитель открывает @angela_moiseenko_bot (по ссылке с сайта, из рекламы
      или поиска), отвечает на 3–5 вопросов кнопками (цель, уточнение, бюджет, контакт,
      имя) и получает подтверждение, что художница ответит лично.
    motivation:
      problem: Сейчас заявку можно оставить только через форму на сайте с обязательным
        email; маркетинговая стратегия строится на Telegram, а бот пустой.
      value: Низкий порог обращения из мессенджера, квалифицированный лид (цель, размер,
        бюджет) вместо «сколько стоит?».
      consequence_if_skipped: Рекламный трафик в Telegram некуда вести; CTA-кнопки и
        реклама маркетолога не дают измеримых лидов.
    why_priority: Ядро фичи — без сценария диалога нет лидов.
    independent_test: Пройти сценарий в боте с телефона по каждой цели и убедиться,
      что получено подтверждение и лид сохранён.
    acceptance_scenarios:
      - id: AS-1
        given: посетитель впервые открыл бот без параметров
        when: он выбирает «Картина для интерьера», размер, тему, бюджет, делится номером
          и подтверждает имя
        then: бот благодарит и сообщает, что Анжела ответит в течение дня; заявка сохранена
          со всеми ответами
      - id: AS-2
        given: посетитель выбрал «Мастер-класс»
        when: он выбирает формат и оставляет контакт
        then: шаг «Бюджет» пропускается, заявка сохранена с форматом мастер-класса
      - id: AS-3
        given: посетитель на любом шаге
        when: он нажимает «Назад» или отправляет /cancel
        then: бот возвращает на предыдущий шаг или сбрасывает сценарий к началу
      - id: AS-4
        given: посетитель без публичного имени пользователя в Telegram
        when: он выбирает «Пишите мне в Telegram»
        then: бот просит поделиться номером телефона
    acceptance_criteria:
      - id: AC-1
        description: Все 5 целей проходят сценарий до подтверждения
        done: false
      - id: AC-2
        description: «Назад» и /cancel работают на каждом шаге
        done: false
      - id: AC-3
        description: Текст, присланный вне сценария, сохраняется как заявка «Другой вопрос»
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - новый диалог
        when: последовательно выбраны ответы ветки «интерьер»
        then:
          - сформирована заявка с целью, размером, темой, бюджетом, контактом, именем
        verification:
          - automated
        level: unit
      - id: TS-2
        given:
          - диалог на шаге «Бюджет»
        when: нажато «Назад»
        then:
          - диалог на шаге «Уточнение», ранее введённые ответы сохранены
        verification:
          - automated
        level: unit
      - id: TS-3
        given:
          - реальный бот на проде
        when: сценарий пройден с телефона
        then:
          - подтверждение получено
        verification:
          - manual
        level: e2e

  - id: US2
    title: Художница получает заявку из бота туда же, куда приходят заявки с сайта
    priority: P1
    description: Заявка из публичного бота приходит в приватный админский бот в те же
      чаты, что и заявки с сайта, и появляется в разделе «Заявки» админки; в сообщении
      есть способ сразу написать клиенту.
    motivation:
      problem: Публичный бот не связан с админкой и уведомлениями.
      value: Один канал обработки лидов, ничего не теряется, клиенту можно ответить
        в один клик.
      consequence_if_skipped: Лиды из бота никто не увидит.
    why_priority: Без доставки лида воронка бесполезна.
    independent_test: Пройти сценарий и проверить сообщение в mom_site_bot и запись
      в /admin/messages.
    acceptance_scenarios:
      - id: AS-1
        given: посетитель завершил сценарий
        when: заявка сохранена
        then: в чаты получателей заявок приходит сообщение с целью, ответами, контактом,
          источником «Telegram-бот» и ссылкой для связи с клиентом
      - id: AS-2
        given: заявка из бота сохранена
        when: администратор открывает «Заявки» в админке
        then: заявка видна в списке и учитывается в счётчике непрочитанных
      - id: AS-3
        given: сервис уведомлений временно недоступен
        when: посетитель завершает сценарий
        then: заявка всё равно сохраняется, посетитель получает подтверждение
    acceptance_criteria:
      - id: AC-1
        description: Заявка из бота доставляется тем же механизмом уведомлений, что и
          заявка с сайта (без второй реализации)
        done: false
      - id: AC-2
        description: В уведомлении есть телефон и/или ссылка на Telegram клиента
        done: false
      - id: AC-3
        description: Форма заявки на сайте работает как прежде (регрессия)
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - имитация Telegram API
        when: пройден полный сценарий
        then:
          - заявка в БД
          - механизм уведомлений вызван один раз
        verification:
          - automated
        level: integration
      - id: TS-2
        given:
          - механизм уведомлений бросает ошибку
        when: сценарий завершён
        then:
          - заявка в БД, посетитель получил подтверждение
        verification:
          - automated
        level: integration

  - id: US3
    title: Ссылка с карточки работы открывает бот с контекстом этой работы
    priority: P2
    description: Посетитель переходит из карточки работы, мастер-класса или страницы
      для дизайнеров; бот уже знает контекст (работу или цель) и пропускает лишние
      вопросы; источник сохраняется в заявке.
    motivation:
      problem: Без контекста художнице приходится выяснять, о какой картине речь.
      value: Короче сценарий, выше конверсия, видно, какие работы и кампании приводят
        лиды.
      consequence_if_skipped: Контекст теряется, атрибуция рекламы невозможна.
    why_priority: Повышает конверсию, но базовая воронка работает и без него.
    independent_test: Открыть ссылку с параметром работы и проверить приветствие с фото
      и укороченный сценарий.
    acceptance_scenarios:
      - id: AS-1
        given: ссылка на бот с параметром существующей работы
        when: посетитель нажимает «Старт»
        then: бот показывает фото и название работы, цель «Купить эту работу», сразу
          переходит к контакту
      - id: AS-2
        given: ссылка с параметром несуществующей или скрытой работы
        when: посетитель нажимает «Старт»
        then: бот запускает обычный сценарий без ошибки
      - id: AS-3
        given: ссылка с произвольным параметром кампании
        when: заявка завершена
        then: параметр сохранён как кампания источника
    acceptance_criteria:
      - id: AC-1
        description: Параметры работы, мастер-класса и интерьера распознаются; прочие
          сохраняются как кампания
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - параметры art_12, art_999999, mk, interior, abc-promo, пустой
        when: разбирается параметр старта
        then:
          - корректный контекст для каждого, без исключений
        verification:
          - automated
        level: unit

  - id: US4
    title: Посетитель видит политику обработки персональных данных
    priority: P1
    description: На сайте есть страница /privacy с политикой обработки персональных
      данных; на неё ссылаются бот (перед запросом контакта), форма заявки и футер;
      текст редактируется в админке.
    motivation:
      problem: Сайт и бот собирают имя, телефон, email и Telegram, а политики нет —
        требование 152-ФЗ.
      value: Юридическая чистота сбора лидов, доверие посетителей.
      consequence_if_skipped: Риск претензий Роскомнадзора; рекламные площадки могут
        отклонять объявления.
    why_priority: Обязательное условие запуска сбора контактов через бот.
    independent_test: Открыть /privacy, проверить текст, реквизиты, ссылки из футера,
      формы и бота; отредактировать текст в админке.
    acceptance_scenarios:
      - id: AS-1
        given: посетитель на любой странице
        when: он нажимает «Политика конфиденциальности» в футере
        then: открывается /privacy с оператором, составом данных, целями, сроком хранения
          и способом отзыва согласия
      - id: AS-2
        given: администратор в разделе страниц админки
        when: он меняет текст политики и сохраняет
        then: изменённый текст отображается на /privacy
      - id: AS-3
        given: посетитель в боте перед шагом контакта
        when: бот запрашивает контакт
        then: в сообщении есть строка о согласии со ссылкой на /privacy
    acceptance_criteria:
      - id: AC-1
        description: /privacy отдаётся сервером, есть в sitemap и мета-тегах
        done: false
      - id: AC-2
        description: Текст по умолчанию содержит реквизиты оператора и контакт для отзыва
          согласия
        done: false
      - id: AC-3
        description: Под формой заявки на сайте есть строка согласия со ссылкой
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - текст политики не задан в админке
        when: открыта /privacy
        then:
          - показан текст по умолчанию с реквизитами
        verification:
          - automated
        level: unit
      - id: TS-2
        given:
          - сайт запущен
        when: переход из футера на /privacy
        then:
          - страница открыта, заголовок «Политика конфиденциальности»
        verification:
          - automated
        level: e2e

edge_cases:
  - id: EC-1
    description: Сообщение боту из группового чата или канала
    expected_behavior: Игнорируется, бот работает только в личных чатах
  - id: EC-2
    description: Один пользователь отправляет много заявок подряд
    expected_behavior: Не больше 3 заявок в сутки от пользователя; дальше бот вежливо
      сообщает, что заявка уже принята
  - id: EC-3
    description: Перезапуск сервиса посреди диалога
    expected_behavior: Незавершённый диалог начинается заново при следующем сообщении;
      завершённые заявки не теряются
  - id: EC-4
    description: Посетитель отправляет фото, стикер или голосовое
    expected_behavior: Бот отвечает подсказкой текущего шага, сценарий не ломается
  - id: EC-5
    description: Токен публичного бота не задан в окружении
    expected_behavior: Бот не запускается, остальной сайт работает, в лог одно предупреждение
  - id: EC-6
    description: Повторный /start во время диалога
    expected_behavior: Сценарий начинается заново с учётом нового параметра

functional_requirements:
  - id: FR-001
    text: Бот MUST вести посетителя по шагам цель → уточнение → бюджет → контакт → имя
      → подтверждение, с кнопками на каждом шаге и ветвлением по цели
    story_refs: [US1]
  - id: FR-002
    text: Бот MUST поддерживать «Назад» на шагах 2–5 и команду /cancel
    story_refs: [US1]
  - id: FR-003
    text: WHEN у посетителя нет публичного имени пользователя THEN бот MUST запросить
      номер телефона
    story_refs: [US1]
  - id: FR-004
    text: Завершённая заявка MUST сохраняться в существующем хранилище заявок и отображаться
      в разделе «Заявки» админки
    story_refs: [US2]
  - id: FR-005
    text: Уведомление о заявке из бота MUST доставляться существующим механизмом уведомлений
      о заявках (те же получатели), с контактом клиента и ссылкой для связи
    story_refs: [US2]
  - id: FR-006
    text: Сбой уведомления MUST NOT приводить к потере заявки или ошибке для посетителя
    story_refs: [US2]
  - id: FR-007
    text: Бот MUST распознавать параметр старта (работа, мастер-класс, интерьер, кампания)
      и сохранять источник «Telegram-бот» и кампанию в заявке
    story_refs: [US3]
  - id: FR-008
    text: Бот MUST обрабатывать только личные чаты и ограничивать 3 заявки в сутки на
      пользователя
    story_refs: [US1]
  - id: FR-009
    text: Сайт MUST иметь серверно отрисованную страницу /privacy с редактируемым в
      админке текстом и текстом по умолчанию с реквизитами оператора
    story_refs: [US4]
  - id: FR-010
    text: Ссылка на /privacy MUST присутствовать в футере, под формой заявки, в сообщении
      бота перед запросом контакта и в sitemap
    story_refs: [US4]
  - id: FR-011
    text: Токены ботов MUST NOT попадать в логи и исходный код
    story_refs: [US2]

key_entities:
  - id: E-1
    name: Заявка (существующая)
    description: Обращение посетителя; дополняется телефоном, Telegram-именем и
      идентификатором пользователя Telegram; email становится необязательным для заявок
      из бота
  - id: E-2
    name: Диалог воронки
    description: Временное состояние сценария по чату — текущий шаг, ответы, контекст
      старта; живёт до суток
  - id: E-3
    name: Политика конфиденциальности
    description: Редактируемый текстовый блок страницы /privacy (существующий механизм
      контента страниц)

success_criteria:
  - id: SC-001
    description: Посетитель проходит сценарий от старта до подтверждения не более чем
      за 1 минуту и 7 нажатий
    measurable_via: Ручной прогон по каждой цели с секундомером
  - id: SC-002
    description: 100% завершённых сценариев дают заявку в админке и уведомление получателям
    measurable_via: Сравнение числа подтверждений в логах бота и заявок с источником
      «Telegram-бот» за неделю
  - id: SC-003
    description: Не менее 30% начавших сценарий доходят до подтверждения в первый месяц
    measurable_via: Счётчики «старт» и «подтверждение» в логах бота
  - id: SC-004
    description: Политика конфиденциальности доступна со всех страниц сайта и из бота
    measurable_via: E2E-проверка ссылок, ручная проверка бота

assumptions:
  - id: A-1
    description: 'Реквизиты политики — оператор: Моисеенко Анжела Валерьевна; ответственный
      за обработку и контакт для отзыва согласия: Сухоруких Кирилл Всеволодович, suhorukih@mail.ru'
  - id: A-2
    description: Получатели уведомлений — те же, что для заявок с сайта (решено владельцем
      2026-10-02)
  - id: A-3
    description: Художница отвечает клиенту напрямую в Telegram или по телефону; ответ
      через бота не нужен в MVP
  - id: A-4
    description: Тексты бота и вилки бюджета (до 30 тыс., 30–70, 70–150, больше 150,
      не знаю) — черновые, согласуются с владельцем до запуска
  - id: A-5
    description: Подбор работ под размер и бюджет, рассылки, оплата, напоминания и MAX-бот
      — вне скоупа MVP
  - id: A-6
    description: Сервис работает в одном экземпляре; потеря незавершённого диалога при
      перезапуске допустима

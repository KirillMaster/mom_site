project_structure:
  layout: web_application
  description: >-
    Новый код бота — изолированная папка Infrastructure/TelegramBot (клиент Bot API,
    DTO, polling-сервис, конечный автомат на чистых функциях, тексты). Сохранение лида
    и рассылка уведомлений — ILeadService (Core) + LeadService (Infrastructure),
    PublicController переводится на него без изменения поведения. TelegramNotifier
    дополняет текст телефоном/Telegram-ссылкой. Frontend — новая страница app/privacy
    и ссылки из футера, формы контактов и sitemap.
  directories:
    - backend/MomSite.Core/Interfaces/ILeadService.cs
    - backend/MomSite.Core/Models/ContactMessage.cs
    - backend/MomSite.Infrastructure/Services/LeadService.cs
    - backend/MomSite.Infrastructure/TelegramBot/
    - backend/MomSite.Infrastructure/Notifications/TelegramNotifier.cs
    - backend/MomSite.Infrastructure/Data/Migrations/
    - backend/MomSite.API/Controllers/PublicController.cs
    - backend/MomSite.API/Program.cs
    - backend/MomSite.Tests/TelegramBot/
    - frontend/app/privacy/
    - frontend/app/sitemap.ts
    - frontend/components/
    - frontend/e2e/
    - docker-compose.prod.yml

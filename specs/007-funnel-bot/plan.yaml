feature: 007-funnel-bot
branch: feature/005-growth-foundation
summary: >-
  Публичный бот @angela_moiseenko_bot ведёт посетителя по короткому сценарию
  (цель → уточнение → бюджет → контакт → имя) и сохраняет лид как существующий
  ContactMessage; уведомление уходит существующими IFeedbackNotifier
  (TelegramNotifier через mom_site_bot в те же TELEGRAM_CHAT_IDS, EmailNotifier).
  Бот работает long polling внутри api-контейнера и включается только при заданном
  FUNNEL_BOT_TOKEN. Общий код сохранения+уведомления выносится из PublicController
  в LeadService, которым пользуются и форма сайта, и бот. Плюс SSR-страница /privacy,
  текст которой хранится в существующем PageContent (pageKey=privacy) и правится в
  /admin/pages.
technical_context:
  language_version: C# 12 / .NET 8 (backend); TypeScript 5 strict / Next.js 14 App Router (frontend)
  primary_dependencies:
    - ASP.NET Core 8 (BackgroundService, IHttpClientFactory, IMemoryCache)
    - EF Core 8 + Npgsql (миграция ContactMessage)
    - Telegram Bot API (HTTPS, getUpdates/sendMessage/sendPhoto/answerCallbackQuery) — свой тонкий клиент, без NuGet-пакетов
    - Next.js 14 (SSR /privacy, sitemap.ts)
  storage: PostgreSQL (ContactMessage + 3 новых nullable-поля, Email nullable; PageContent без изменений схемы); состояние диалога — IMemoryCache (TTL 24 ч)
  testing: xUnit (unit — FunnelDialog/payload/лимиты; integration — фейковый HttpMessageHandler Bot API + InMemory/SQLite БД), Jest + Testing Library (/privacy, строка согласия), Playwright (/privacy доступна из футера)
  target_platform: Linux Docker (mom_site_api_prod, extra_hosts api.telegram.org), браузеры mobile-first, Telegram-клиенты
  project_type: web_application
  performance_goals: Ответ бота на нажатие ≤ 2 с (p95) при доступном Telegram; уведомление маме ≤ 10 с после подтверждения
  constraints: Секреты только из env (FUNNEL_BOT_TOKEN, TELEGRAM_BOT_TOKEN); токен не попадает в логи (HttpClient → Warning); один экземпляр api (long polling); только приватные чаты; ≤ 3 лида/пользователь/сутки, ≤ 1 сообщение/с на чат; ошибка Telegram не роняет api
  scale_scope: Десятки диалогов в день, один экземпляр сервиса, 2 получателя уведомлений

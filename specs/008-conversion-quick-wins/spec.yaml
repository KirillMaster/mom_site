feature: "Конверсия в заявку и быстрые P0-правки UI/UX"
branch: "feature/008-conversion-quick-wins"
created: "2026-10-02"
status: "Draft"
input: "007-conversion-quick-wins. Повысить конверсию посетителя в заявку на покупку картины и убрать P0-дефекты UI/UX (по ревизии дизайна 2026-10-02). Скоуп: 1) характеристики работы (размер, техника, основа, год, статус) + админка; 2) быстрые кнопки Telegram/WhatsApp/MAX/Позвонить с предзаполненным текстом и целями Метрики, закреплённая панель на мобильном; 3) форма: email необязателен, поле «Телефон или мессенджер», хотя бы один способ связи, автоподстановка картины, кнопка в бренд-цвете; 4) галерея: lazy-load, подгрузка по 24, одно действие на карточке, цена и размер; 5) похожие работы ≤ 8 + «Смотреть все»; 6) нет горизонтального скролла на 390px; 7) SEO title/description/alt; 8) единообразные названия в «…». Вне скоупа: дизайн-система (следующая фича), фильтры, отзывы, «Как купить», водяной знак, «картина на заказ», переписывание описаний."

user_stories:
  - id: "US1"
    title: "Покупатель видит характеристики работы"
    priority: "P1"
    description: "На странице работы под заголовком показан блок характеристик: размер (Ш × В см), техника, основа, год и статус (в наличии / продана / в частной коллекции и т. п.). Художница заполняет эти поля в админке."
    motivation:
      problem: "Размер и техника спрятаны в тексте описания («Холст на подрамнике, масло, 80x70, 2026г»), статуса нет — покупатель не понимает, что и какого размера можно купить."
      value: "Ключевые для покупки параметры видны за секунду; меньше уточняющих вопросов, выше доверие и конверсия."
      consequence_if_skipped: "Покупатель уходит, не найдя размер; художница отвечает на одни и те же вопросы."
    why_priority: "Размер и статус — первое, что нужно покупателю картины; без них остальные улучшения конверсии слабее."
    independent_test: "Заполнить в админке размер, технику, основу, год и статус работы; открыть её страницу и увидеть все пять значений; очистить технику — строка «Техника» исчезает."
    acceptance_scenarios:
      - id: "AS-1"
        given: "У работы заполнены ширина 80, высота 70, техника «масло», основа «холст на подрамнике», год 2026, статус «в наличии»"
        when: "Посетитель открывает страницу работы"
        then: "Видит блок характеристик: «80 × 70 см», «масло», «холст на подрамнике», «2026», «В наличии»"
      - id: "AS-2"
        given: "У работы заполнен только размер"
        when: "Посетитель открывает страницу работы"
        then: "В блоке показаны только размер и статус, пустых строк и прочерков нет"
      - id: "AS-3"
        given: "Художница в админке редактирует работу"
        when: "Меняет статус на «продана» и сохраняет"
        then: "На странице работы статус «Продана», кнопка «Узнать цену» заменена на «Заказать похожую»"
    acceptance_criteria:
      - id: "AC-1"
        description: "Страница работы показывает только заполненные характеристики из набора: размер, техника, основа, год, статус"
        done: false
      - id: "AC-2"
        description: "Админка позволяет создать и отредактировать все пять характеристик; некорректные значения (размер вне 1–1000 см, год вне 1950–текущий) отклоняются с понятной ошибкой"
        done: false
      - id: "AC-3"
        description: "Существующие работы после обновления отображаются без ошибок; их статус по умолчанию соответствует текущему признаку «в продаже»"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Работа с заполненными размером, техникой, основой, годом и статусом"
        when: "Открывается страница работы"
        then:
          - "Блок характеристик содержит все пять строк, размер в формате «Ш × В см»"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Админ авторизован"
        when: "Сохраняет работу с высотой 0 или годом 1800"
        then:
          - "Сохранение отклонено с ошибкой поля, данные не изменены"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-3"
        given:
          - "Работа, созданная до обновления, с признаком «в продаже»"
        when: "Запрашивается её публичная карточка"
        then:
          - "Статус «В наличии», остальные характеристики отсутствуют, ошибок нет"
        verification:
          - "automated"
        level: "integration"

  - id: "US2"
    title: "Покупатель пишет художнице в один тап"
    priority: "P1"
    description: "На странице работы рядом с основным действием есть кнопки Telegram, WhatsApp, MAX и «Позвонить». Сообщение уже содержит название картины и ссылку. На мобильном снизу закреплена панель «Написать / Позвонить»."
    motivation:
      problem: "Сейчас единственный путь — «Узнать цену» → форма на другой странице; покупателю с телефона проще написать в мессенджер, но кнопок на карточке нет."
      value: "Путь до заявки сокращается до одного тапа; художница сразу видит, о какой работе речь; каналы измеряются в аналитике."
      consequence_if_skipped: "Мобильные посетители (большая часть трафика) теряются на длинном пути через форму."
    why_priority: "Самое дешёвое и самое сильное по эффекту изменение конверсии."
    independent_test: "Открыть страницу работы на телефоне, нажать WhatsApp — открывается чат с текстом «Здравствуйте! Интересует картина „<название>“ <ссылка>»; в аналитике фиксируется цель с каналом whatsapp."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель на странице работы «Утро в Коктебеле»"
        when: "Нажимает кнопку Telegram"
        then: "Открывается Telegram с предзаполненным текстом с названием «Утро в Коктебеле» и ссылкой на страницу"
      - id: "AS-2"
        given: "Посетитель на странице работы с телефона (ширина экрана меньше 768 px)"
        when: "Прокручивает страницу вниз"
        then: "Внизу экрана постоянно видна панель «Написать» и «Позвонить», не перекрывающая контент и футер"
      - id: "AS-3"
        given: "Посетитель нажимает любую кнопку канала"
        when: "Срабатывает переход"
        then: "В аналитике фиксируется цель обращения с каналом (telegram, whatsapp, max, phone) и названием работы"
    acceptance_criteria:
      - id: "AC-1"
        description: "На странице каждой работы есть кнопки Telegram, WhatsApp, MAX и «Позвонить»; канал без настроенного контакта не показывается"
        done: false
      - id: "AC-2"
        description: "Текст сообщения для мессенджеров, поддерживающих предзаполнение, содержит название работы и её адрес"
        done: false
      - id: "AC-3"
        description: "Каждый клик по каналу отправляет цель аналитики с каналом и названием работы"
        done: false
      - id: "AC-4"
        description: "На экранах уже 768 px на странице работы закреплена нижняя панель «Написать / Позвонить»; на десктопе её нет"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Работа с названием, содержащим пробелы и кавычки"
        when: "Формируются ссылки мессенджеров"
        then:
          - "Текст корректно закодирован, название и адрес страницы присутствуют в ссылках Telegram и WhatsApp"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Страница работы отрисована"
        when: "Пользователь кликает по кнопке WhatsApp"
        then:
          - "Отправлена цель обращения с каналом whatsapp и названием работы"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-3"
        given:
          - "Мобильный экран 390 × 844"
        when: "Открывается страница работы и прокручивается до конца"
        then:
          - "Нижняя панель видна на всём протяжении, футер не перекрыт"
        verification:
          - "automated"
        level: "e2e"

  - id: "US3"
    title: "Покупатель оставляет заявку без email"
    priority: "P1"
    description: "Форма обратной связи принимает телефон или мессенджер вместо email; хотя бы один способ связи обязателен. При переходе с карточки работы её название уже подставлено в тему. Кнопка отправки в основном цвете сайта."
    motivation:
      problem: "Форма требует email — многие покупатели общаются только по телефону и бросают форму; тему приходится вписывать вручную."
      value: "Меньше брошенных форм, художница получает телефон, по которому удобнее связаться."
      consequence_if_skipped: "Часть заявок теряется на обязательном поле email."
    why_priority: "Форма — единственный канал для тех, кто не пользуется мессенджерами; барьер в ней прямо режет заявки."
    independent_test: "Открыть /contacts?artwork=Утро, увидеть тему «Утро», заполнить имя, телефон и сообщение без email, отправить — заявка появляется в админке с телефоном."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель заполнил имя, телефон и сообщение, email пуст"
        when: "Отправляет форму"
        then: "Заявка принята, в админке и уведомлении художнице виден телефон"
      - id: "AS-2"
        given: "Посетитель не указал ни email, ни телефон"
        when: "Пытается отправить форму"
        then: "Форма не отправляется, видно сообщение «Укажите телефон, мессенджер или email»"
      - id: "AS-3"
        given: "Посетитель пришёл со страницы работы «Утро в Коктебеле»"
        when: "Открывается форма"
        then: "Поле темы заполнено названием работы"
    acceptance_criteria:
      - id: "AC-1"
        description: "Заявка принимается при наличии хотя бы одного из: email, телефон/мессенджер; без обоих — отклоняется и на сайте, и на сервере"
        done: false
      - id: "AC-2"
        description: "Указанный email проверяется на корректность; телефон/мессенджер — свободная строка до 100 символов"
        done: false
      - id: "AC-3"
        description: "Телефон/мессенджер сохраняется в заявке и виден в админке и в уведомлении"
        done: false
      - id: "AC-4"
        description: "Название работы из ссылки подставляется в тему; кнопка отправки окрашена в основной цвет сайта"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Заявка с телефоном и без email"
        when: "Отправляется на сервер"
        then:
          - "Ответ успешный, заявка сохранена с телефоном"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-2"
        given:
          - "Заявка без email и без телефона"
        when: "Отправляется на сервер в обход формы"
        then:
          - "Ответ — ошибка валидации, заявка не сохранена"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-3"
        given:
          - "Форма открыта с параметром artwork"
        when: "Отрисовывается и отправляется без email и телефона"
        then:
          - "Поле темы содержит название; отправка блокируется с сообщением об ошибке"
        verification:
          - "automated"
        level: "unit"

  - id: "US4"
    title: "Галерея открывается быстро и ведёт к работе одним действием"
    priority: "P1"
    description: "Галерея показывает первые 24 работы и подгружает следующие по кнопке «Показать ещё»; превью грузятся по мере прокрутки. Карточка целиком — ссылка на работу и показывает цену (или «цена по запросу») и размер."
    motivation:
      problem: "На одной странице более 140 работ и почти 300 изображений без отложенной загрузки — страница грузится около 30 секунд; на карточке две конкурирующие кнопки и нет цены и размера."
      value: "Галерея быстрая на мобильном интернете, карточки сравнимы по цене и размеру."
      consequence_if_skipped: "Посетители уходят, не дождавшись галереи; поисковики штрафуют за скорость."
    why_priority: "Галерея — основной вход в каталог; её скорость влияет на всё остальное."
    independent_test: "Открыть /gallery на мобильной сети: видно 24 карточки и кнопка «Показать ещё»; клик по карточке ведёт на страницу работы; на карточке видны цена или «цена по запросу» и размер."
    acceptance_scenarios:
      - id: "AS-1"
        given: "В выбранной категории 60 работ"
        when: "Посетитель открывает галерею"
        then: "Показано 24 карточки и кнопка «Показать ещё (36)»"
      - id: "AS-2"
        given: "Посетитель нажал «Показать ещё» дважды"
        when: "Все работы показаны"
        then: "Кнопка исчезает, показаны все 60 карточек"
      - id: "AS-3"
        given: "Карточка работы с размером 80 × 70 и без цены"
        when: "Посетитель нажимает на карточку в любом месте"
        then: "Открывается страница работы; на карточке до клика видны «80 × 70 см» и «цена по запросу»"
      - id: "AS-4"
        given: "Посетитель сменил категорию"
        when: "Галерея перерисовывается"
        then: "Снова показаны первые 24 работы новой категории"
    acceptance_criteria:
      - id: "AC-1"
        description: "Изначально показывается не более 24 работ; «Показать ещё» добавляет следующие 24; смена категории сбрасывает счётчик"
        done: false
      - id: "AC-2"
        description: "Превью вне первого экрана загружаются только при приближении к ним"
        done: false
      - id: "AC-3"
        description: "У карточки одно действие — переход на страницу работы; кнопки «Перейти к описанию» и «Узнать цену» убраны; крупный просмотр фото доступен на странице работы"
        done: false
      - id: "AC-4"
        description: "Карточка показывает цену (или «цена по запросу» для работ в наличии) и размер, если он заполнен"
        done: false
      - id: "AC-5"
        description: "Все работы остаются доступны поисковикам по ссылкам (карта сайта содержит каждую работу)"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Список из 60 работ"
        when: "Отрисовывается галерея и дважды нажимается «Показать ещё»"
        then:
          - "Видно 24, затем 48, затем 60 карточек; кнопка исчезает"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Карточка работы без цены с размером"
        when: "Отрисовывается"
        then:
          - "Видно «цена по запросу» и размер; вся карточка — одна ссылка на страницу работы"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-3"
        given:
          - "Галерея на мобильном экране"
        when: "Загружается страница без прокрутки"
        then:
          - "В DOM не более 24 карточек"
        verification:
          - "automated"
        level: "e2e"

  - id: "US5"
    title: "Страница работы не тонет в похожих работах"
    priority: "P2"
    description: "Блок «Другие работы этой категории» показывает не более 8 работ и ссылку «Смотреть все» на галерею с выбранной категорией."
    motivation:
      problem: "Блок показывает все работы категории — страница вырастает до ~14 000 px и тяжелеет."
      value: "Страница работы короче и быстрее, фокус остаётся на покупке."
      consequence_if_skipped: "Медленная бесконечная страница работы."
    why_priority: "Важно для скорости, но не блокирует заявку."
    independent_test: "Открыть работу из категории с 30 работами: в блоке 8 карточек и ссылка «Смотреть все», ведущая в галерею с этой категорией."
    acceptance_scenarios:
      - id: "AS-1"
        given: "В категории 30 работ"
        when: "Посетитель открывает одну из них"
        then: "В блоке похожих 8 других работ этой категории и ссылка «Смотреть все»"
      - id: "AS-2"
        given: "Посетитель нажал «Смотреть все»"
        when: "Открывается галерея"
        then: "Выбрана категория этой работы"
    acceptance_criteria:
      - id: "AC-1"
        description: "В блоке похожих не более 8 работ, текущая работа исключена"
        done: false
      - id: "AC-2"
        description: "Ссылка «Смотреть все» открывает галерею с предвыбранной категорией"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Категория с 30 работами"
        when: "Строится блок похожих"
        then:
          - "8 карточек без текущей работы, ссылка содержит категорию"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Галерея открыта по ссылке с категорией"
        when: "Отрисовывается"
        then:
          - "Активна указанная категория"
        verification:
          - "automated"
        level: "e2e"

  - id: "US6"
    title: "Сайт без горизонтальной прокрутки на телефоне"
    priority: "P2"
    description: "Ни одна публичная страница не прокручивается по горизонтали на экране шириной 390 px; на «Обо мне» устранён выступающий декоративный элемент."
    motivation:
      problem: "Страница «Обо мне» на телефоне шире экрана (398 px при 390), страница «ездит» вбок."
      value: "Аккуратное мобильное отображение без ощущения сломанного сайта."
      consequence_if_skipped: "Неряшливое впечатление у мобильных посетителей; риск регресса на других страницах."
    why_priority: "Дефект заметен, но не блокирует покупку."
    independent_test: "Открыть все публичные страницы на 390 px: ширина документа не превышает ширину экрана."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Экран шириной 390 px"
        when: "Посетитель открывает главную, галерею, страницу работы, «Обо мне», видео, отзывы, контакты, блог"
        then: "Горизонтальной прокрутки нет ни на одной"
    acceptance_criteria:
      - id: "AC-1"
        description: "Автоматическая проверка на 390 px подтверждает отсутствие горизонтальной прокрутки на всех публичных страницах"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Экран 390 × 844"
        when: "Последовательно открываются все публичные страницы"
        then:
          - "Ширина прокрутки документа не превышает ширину экрана на каждой"
        verification:
          - "automated"
        level: "e2e"

  - id: "US7"
    title: "Поисковики и экранные дикторы понимают страницы"
    priority: "P2"
    description: "Заголовок галереи в поиске отражает покупательский запрос, описание страницы отзывов без ошибок, у картины на первом экране главной осмысленный альтернативный текст."
    motivation:
      problem: "Заголовок галереи «Галерея Работ» не совпадает с запросами «купить картину маслом»; в описании отзывов ошибка склонения; у главной картины пустой alt."
      value: "Лучше ранжирование и кликабельность в выдаче, доступность для экранных дикторов."
      consequence_if_skipped: "Упущенный органический трафик."
    why_priority: "SEO — приоритет проекта, но правка точечная."
    independent_test: "Проверить заголовок /gallery, описание /reviews и alt картины на главной в исходном HTML."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Поисковый робот запрашивает /gallery"
        when: "Получает HTML"
        then: "Заголовок страницы «Купить картины маслом — галерея Анжелы Моисеенко»"
      - id: "AS-2"
        given: "Поисковый робот запрашивает /reviews"
        when: "Получает HTML"
        then: "Описание содержит «художника-импрессиониста Анжелы Моисеенко»"
      - id: "AS-3"
        given: "Экранный диктор на главной"
        when: "Доходит до картины первого экрана"
        then: "Озвучивается осмысленное описание картины"
    acceptance_criteria:
      - id: "AC-1"
        description: "Заголовок /gallery — «Купить картины маслом — галерея Анжелы Моисеенко»"
        done: false
      - id: "AC-2"
        description: "Описание /reviews без грамматической ошибки"
        done: false
      - id: "AC-3"
        description: "Изображение первого экрана главной имеет непустой alt с упоминанием картины и художницы"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Метаданные страниц галереи и отзывов"
        when: "Считываются"
        then:
          - "Значения совпадают с требуемыми"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Главная страница"
        when: "Отрисовывается первый экран"
        then:
          - "У изображения непустой alt"
        verification:
          - "automated"
        level: "unit"

  - id: "US8"
    title: "Названия работ выглядят единообразно"
    priority: "P3"
    description: "Названия, сохранённые в разном виде (в кавычках, без кавычек, с «ёлочками» или прямыми кавычками), выводятся единообразно; в заголовке страницы работы — в «ёлочках»."
    motivation:
      problem: "Часть названий в базе обрамлена кавычками, часть нет — каталог выглядит неаккуратно."
      value: "Аккуратный каталог без ручной правки всех записей."
      consequence_if_skipped: "Небрежный вид каталога."
    why_priority: "Косметика, не влияет на путь к покупке."
    independent_test: "Работы с названиями \"Утро\", «Утро» и Утро выводятся в заголовке страницы работы одинаково — «Утро»."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Название сохранено как \"Утро\""
        when: "Выводится в заголовке страницы работы"
        then: "Показано «Утро»"
    acceptance_criteria:
      - id: "AC-1"
        description: "Обрамляющие кавычки любого вида убираются при выводе; в заголовке страницы работы название показано в «ёлочках»; внутренние кавычки сохраняются; данные в базе не меняются"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Названия \"Утро\", «Утро», 'Утро', Утро, «Дом \"у моря\"»"
        when: "Нормализуются для вывода"
        then:
          - "Получается Утро ×4 и Дом \"у моря\"; заголовок оборачивает результат в «»"
        verification:
          - "automated"
        level: "unit"

edge_cases:
  - id: "EC-1"
    description: "У работы не заполнена ни одна характеристика, кроме статуса"
    expected_behavior: "Блок характеристик показывает только статус"
  - id: "EC-2"
    description: "Работа продана или в частной коллекции"
    expected_behavior: "Вместо «Узнать цену» — «Заказать похожую» с тем же набором каналов; цена не показывается"
  - id: "EC-3"
    description: "Выставочное фото (не картина)"
    expected_behavior: "Блок характеристик, кнопки мессенджеров и нижняя панель не показываются"
  - id: "EC-4"
    description: "В настройках сайта не задан контакт какого-то мессенджера"
    expected_behavior: "Кнопка этого канала не отображается, остальные работают"
  - id: "EC-5"
    description: "В параметре artwork формы передан очень длинный или содержащий разметку текст"
    expected_behavior: "Подставляется как обычный текст, обрезается до лимита темы, разметка не исполняется"
  - id: "EC-6"
    description: "В категории 24 работы или меньше"
    expected_behavior: "Кнопка «Показать ещё» не показывается"
  - id: "EC-7"
    description: "В категории нет других работ, кроме текущей"
    expected_behavior: "Блок похожих работ не выводится"
  - id: "EC-8"
    description: "Посетитель открыл ссылку WhatsApp/Telegram на десктопе без установленного приложения"
    expected_behavior: "Открывается веб-версия мессенджера в новой вкладке"

functional_requirements:
  - id: "FR-001"
    text: "The system MUST store for each artwork optional width and height in centimetres (1–1000), year (1950–current), technique (≤ 100 chars), support (≤ 100 chars) and a required status (Available, Sold, PrivateCollection, Unavailable, NotForSale, NotMine; default Available), consistent with the 005-catalog-import data model."
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "WHEN an artwork page is rendered THEN the system MUST show a characteristics block listing only the filled values among size («Ш × В см»), technique, support, year, plus the status."
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "The admin MUST be able to create and edit size, technique, support, year and status; the backend MUST reject out-of-range values with a field-level error."
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "WHEN an artwork status is not Available THEN the system MUST NOT show the price and MUST replace «Узнать цену» with «Заказать похожую»."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-005"
    text: "The artwork page MUST offer Telegram, WhatsApp, MAX and «Позвонить» actions using the site-configured contacts; a channel without a configured contact MUST be hidden."
    story_refs:
      - "US2"
  - id: "FR-006"
    text: "Messenger links that support a prefilled message MUST carry «Здравствуйте! Интересует картина „<название>“ <адрес страницы>» correctly URL-encoded."
    story_refs:
      - "US2"
  - id: "FR-007"
    text: "WHEN a visitor activates any contact channel on an artwork page THEN the system MUST fire the contact analytics goal with the channel name and artwork title."
    story_refs:
      - "US2"
  - id: "FR-008"
    text: "WHILE the viewport is narrower than 768 px the artwork page MUST show a bottom-fixed «Написать / Позвонить» bar that does not obscure page content or the footer."
    story_refs:
      - "US2"
  - id: "FR-009"
    text: "The contact form and backend MUST accept a submission when at least one of email or phone/messenger is provided and MUST reject it when both are empty; email, if present, MUST be a valid address; phone/messenger MUST be ≤ 100 chars."
    story_refs:
      - "US3"
  - id: "FR-010"
    text: "The phone/messenger value MUST be persisted with the message and shown in the admin messages list and in the notification to the artist."
    story_refs:
      - "US3"
  - id: "FR-011"
    text: "WHEN the contacts page is opened with an artwork parameter THEN the subject field MUST be prefilled with that title as plain text truncated to the subject limit; the submit button MUST use the primary brand colour."
    story_refs:
      - "US3"
  - id: "FR-012"
    text: "The gallery MUST initially render at most 24 artworks of the selected category, reveal 24 more per «Показать ещё» activation, hide the button when all are shown, and reset to 24 on category change."
    story_refs:
      - "US4"
  - id: "FR-013"
    text: "Gallery thumbnails outside the initial viewport MUST load lazily and decode asynchronously."
    story_refs:
      - "US4"
  - id: "FR-014"
    text: "Each gallery card MUST be a single link to the artwork page showing the price or «цена по запросу» (for Available artworks) and the size when filled; the «Перейти к описанию» and «Узнать цену» buttons MUST be removed from cards."
    story_refs:
      - "US4"
  - id: "FR-015"
    text: "Every artwork MUST remain reachable by crawlers via the sitemap regardless of gallery pagination."
    story_refs:
      - "US4"
  - id: "FR-016"
    text: "The related-works block MUST show at most 8 artworks of the same category excluding the current one, plus a «Смотреть все» link opening the gallery with that category preselected; the block MUST be hidden when there are no other works."
    story_refs:
      - "US5"
  - id: "FR-017"
    text: "No public page MUST overflow horizontally at a 390 px viewport; an automated check MUST cover home, gallery, an artwork page, about, videos, reviews, contacts and blog."
    story_refs:
      - "US6"
  - id: "FR-018"
    text: "The gallery page title MUST be «Купить картины маслом — галерея Анжелы Моисеенко»; the reviews description MUST read «художника-импрессиониста Анжелы Моисеенко»; the home hero image MUST have a non-empty descriptive alt."
    story_refs:
      - "US7"
  - id: "FR-019"
    text: "WHEN an artwork title is displayed THEN surrounding quote characters (\" ' « » „ “ ”) MUST be stripped while inner quotes are preserved; the artwork page heading MUST wrap the title in «»; stored data MUST NOT change."
    story_refs:
      - "US8"
  - id: "FR-020"
    text: "Exhibition photos MUST NOT show the characteristics block, messenger actions or the mobile bottom bar."
    story_refs:
      - "US1"
      - "US2"

key_entities:
  - id: "E-1"
    name: "Работа (Artwork)"
    description: "Существующая сущность; расширяется полями размера (ширина, высота), года, техники, основы и статуса по модели данных 005-catalog-import"
  - id: "E-2"
    name: "Заявка (ContactMessage)"
    description: "Существующая сущность; email становится необязательным, добавляется телефон/мессенджер; хотя бы одно из двух обязательно"
  - id: "E-3"
    name: "Канал связи"
    description: "Telegram, WhatsApp, MAX, телефон — контакты берутся из существующих настроек сайта (социальные ссылки и телефон)"

success_criteria:
  - id: "SC-001"
    description: "Доля посещений страниц работ, завершившихся обращением (клик по каналу или отправка формы), растёт не менее чем на 30% за 30 дней после релиза относительно 30 дней до"
    measurable_via: "Цели обращения в Яндекс.Метрике, сравнение периодов"
  - id: "SC-002"
    description: "Галерея на мобильном интернете становится пригодной к взаимодействию быстрее 3 секунд (против ~30 сейчас)"
    measurable_via: "Lighthouse mobile / замер загрузки /gallery"
  - id: "SC-003"
    description: "Не менее 20% заявок через форму приходят без email (только с телефоном/мессенджером)"
    measurable_via: "Выборка заявок в админке за 30 дней"
  - id: "SC-004"
    description: "0 публичных страниц с горизонтальной прокруткой на 390 px"
    measurable_via: "Автоматическая e2e-проверка"
  - id: "SC-005"
    description: "Покупатель находит размер и статус работы за 5 секунд без чтения описания"
    measurable_via: "Ручная проверка на 5 случайных работах"
  - id: "SC-006"
    description: "Высота страницы работы на десктопе сокращается не менее чем в 2 раза для крупных категорий"
    measurable_via: "Замер высоты документа до/после"

assumptions:
  - id: "A-1"
    description: "Поля характеристик и статус вводятся ровно по модели данных 005-catalog-import (те же имена, ограничения и значения статуса), чтобы импорт каталога из xlsx лёг поверх без конфликтующей миграции; ShortDescription, IsFeatured, NeedsReshoot, IsPublished и сам импорт остаются в 005"
  - id: "A-2"
    description: "Статус существующих работ при обновлении: Available, если работа в продаже, иначе NotForSale; признак «в продаже» далее вычисляется как статус == Available"
  - id: "A-3"
    description: "Контакты мессенджеров и телефон берутся из уже существующих настроек сайта (socialLinks, phone); новых настроек не вводится. MAX и «Позвонить» не поддерживают предзаполнение — открывают профиль/набор номера"
  - id: "A-4"
    description: "Когда будет внедрена 007-funnel-bot, кнопка Telegram может быть переключена на бот с контекстом работы; в этой фиче — прямой чат с художницей через t.me с текстом (share-ссылка)"
  - id: "A-5"
    description: "Подгрузка «Показать ещё» выполняется на клиенте поверх уже полученного списка; серверная пагинация API не требуется при текущем объёме (~150 работ)"
  - id: "A-6"
    description: "Цвет кнопки отправки — текущий основной цвет сайта; смена палитры — в следующей фиче (дизайн-система)"
  - id: "A-7"
    description: "Переписывание сгенерированных описаний работ — контентная задача в админке, кодом не решается"

    description: 'Создать frontend/lib/normalizeTitle.ts: trim + снятие одной пары обрамляющих кавычек (" '' « » „ “ ”), внутренние сохраняются; quotedTitle(raw) → «normalized»'
    context: 'Названия нужны в карточках, заголовках, тексте мессенджеров и теме формы — единая точка нормализации (R7)'
    story_ref: US8
    requirement_refs: [FR-019]
    depends_on: []
    parallelizable: true
    entity_refs: [artwork]
    contract_refs: []
    steps:
      - order: 1
        action: 'Написать тесты'
        detail: 'frontend/lib/normalizeTitle.test.ts: "Закат" → Закат; «Закат» → Закат; „Закат“ → Закат; Дом «у моря» → без изменений; пустая строка → пустая; quotedTitle("\"Закат\"") → «Закат»'
      - order: 2
        action: 'Реализовать'
        detail: 'export function normalizeTitle(raw: string | null | undefined): string; export function quotedTitle(raw): string'
    technical_notes:
      - path: frontend/lib/normalizeTitle.ts
        note: 'Без any; ≤ 50 строк на функцию'
    acceptance_criteria:
      - id: AC-1

    depends_on: [T002]
    parallelizable: false
    entity_refs: [artwork]
    contract_refs: [public-artwork-dto, admin-artwork-upsert]
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'MomSite.Tests: маппинг возвращает новые поля; PUT с Status=Sold → IsForSale=false; WidthCm=0 или Year=1900 → 400 с ошибкой поля'
      - order: 2
        action: 'Расширить DTO'
        detail: 'Status сериализуется строкой (JsonStringEnumConverter на свойстве); camelCase поля widthCm, heightCm, year, support, technique, status'
      - order: 3
        action: 'Обновить контроллер'
        detail: 'ArtworksController Create (строка ~109) и Update (~137): присвоить поля, IsForSale = dto.Status == ArtworkStatus.Available; Year валидировать IValidatableObject в DTO'
      - order: 4
        action: 'Публичный API'
        detail: 'PublicController gallery и BlogPublicDtos, где маппятся работы, — через MappingExtensions'
    technical_notes:
      - path: backend/MomSite.API/Controllers/ArtworksController.cs
        note: 'Inline DTO-классы на строках 170–190; если файл > 200 строк — вынести DTO в DTOs/ArtworkUpsertDto.cs'
      - path: backend/MomSite.API/DTOs/MappingExtensions.cs
        note: 'Единая точка маппинга'
    acceptance_criteria:
      - id: AC-1
        description: 'GET /api/public/gallery отдаёт status и характеристики; PUT валидирует диапазоны'
        done: false
    test_scenarios:

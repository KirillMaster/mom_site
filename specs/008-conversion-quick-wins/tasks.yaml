    story_ref: US1
    requirement_refs: [FR-001]
    depends_on: []
    parallelizable: true
    entity_refs: [artwork]
    contract_refs: []
    steps:
      - order: 1
        action: 'Добавить enum и поля'
        detail: 'backend/MomSite.Core/Models/ArtworkStatus.cs; Artwork: ArtworkStatus Status = Available; int? WidthCm [Range(1,1000)]; int? HeightCm [Range(1,1000)]; int? Year; [MaxLength(100)] string? Support; [MaxLength(100)] string? Technique'
      - order: 2
        action: 'Сгенерировать миграцию'
        detail: 'dotnet ef migrations add AddArtworkCatalogFields --project MomSite.Infrastructure --startup-project MomSite.API --output-dir Data/Migrations; в Up после AddColumn: migrationBuilder.Sql("UPDATE \"Artworks\" SET \"Status\" = CASE WHEN \"IsForSale\" THEN 0 ELSE 4 END")'
      - order: 3
        action: 'Проверить имена таблиц'
        detail: 'Сверить имя таблицы/колонок с ApplicationDbContextModelSnapshot.cs; Status хранится int'
    technical_notes:
      - path: backend/MomSite.Core/Models/Artwork.cs
        note: 'IsForSale остаётся колонкой (R2)'
      - path: backend/MomSite.Infrastructure/Data/Migrations/
        note: 'Последняя миграция 20261002174348_AddBlog'
    acceptance_criteria:
      - id: AC-1
        description: 'dotnet build зелёный; миграция применяется на чистой и существующей БД; непродаваемые работы получают NotForSale'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['БД с работой IsForSale=false']
        when: 'dotnet ef database update'
        then: ['Status = NotForSale']
        verification: [automated]
        level: integration


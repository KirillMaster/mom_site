feature: 009-design-system-seaside
tasks:
  # ---------- Phase 2: Foundational ----------
  - id: T001
    title: 'Токены палитры, шрифты и шкала типографики'
    description: 'frontend/tailwind.config.js: colors paper/ink/sea/ochre/line (с оттенками), fontFamily serif=var(--font-serif), sans=var(--font-sans); app/layout.tsx: Cormorant_Garamond + Manrope вместо Playfair/Inter, body bg-paper text-ink; app/globals.css: base h1–h4 шкала, .caption, .prose-measure, btn-*/card переведены на токены или удалены, gradient-bg/text-gradient удалены, prefers-reduced-motion'
    context: 'Единый источник визуальных значений (R2, R4, R5, R7); старые primary/secondary/warm остаются в конфиге только для админки (A-2)'
    story_ref: US1
    requirement_refs: [FR-001, FR-004, FR-005, FR-012]
    depends_on: []
    parallelizable: false
    entity_refs: [design-tokens]
    contract_refs: []
    steps:
      - order: 1
        action: 'Токены'
        detail: 'paper: {DEFAULT:#F7F6F3, 50:#FBFAF8, 100:#F7F6F3, 200:#EFEDE8}; ink: {DEFAULT:#1F2328, 500:#5A6069, 600:#454B53, 700:#33383F, 900:#1F2328}; sea: {DEFAULT:#2F4A5C, 50:#EEF2F5, 100:#D9E2E8, 600:#2F4A5C, 700:#263D4C, 800:#1D2F3B}; ochre: {DEFAULT:#B8862F, 700:#8A6420}; line: {DEFAULT:#E2DED6}. ink-500 на paper должен давать ≥ 4.5:1'
      - order: 2
        action: 'Шрифты'
        detail: 'Cormorant_Garamond({subsets:[latin,cyrillic], weight:[500,600], style:[normal,italic], variable:--font-serif, display:swap}); Manrope({subsets:[latin,cyrillic], weight:[400,500,600], variable:--font-sans, display:swap}); body className bg-paper text-ink font-sans'
      - order: 3
        action: 'globals.css'
        detail: 'body bg-paper text-ink; h1–h4 font-serif font-medium leading-tight + размеры R5; .caption text-sm text-ink-500; .prose-measure max-width:75ch; @media (prefers-reduced-motion: reduce) отключить rise-in и прочие анимации; удалить .gradient-bg и .text-gradient (заменить использования в T008–T012) — либо оставить класс, но без градиента до их перевода'
    technical_notes:
      - path: frontend/tailwind.config.js
        note: 'primary/secondary/warm не удалять — админка'
      - path: frontend/app/layout.tsx
        note: 'После next dev/build откатывать frontend/tsconfig.json'
    acceptance_criteria:
      - id: AC-1
        description: 'Сборка и все существующие jest-тесты зелёные; body на paper'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Палитра из tailwind.config.js']
        when: 'Считается контраст ink/paper, ink-500/paper, white/sea, sea/paper, ochre-700/paper'
        then: ['Все ≥ 4.5:1 (frontend/__tests__/palette-contrast.test.ts)']
        verification: [automated]
        level: unit

  - id: T002
    title: 'lib/price.ts и lib/site.ts (долг 008)'
    description: 'Перенести formatPrice/priceLabel/sizeLabel из lib/galleryCard.ts в lib/price.ts (galleryCard реэкспортирует или удаляется с обновлением импортов); убрать локальный formatPrice из ArtworkInfoCard; SITE_PHONE перенести в lib/site.ts, PhoneLink и lib/contactChannels, lib/social импортируют из lib'
    context: 'Две реализации цены дают разный формат (долг 008); lib → components — нарушение направления зависимостей (P2)'
    story_ref: US3
    requirement_refs: [FR-007]
    depends_on: []
    parallelizable: true
    entity_refs: [artwork]
    contract_refs: [price-lib]
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'frontend/lib/price.test.ts: formatPrice 1500→«1 500 ₽», 45000→«45 000 ₽», 1250000→«1 250 000 ₽» (нормализовать U+00A0/U+202F к пробелу); priceLabel: price 0/null → «цена по запросу»; Sold → «Продана»; exhibition → null'
      - order: 2
        action: 'Перенос'
        detail: 'Обновить импорты GalleryCard, ArtworkInfoCard, существующие тесты; lib/galleryCard.ts удалить, если пуст'
      - order: 3
        action: 'SITE_PHONE'
        detail: 'lib/site.ts export const SITE_PHONE; components/PhoneLink реэкспортирует для совместимости или импортирует из lib; grep "from .@/components" в lib/ должен быть пуст'
    technical_notes:
      - path: frontend/lib/price.ts
        note: 'Intl.NumberFormat ru-RU maximumFractionDigits 0 + " ₽"'
    acceptance_criteria:
      - id: AC-1
        description: 'Один formatPrice в кодовой базе; lib не импортирует components'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Цены 0, 1500, 45000, 1250000, null']
        when: 'priceLabel для Available'
        then: ['«цена по запросу», «1 500 ₽», «45 000 ₽», «1 250 000 ₽», «цена по запросу»']
        verification: [automated]
        level: unit

  - id: T003
    title: 'UI-примитивы Button, TextLink, Card, Section, Container'
    description: 'frontend/components/ui/{Button,TextLink,Card,Section,Container}.tsx + index.ts'
    context: 'Единые кнопки/карточки/ритм вместо ручной стилизации на каждой странице (FR-008, FR-009)'
    story_ref: US4
    requirement_refs: [FR-008, FR-009]
    depends_on: [T001]
    parallelizable: true
    entity_refs: [design-tokens]
    contract_refs: [ui-primitives]
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'components/ui/__tests__ или *.test.tsx: Button variant primary/secondary/ghost даёт классы bg-sea / border-sea / text-sea; с href — <a> (next/link), без — <button type="button" по умолчанию>; пробрасывает onClick, disabled, aria-*; все имеют focus-visible:ring-sea. TextLink — text-sea underline-offset. Card — bg-paper-50 border-line без shadow-lg. Section — py-16 md:py-24; Container — max-w-6xl px-4'
      - order: 2
        action: 'Реализация'
        detail: 'Классы фокуса: focus:outline-none focus-visible:ring-2 focus-visible:ring-sea focus-visible:ring-offset-2 focus-visible:ring-offset-paper. Primary: bg-sea text-white hover:bg-sea-700; secondary: border border-sea text-sea hover:bg-sea-50; ghost: text-sea hover:underline. rounded-md, без теней'
    technical_notes:
      - path: frontend/components/ui/
        note: 'className-проп мерджится в конец; без новых зависимостей (без clsx, если его нет)'
    acceptance_criteria:
      - id: AC-1
        description: 'Примитивы покрыты тестами, экспортируются из components/ui'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Button variant=secondary href=/gallery']
        when: 'Рендерится'
        then: ['<a href="/gallery"> с классами secondary и кольцом фокуса']
        verification: [automated]
        level: unit

  - id: T004
    title: 'UI-примитивы Input и Textarea'
    description: 'frontend/components/ui/{Input,Textarea}.tsx: label, error, hint; useId; aria-invalid, aria-describedby'
    context: 'Форма контактов — ключевая точка конверсии; фокус и ошибки должны быть доступны (FR-008, FR-009)'
    story_ref: US4
    requirement_refs: [FR-008, FR-009]
    depends_on: [T001]
    parallelizable: true
    entity_refs: [design-tokens]
    contract_refs: [ui-primitives]
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'getByLabelText находит поле; error → role=alert/текст, aria-invalid=true, aria-describedby указывает на id ошибки; forwardRef и пропсы (name, required, value, onChange) пробрасываются'
      - order: 2
        action: 'Реализация'
        detail: 'bg-white border border-line rounded-md px-3 py-2 text-ink placeholder:text-ink-500 focus-visible:ring-2 ring-sea; ошибка text-red-700 (контраст ≥ 4.5)'
    technical_notes:
      - path: frontend/components/ui/Input.tsx
        note: 'forwardRef'
    acceptance_criteria:
      - id: AC-1
        description: 'Метка и ошибка программно связаны с полем'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Input label="Имя" error="Обязательное поле"']
        when: 'Рендерится'
        then: ['Поле aria-invalid=true, aria-describedby → текст ошибки']
        verification: [automated]
        level: unit

  # ---------- Phase 3: US3 ----------
  - id: T005
    title: 'MuseumLabel и применение в галерее, карточке, RelatedWorks'
    description: 'frontend/components/artwork/MuseumLabel.tsx; заменить подписи в app/gallery/GalleryCard.tsx, app/gallery/[slug]/ArtworkInfoCard.tsx (заголовок + цена) и app/gallery/[slug]/RelatedWorks.tsx'
    context: 'Сигнатура стиля и единый формат подписи/цены (FR-006, FR-007)'
    story_ref: US3
    requirement_refs: [FR-006, FR-007]
    depends_on: [T001, T002]
    parallelizable: false
    entity_refs: [museum-label, artwork]
    contract_refs: [museum-label-component, price-lib]
    steps:
      - order: 1
        action: 'Тесты'
        detail: 'MuseumLabel.test.tsx: полная работа → «Закат» (italic, font-serif), «масло, холст», «80 × 70 см», «2026», «45 000 ₽» (text-ochre-700); без technique/support/year → этих строк нет; Sold → «Продана»; exhibition → только название и год; название "\"Закат\"" → «Закат» (normalizeTitle/quotedTitle); длинное название — break-words'
      - order: 2
        action: 'Компонент'
        detail: 'Порядок строк: title (as h2/h3/p, italic font-serif, в «…»), medium = [technique, support].filter(Boolean).join(", ") lower-case как в данных, size = sizeLabel, year, priceOrStatus = priceLabel. size sm|md меняет кегль. Тонкая линия border-t border-line над ценой'
      - order: 3
        action: 'Применение'
        detail: 'GalleryCard: убрать собственные строки цены/размера/статуса → MuseumLabel size=sm; RelatedWorks: MuseumLabel size=sm; ArtworkInfoCard: h1 названия остаётся для SEO, под ним MuseumLabel size=md без дублирования названия (проп hideTitle) либо h1 рендерится MuseumLabel as=h1 — выбрать вариант, сохраняющий единственный h1. Обновить существующие тесты страниц'
    technical_notes:
      - path: frontend/components/artwork/MuseumLabel.tsx
        note: '≤ 80 строк; без бизнес-логики помимо lib/price и normalizeTitle'
    acceptance_criteria:
      - id: AC-1
        description: 'Три места показа используют MuseumLabel; одинаковые строки и формат'
        done: false
    test_scenarios:
      - id: TS-1
        given: ['Работа без техники и года']
        when: 'Рендерится MuseumLabel'
        then: ['Строк техники и года нет, лишних разделителей нет']
        verification: [automated]
        level: unit


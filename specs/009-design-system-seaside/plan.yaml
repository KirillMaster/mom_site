feature: 009-design-system-seaside
branch: feature/009-design-system-seaside
summary: >-
  Семантические токены paper/ink/sea/ochre/line в tailwind.config (старые primary/secondary/warm
  остаются только для админки); шрифты Cormorant Garamond + Manrope через next/font с переменными
  --font-serif/--font-sans; шкала типографики и .prose-measure (max-width 75ch) в globals.css;
  примитивы components/ui (Button, TextLink, Input, Textarea, Card, Section, Container);
  MuseumLabel в components/artwork и единый lib/price.ts (formatPrice, priceLabel) вместо двух
  реализаций; перевод публичных страниц, Navigation, Footer, MobileContactBar на токены и
  примитивы; jest-гард запрещённых цветовых классов в публичных файлах, тест контраста палитры,
  e2e на фон/шрифты/скриншоты 1280 и 390.
technical_context:
  language_version: TypeScript 5 strict / Next.js 14 App Router, React 18 (только frontend)
  primary_dependencies:
    - Tailwind CSS 3 (theme.extend.colors — новые токены)
    - next/font/google (Cormorant_Garamond, Manrope, subsets latin+cyrillic, display swap)
    - Intl.NumberFormat ru-RU (lib/price.ts)
    - Jest + Testing Library, Playwright (существуют); новых npm-зависимостей нет
  storage: N/A — данные и API не меняются
  testing: Jest (ui-примитивы, MuseumLabel, formatPrice/priceLabel, контраст палитры, гард запрещённых классов по исходникам, Navigation aria-current); Playwright (фон body и font-family, ширина абзаца ≤ 75ch, no-overflow 390, скриншоты главной/галереи/карточки/контактов 1280 и 390)
  target_platform: Linux Docker (mom_site_frontend_prod), браузеры mobile-first
  project_type: web_application
  performance_goals: Не более 2 семейств шрифтов, ≤ 5 начертаний; CLS от шрифтов ≈ 0 (adjustFontFallback next/font); LCP карточки на мобильном ≤ 2,5 с (P8)
  constraints: Админка (app/admin, components/admin, components/blog/admin, MessagesList, AdminPageShell, AdminAuthGuard) визуально не меняется; backend не трогаем; ochre #B8862F на бумаге даёт контраст ≈ 3:1, поэтому текст цены — ochre-700 #8A6420 (≈ 4.9:1), базовая охра — для линий/маркеров; файлы ≤ 200 строк, функции ≤ 50 (P3)
  scale_scope: ~430 работ, ~10 публичных страниц, ~35 публичных компонентов с цветовыми классами

project_structure:
  layout: web_application
  description: >-
    Только frontend. Токены — frontend/tailwind.config.js; базовые стили и шкала —
    frontend/app/globals.css; шрифты — frontend/app/layout.tsx. Новые примитивы —
    frontend/components/ui/*. Этикетка — frontend/components/artwork/MuseumLabel.tsx.
    Цена — frontend/lib/price.ts (заменяет formatPrice/priceLabel из lib/galleryCard.ts и
    ArtworkInfoCard). Список публичных путей для гарда — frontend/lib/publicSurface.ts.
    Перевод страниц app/{page,HomeClientPage,about,gallery,videos,reviews,contacts,blog} и
    components (Navigation, Footer, ArtworkCarousel, ArtistCredentials, ReviewsList,
    ExhibitionTimeline, PhoneLink, blog/* кроме admin). Долг 008: SITE_PHONE переносится в
    lib/site.ts, lib → components зависимость убирается.
  directories:
    - frontend/tailwind.config.js
    - frontend/app/
    - frontend/app/gallery/
    - frontend/app/gallery/[slug]/
    - frontend/app/about/
    - frontend/app/contacts/
    - frontend/app/videos/
    - frontend/app/reviews/
    - frontend/app/blog/
    - frontend/components/
    - frontend/components/ui/
    - frontend/components/artwork/
    - frontend/components/blog/
    - frontend/lib/
    - frontend/__tests__/
    - frontend/e2e/

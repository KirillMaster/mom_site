- id: T008
  title: 'RowValidator: проверка строк листов и RowResult'
  description: 'Валидатор строки: ID, дубли ID в файле, новая работа, название, предупреждения; лист «Фото с выставок»'
  context: Каждая строка даёт изменения и замечания, плохая строка не останавливает остальные
  story_ref: US1
  requirement_refs:
  - FR-003
  - FR-007
  - FR-008
  depends_on:
  - T006
  - T007
  parallelizable: false
  entity_refs:
  - artwork
  - import-report
  contract_refs:
  - catalog-import-service-impl
  steps:
  - order: 1
    action: Создать валидатор
    detail: 'backend/MomSite.Infrastructure/Catalog/RowValidator.cs и RowResult.cs: вход значения строки по HeaderMap, существующие ID, встреченные ID, существующие названия; выход RowResult{Row,Sheet,Id?,Title,DesiredChanges,Issues}'
  - order: 2
    action: Лист «Каталог»
    detail: 'ID не int>0 или неизвестный error (строка пропущена); повтор ID error «дубль ID»; пустой ID новая работа: Title обязателен, совпадение названия без регистра warning; полностью пустые строки пропускаются; «Комментарий» только в отчёт'
  - order: 3
    action: Лист «Фото с выставок»
    detail: 'ID + «Оставить на сайте?»: нет IsPublished=false; «Где и когда» непусто в Description'
  - order: 4
    action: Статус NotMine
    detail: Желаемое изменение Status=NotMine (скрытие через Visible), не удаление
  - order: 5
    action: Тесты
    detail: backend/MomSite.Tests/Catalog/RowValidatorTests.cs по EC-2, EC-3, EC-5, EC-6, EC-7
  technical_notes:
  - path: specs/005-catalog-import/design-notes.md
    note: Правила листов и ошибок
  - path: scripts/catalog/build_catalog.py
    note: Хвост из пустых заготовленных строк (EC-7)

feature: 005-catalog-import
tasks:
- id: T001
  title: Подключить ClosedXML в Infrastructure
  description: Добавить пакет ClosedXML (MIT) в MomSite.Infrastructure и создать каталоги модуля
  context: Парсер xlsx нужен всем историям импорта; пакета в проекте ещё нет (R1)
  story_ref: US1
  requirement_refs:
  - FR-001
  depends_on: []
  parallelizable: true
  entity_refs: []
  contract_refs: []
  steps:
  - order: 1
    action: Добавить пакет
    detail: cd backend && dotnet add MomSite.Infrastructure package ClosedXML
  - order: 2
    action: Создать каталоги
    detail: backend/MomSite.Infrastructure/Catalog/ и backend/MomSite.Tests/Catalog/
  - order: 3
    action: Собрать решение
    detail: cd backend && dotnet build
  technical_notes:
  - path: backend/MomSite.Infrastructure/MomSite.Infrastructure.csproj
    note: Сейчас нет ClosedXML
  - path: backend/MomSite.Tests/MomSite.Tests.csproj
    note: Тесты net9.0; Infrastructure приходит транзитивно
  acceptance_criteria:
  - id: AC-1
    description: dotnet build зелёный с ClosedXML
    done: true
  - id: AC-2
    description: Версия пакета записана в research.md R1
    done: true
  test_scenarios:
  - id: TS-1
    given:
    - Пакет добавлен
    when: dotnet build
    then:
    - 0 ошибок
    verification:
    - automated
    level: unit
- id: T002
  title: Проверить/добавить поля характеристик Artwork (условная, после merge 008)
  description: Убедиться, что после merge 008-conversion-quick-wins в Artwork есть Status (ArtworkStatus), WidthCm, HeightCm, Year, Support, Technique и ApplyStatus; если чего-то нет, добавить по data-model 005
  context: 008 вводит эти поля по тому же data-model; дублировать модель и миграцию нельзя, но без полей импорту нечего писать
  story_ref: US1
  requirement_refs:
  - FR-014
  - FR-002
  depends_on: []
  parallelizable: false
  entity_refs:
  - artwork
  contract_refs: []
  steps:
  - order: 1
    action: Проверить наличие
    detail: grep по backend/MomSite.Core/Models/Artwork.cs и ArtworkStatus.cs на Status, WidthCm, HeightCm, Year, Support, Technique, ApplyStatus; ls backend/MomSite.Infrastructure/Data/Migrations
  - order: 2
    action: Если поля есть, сверить типы
    detail: WidthCm/HeightCm в 005 это decimal numeric(6,1) (допускается 50,5); в 008 заявлены целыми. Если в БД int, приведение типа делается в миграции T003 (AlterColumn), не отдельной миграцией
  - order: 3
    action: Если полей нет, добавить
    detail: 'enum ArtworkStatus (Available, Sold, PrivateCollection, Unavailable, NotForSale, NotMine) в Core/Models/ArtworkStatus.cs; в Artwork: Status (default Available), WidthCm/HeightCm decimal?, Year int?, Support/Technique string? (до 100); ApplyStatus(status) выставляет Status и IsForSale = Status == Available'
  - order: 4
    action: Сконфигурировать в контексте
    detail: 'ApplicationDbContext: Status HasConversion<int>, WidthCm/HeightCm numeric(6,1), Support/Technique HasMaxLength(100)'
  - order: 5
    action: Миграция при отсутствии полей
    detail: 'dotnet ef migrations add AddArtworkCharacteristics -p MomSite.Infrastructure -s MomSite.API -o Data/Migrations; data-migration Status = IsForSale ? Available : NotForSale. Если 008 уже мигрировала, шаг пропустить и отметить в research.md R3'
  technical_notes:
  - path: backend/MomSite.Core/Models/Artwork.cs
    note: 'Сейчас: Id/Title/Description(1000)/ImagePath/ThumbnailPath/Price/IsForSale/CreatedAt/UpdatedAt/CategoryId/Images'
  - path: backend/MomSite.Infrastructure/Data/ApplicationDbContext.cs
    note: Блок конфигурации Artwork
  - path: backend/MomSite.Infrastructure/Data/Migrations/
    note: Последняя миграция AddBlog
  - path: specs/008-conversion-quick-wins/data-model.yaml
    note: Источник полей в 008 (ветка не в main)
  acceptance_criteria:
  - id: AC-1
    description: В Artwork есть все поля, WidthCm/HeightCm допускают дробь
    done: true
  - id: AC-2
    description: ApplyStatus держит IsForSale == (Status == Available)
    done: true
  - id: AC-3
    description: Нет двух миграций с одинаковыми колонками
    done: true
  test_scenarios:
  - id: TS-1
    given:
    - Артворк со Status=Sold
    when: ApplyStatus(Available), затем ApplyStatus(NotMine)
    then:
    - IsForSale true, затем false
    verification:
    - automated
    level: unit
  - id: TS-2
    given:
    - Чистая БД
    when: dotnet ef database update
    then:
    - Колонки созданы, Status выведен из IsForSale
    verification:
    - automated
    level: integration
- id: T003
  title: Доп. поля Artwork и миграция AddArtworkCatalogFields
  description: Добавить ShortDescription, IsFeatured, NeedsReshoot, IsPublished, расширить Description до 5000, при необходимости привести WidthCm/HeightCm к numeric(6,1); единые лимиты ArtworkFieldRules
  context: Эти поля есть только в 005; общие лимиты нужны и импорту, и форме админки
  story_ref: US1
  requirement_refs:
  - FR-013
  - FR-002
  depends_on:
  - T002
  parallelizable: false
  entity_refs:
  - artwork
  contract_refs: []
  steps:
  - order: 1
    action: Добавить поля
    detail: 'Artwork: ShortDescription string? [MaxLength(300)], IsFeatured=false, NeedsReshoot=false, IsPublished=true; Description [MaxLength(5000)]'
  - order: 2
    action: Единые лимиты
    detail: 'backend/MomSite.Core/Models/ArtworkFieldRules.cs: TitleMax=200, DescriptionMax=5000, ShortDescriptionMax=300, SupportMax=100, TechniqueMax=100, SizeMin=1, SizeMax=1000, YearMin=1950, IsYearValid(int, DateTime now)'
  - order: 3
    action: Настроить контекст
    detail: 'ApplicationDbContext: Description HasMaxLength(5000), ShortDescription HasMaxLength(300), IsPublished HasDefaultValue(true); при int-колонках WidthCm/HeightCm AlterColumn до numeric(6,1)'
  - order: 4
    action: Миграция
    detail: dotnet ef migrations add AddArtworkCatalogFields -p MomSite.Infrastructure -s MomSite.API -o Data/Migrations; существующие работы IsPublished=true
  - order: 5
    action: Проверить
    detail: dotnet build && dotnet test
  technical_notes:
  - path: backend/MomSite.Core/Models/Artwork.cs
    note: Description сейчас [MaxLength(1000)]
  - path: backend/MomSite.Infrastructure/Data/ApplicationDbContext.cs
    note: Description HasMaxLength(1000) заменить на 5000
  - path: backend/MomSite.Core/Models/ArtworkFieldRules.cs
    note: Новый файл, до 200 строк (P3)
  acceptance_criteria:
  - id: AC-1
    description: Миграция применяется на БД с данными, текущие работы IsPublished=true
    done: true
  - id: AC-2
    description: Description принимает 5000 символов, ShortDescription 300
    done: true
  - id: AC-3
    description: ArtworkFieldRules единственное место лимитов
    done: true
  test_scenarios:
  - id: TS-1
    given:
    - БД с 3 работами
    when: Применить миграцию
    then:
    - Все 3 с IsPublished=true, IsFeatured=false, NeedsReshoot=false
    verification:
    - automated
    level: integration
  - id: TS-2
    given:
    - Годы 1949, 1950, текущий+1
    when: IsYearValid
    then:
    - false, true, false
    verification:
    - automated
    level: unit
- id: T004
  title: Единый фильтр видимости Visible() для публичных выборок
  description: 'Расширить существующий IQueryable<Artwork>.Visible(): IsPublished && Status != NotMine; применить в публичных запросах'
  context: Скрытые работы не должны попадать в галерею, главную, sitemap и ссылки блога; фильтр один на весь сайт (R7)
  story_ref: US4
  requirement_refs:
  - FR-011
  - FR-008
  depends_on:
  - T003
  parallelizable: false
  entity_refs:
  - artwork
  contract_refs:
  - public-artworks
  steps:
  - order: 1
    action: Расширить расширение
    detail: 'ArtworkQueryExtensions.Visible: .Where(a => a.IsPublished && a.Status != ArtworkStatus.NotMine); убрать комментарий «005 добавит»; второе определение не создавать'
  - order: 2
    action: Применить в PublicController
    detail: 'Запрос главной (~строка 42) и GetGalleryData (~строка 137): _context.Artworks.Visible()'
  - order: 3
    action: Проверить остальные места
    detail: 'grep Artworks по backend/MomSite.API и Infrastructure: публичные выборки идут через Visible() (BlogQueries уже), админские нет'
  - order: 4
    action: Тесты
    detail: 'backend/MomSite.Tests/PublicControllerTests.cs: скрытые работы отсутствуют'
  technical_notes:
  - path: backend/MomSite.Infrastructure/Data/ArtworkQueryExtensions.cs
    note: Сейчас Visible() => query (создан в 006)
  - path: backend/MomSite.API/Controllers/PublicController.cs
    note: Home и gallery читают _context.Artworks без фильтра
  - path: backend/MomSite.Infrastructure/Blog/BlogQueries.cs
    note: Уже использует Visible(), менять не нужно
  acceptance_criteria:
  - id: AC-1
    description: В решении одно определение Visible() для Artwork
    done: true
  - id: AC-2
    description: /api/public/gallery и главная не возвращают IsPublished=false и NotMine
    done: true
  - id: AC-3
    description: Админский список видит все работы
    done: true
  test_scenarios:
  - id: TS-1
    given:
    - 'Работы: опубликованная, черновик, NotMine'
    when: GET /api/public/gallery
    then:
    - Только опубликованная
    verification:
    - automated
    level: integration
  - id: TS-2
    given:
    - Те же работы
    when: GET /api/admin/artworks
    then:
    - Все три
    verification:
    - automated
    level: integration
- id: T005
  title: Журнал импорта и контракт сервиса в Core
  description: CatalogImportLog, ICatalogImportService, типы отчёта ImportReport/RowReport/ImportSummary, миграция AddCatalogImportLog
  context: Сервису, контроллеру и откату нужны общие типы отчёта и журнал снимков
  story_ref: US1
  requirement_refs:
  - FR-005
  - FR-006
  depends_on:
  - T003
  parallelizable: false
  entity_refs:
  - catalog-import-log
  - import-report
  contract_refs:
  - catalog-import-service
  steps:
  - order: 1
    action: Модель журнала
    detail: 'backend/MomSite.Core/Models/CatalogImportLog.cs: Id, CreatedAt (UTC), UserName, FileName, FileSha256, Summary (jsonb), Snapshot (jsonb [{artworkId, field, oldValue}]), CreatedIds (jsonb int[]), RolledBackAt?'
  - order: 2
    action: Типы отчёта
    detail: 'backend/MomSite.Core/Models/Catalog/ImportReport.cs (records): ImportSummary, RowReport{Row,Sheet,Id,Title,Changes[{Field,Old,New}],Issues[{Level,Column,Message}],Comment}, ImportReport{Summary,Rows,LogId}, FileError enum (not_xlsx, file_unreadable, sheet_missing, required_header_missing, too_many_rows)'
  - order: 3
    action: Интерфейс
    detail: 'backend/MomSite.Core/Interfaces/ICatalogImportService.cs: ImportAsync(Stream file, string fileName, bool dryRun, string userName, CancellationToken) и RollbackLastAsync(CancellationToken); результат Report | FileInvalid(error) | Busy'
  - order: 4
    action: DbSet и конфигурация
    detail: 'ApplicationDbContext: DbSet<CatalogImportLog>; jsonb для Snapshot/CreatedIds/Summary с конвертером, совместимым с тестовыми провайдерами; индекс CreatedAt'
  - order: 5
    action: Миграция
    detail: dotnet ef migrations add AddCatalogImportLog -p MomSite.Infrastructure -s MomSite.API -o Data/Migrations
  technical_notes:
  - path: backend/MomSite.Core/Interfaces/
    note: Рядом IBlogService.cs, стиль интерфейсов
  - path: backend/MomSite.Infrastructure/Data/ApplicationDbContext.cs
    note: Тесты на InMemory/Sqlite, jsonb делать совместимо
  acceptance_criteria:
  - id: AC-1
    description: Таблица CatalogImportLog создаётся миграцией
    done: true
  - id: AC-2
    description: Типы Core не зависят от ClosedXML/EF
    done: true
  - id: AC-3
    description: Каждый файл до 200 строк
    done: true
  test_scenarios:
  - id: TS-1

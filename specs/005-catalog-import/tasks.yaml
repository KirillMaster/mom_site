  - FR-003
  - FR-004
  depends_on:
  - T003
  parallelizable: true
  entity_refs:
  - artwork
  contract_refs:
  - catalog-import-service-impl
  steps:
  - order: 1
    action: Создать парсеры
    detail: 'backend/MomSite.Infrastructure/Catalog/ValueParsers.cs (до 200 строк, при необходимости разделить): ParsePrice, ParseSize, ParseYear, ParseStatus, ParseFlag, ParseText(maxLen)'
  - order: 2
    action: Правила
    detail: 'Пусто Keep; «-» Clear; цена: пробелы/nbsp, ₽, запятая, «по запросу» null; размер: запятая в точку, диапазон ArtworkFieldRules; год: «2017г.» 2017, диапазон 1950..текущий; статус: без регистра, 6 русских значений; флаг: да/+/1/true и нет/-/0/false; текст сверх лимита Warn без обрезки'

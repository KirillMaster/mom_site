  description: 'ArtworkFormFields/ArtworkForm/useArtworkSave: статус, размеры, год, основа, техника, короткое описание, «сильная», «переснять», «опубликована»'
  context: Админ правит характеристики без таблицы
  story_ref: US5
  requirement_refs:
  - FR-013
  depends_on:
  - T027
  parallelizable: false
  entity_refs:
  - artwork
  contract_refs:
  - admin-artworks
  steps:
  - order: 1
    action: Поля формы
    detail: 'frontend/components/admin/ArtworkFormFields.tsx: select статуса (6 значений, русские подписи), числовые Ш/В см, год, основа, техника, textarea короткого описания (счётчик 300), чекбоксы isFeatured/needsReshoot/isPublished; чекбокс «в продаже» заменить статусом'
  - order: 2
    action: Сохранение
    detail: 'frontend/components/admin/useArtworkSave.ts и ArtworkForm.tsx: добавить поля в FormData; клиентская валидация по тем же лимитам (frontend/lib/catalogLimits.ts)'
  - order: 3
    action: Список
    detail: 'frontend/app/admin/artworks/page.tsx: бейдж статуса и пометки «черновик»/«переснять»'
  - order: 4
    action: Тесты
    detail: frontend/__tests__/ArtworkForm.test.tsx, useArtworkSave.boundary.test.ts
  technical_notes:
  - path: frontend/components/admin/ArtworkFormFields.tsx
    note: Сейчас поле isForSale
  - path: frontend/__tests__/ArtworkForm.test.tsx
    note: Существующие тесты формы
  acceptance_criteria:
  - id: AC-1
    description: Новые поля сохраняются из формы
    done: true
  - id: AC-2
    description: Невалидный год/размер блокирует отправку с сообщением
    done: true
  - id: AC-3
    description: Список работ показывает статус и пометки
    done: true
  test_scenarios:
  - id: TS-1
    given:
    - Открыта форма работы
    when: Выбрать «Продана», год 2017, сохранить
    then:
    - В запросе status=Sold, year=2017
    verification:
    - automated
    level: unit
  - id: TS-2
    given:
    - Год 1900
    when: Сохранить
    then:
    - Ошибка валидации, запрос не отправлен
    verification:
    - automated
    level: unit

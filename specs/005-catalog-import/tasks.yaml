    when: RowValidator
    then:
    - Вторая error «дубль ID»
    verification:
    - automated
    level: unit
- id: T009
  title: 'ChangePlanner: diff с текущими работами'
  description: Сравнить желаемые значения с текущими Artwork и построить план только изменённых полей (было, стало)
  context: Предпросмотр и применение строятся одним планом, чтобы отчёт совпадал с результатом
  story_ref: US1
  requirement_refs:
  - FR-005
  - FR-006
  depends_on:
  - T008
  parallelizable: false
  entity_refs:
  - artwork
  - import-report
  contract_refs:
  - catalog-import-service-impl
  steps:
  - order: 1
    action: Создать планировщик
    detail: 'backend/MomSite.Infrastructure/Catalog/ChangePlanner.cs: Plan(IEnumerable<RowResult>, IReadOnlyDictionary<int,Artwork> current) -> ChangePlan{RowReport[], UpdateOps, CreateOps}'
  - order: 2
    action: Правила diff
    detail: Поле в плане только если отличается; Clear на пустом поле не изменение; Status через ApplyStatus (в diff только Status); строки без изменений и issues считаются skipped
  - order: 3
    action: Сводка
    detail: 'Заполнить ImportSummary: updated/created/skipped/warnings/errors'

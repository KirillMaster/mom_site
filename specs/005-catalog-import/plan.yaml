feature: 005-catalog-import
branch: feature/005-growth-foundation
summary: >-
  Расширяем существующую Artwork полями карточки (статус, размеры, год, основа,
  техника, короткое описание, IsFeatured, NeedsReshoot, IsPublished) одной миграцией;
  IsForSale становится вычисляемым из Status. Импорт xlsx — новый модуль
  Infrastructure/Catalog (ClosedXML): маппинг заголовков и парсеры значений — чистые
  функции, затем валидатор строк, планировщик изменений (diff) и применитель в одной
  транзакции с журналом CatalogImportLog для отката. Админ-эндпоинты
  POST /api/admin/catalog/import?dryRun, POST /api/admin/catalog/import/rollback и
  страница /admin/catalog. Публичная карточка /gallery/[slug] и галерея выводят новые
  поля, StructuredData дополняется VisualArtwork/Offer; скрытые работы исключаются из
  публичного API и sitemap. Реализация — после merge 004.
technical_context:
  language_version: C# 12 / .NET 8 (backend); TypeScript 5 strict / Next.js 14 App Router (frontend)
  primary_dependencies:
    - ClosedXML (MIT) — чтение xlsx (новая зависимость Infrastructure)
    - EF Core 8 + Npgsql (миграция Artwork, таблица CatalogImportLog)
    - Next.js 14 (SSR карточки, sitemap.ts), react-query (useApi) в админке
    - openpyxl (только генератор шаблона scripts/catalog, вне рантайма)
  storage: PostgreSQL — новые колонки Artwork, таблица CatalogImportLog (jsonb снимок старых значений); файл импорта не хранится
  testing: xUnit (unit — HeaderMap/ValueParsers/RowValidator/ChangePlanner; integration — фикстуры xlsx реальной выгрузки и Google Sheets, apply/idempotency/rollback); Jest (карточка, форма, страница импорта); Playwright (скрытая работа → 404, карточка с полями)
  target_platform: Linux Docker (mom_site_api_prod), браузеры mobile-first
  project_type: web_application
  performance_goals: Предпросмотр файла на 2000 строк ≤ 5 с; применение ≤ 10 с; карточка без деградации LCP (поля — текст SSR)
  constraints: Лимит файла 5 МБ / 2000 строк (до чтения, через Kestrel/контроллер RequestSizeLimit); только [Authorize]; ни одно исключение парсинга не превращается в 500; один импорт одновременно (advisory lock/семафор); совместимость IsForSale для старых клиентов; файлы ≤ 200 строк (P3)
  scale_scope: ~150–300 работ, 1–2 админа, импорт раз в несколько недель

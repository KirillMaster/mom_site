feature: Полные карточки работ и импорт каталога из xlsx
branch: feature/005-growth-foundation
created: '2026-10-02'
status: Draft
status_note: 'Контракт файла v1 (колонки, парсинг, ошибки) — design-notes.md (вход для /yamlkit-plan). Реализация — после merge 004 (модель Artwork с Images)'
input: Зафиксировать формат xlsx-таблицы каталога, чтобы импорт проходил без падений;
  мама заполняет таблицу (выгрузка scripts/catalog/build_catalog.py), админ загружает
  её в админке. Не дублировать существующее — Artwork, Category, ImageService, /admin/artworks.

user_stories:
  - id: US1
    title: Админ видит предпросмотр изменений из таблицы до применения
    priority: P1
    description: Админ загружает xlsx в админке и видит по каждой строке, какие поля
      изменятся (было → стало), какие строки новые и какие строки с ошибками, ничего
      не меняя на сайте.
    motivation:
      problem: Описания, цены, размеры и статусы 100+ работ сейчас правятся по одной
        вручную; мама заполняет таблицу, а переносить её некому.
      value: Безопасный перенос всей таблицы за минуты с проверкой до применения.
      consequence_if_skipped: Данные из таблицы не попадут на сайт или попадут с ошибками
        вручную; карточки останутся без цен и размеров.
    why_priority: Без предпросмотра применение рискованно — это ядро фичи.
    independent_test: Загрузить заполненную таблицу в режиме предпросмотра и сверить
      отчёт с файлом; данные на сайте не изменились.
    acceptance_scenarios:
      - id: AS-1
        given: таблица, выгруженная генератором и частично заполненная мамой
        when: админ загружает её в режиме предпросмотра
        then: показаны сводка (обновится, создастся, пропущено, предупреждений, ошибок)
          и список строк только с изменёнными полями
      - id: AS-2
        given: в таблице цена «150 000 ₽», год «2017г.», размер «50,5»
        when: выполняется предпросмотр
        then: значения распознаны как 150000, 2017 и 50.5 без предупреждений
      - id: AS-3
        given: в строке неизвестный статус и нечисловая цена
        when: выполняется предпросмотр
        then: строка помечена предупреждениями с указанием колонки, остальные её поля
          и другие строки обрабатываются
      - id: AS-4
        given: колонки переставлены, лишние колонки добавлены, лист «Каталог» не первый
        when: выполняется предпросмотр
        then: результат тот же, что для исходного порядка
    acceptance_criteria:
      - id: AC-1
        description: Ни один файл (битый, не тот формат, пустой, огромный) не приводит
          к ошибке сервера — только к понятному сообщению
        done: false
      - id: AC-2
        description: Предпросмотр ничего не меняет в данных сайта
        done: false
      - id: AC-3
        description: Есть фильтр «только строки с ошибками и предупреждениями»
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - фикстура реальной выгрузки и фикстура из Google Sheets
        when: разбор файла
        then:
          - все строки распознаны, заголовки найдены по имени
        verification:
          - automated
        level: integration
      - id: TS-2
        given:
          - набор значений цены, года, размера, статуса, булевых флагов
        when: парсинг ячеек
        then:
          - корректные значения или предупреждение без исключения
        verification:
          - automated
        level: unit
      - id: TS-3
        given:
          - файлы .xls, .csv, 0 байт, > 5 МБ, без листа «Каталог», без колонки ID
        when: загрузка
        then:
          - ошибка файла с понятным текстом, ответ не 500
        verification:
          - automated
        level: integration

  - id: US2
    title: Админ применяет таблицу одним действием
    priority: P1
    description: После предпросмотра админ нажимает «Применить» — все валидные строки
      сохраняются, строки с ошибками пропускаются, новые работы создаются скрытыми
      черновиками.
    motivation:
      problem: Частичный сбой посреди переноса оставит каталог в непонятном состоянии.
      value: Предсказуемый результат — всё или ничего на уровне файла, пропуск только
        плохих строк.
      consequence_if_skipped: Предпросмотр бесполезен без применения.
    why_priority: Цель фичи — данные на сайте.
    independent_test: Применить файл, проверить карточки на сайте; повторно применить
      тот же файл — изменений ноль.
    acceptance_scenarios:
      - id: AS-1
        given: предпросмотр без ошибок
        when: админ применяет файл
        then: все изменения сохранены; сводка совпадает с предпросмотром
      - id: AS-2
        given: пустая ячейка в заполненном поле
        when: файл применяется
        then: поле не меняется; значение «-» очищает поле
      - id: AS-3
        given: строка без ID с названием
        when: файл применяется
        then: создана скрытая работа без фото в категории по умолчанию; в отчёте
          напоминание добавить фото
      - id: AS-4
        given: статус «Не моя работа» или «нет» в листе «Фото с выставок»
        when: файл применяется
        then: работа скрыта с сайта, но не удалена
    acceptance_criteria:
      - id: AC-1
        description: Применение атомарно — при сбое БД не сохраняется ни одна строка
        done: false
      - id: AC-2
        description: Повторное применение того же файла даёт 0 изменений
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - БД с работами и файл с изменениями
        when: применение
        then:
          - поля обновлены, строки с ошибками не тронуты
        verification:
          - automated
        level: integration
      - id: TS-2
        given:
          - уже применённый файл
        when: повторное применение
        then:
          - 0 изменений
        verification:
          - automated
        level: integration

  - id: US3
    title: Админ откатывает последний импорт
    priority: P2
    description: Если после применения что-то пошло не так, админ одной кнопкой
      возвращает изменённые поля к значениям до импорта.
    motivation:
      problem: Ошибка в таблице (например, сдвиг колонок у мамы) может испортить много
        карточек сразу.
      value: Безопасность массовой операции.
      consequence_if_skipped: Восстановление только из бэкапа БД.
    why_priority: Страховка, без неё MVP работоспособен.
    independent_test: Применить файл, откатить, сравнить поля с исходными.
    acceptance_scenarios:
      - id: AS-1
        given: применён импорт
        when: админ нажимает «Откатить последний импорт»
        then: изменённые поля возвращены, созданные черновики удалены
    acceptance_criteria:
      - id: AC-1
        description: Откат возвращает поля ровно к значениям до импорта
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - применённый импорт
        when: откат
        then:
          - данные равны исходным
        verification:
          - automated
        level: integration

  - id: US4
    title: Посетитель видит полную карточку работы
    priority: P1
    description: На странице работы показаны размер (Ш × В см), техника, основа, год,
      статус и цена (или «по запросу»), короткое описание и история; в галерее видны
      статус и цена; сильные работы можно выделить.
    motivation:
      problem: Сейчас размер и техника спрятаны в тексте описания, статуса нет, цена
        не у всех; покупатель не понимает, что можно купить.
      value: Прозрачная карточка повышает доверие и конверсию в заявку; поисковики
        получают структурированные данные.
      consequence_if_skipped: Импортированные поля никуда не выводятся.
    why_priority: Без вывода импорт не даёт ценности посетителю.
    independent_test: Открыть карточку импортированной работы и проверить все поля
      и структурированные данные.
    acceptance_scenarios:
      - id: AS-1
        given: работа со статусом «В наличии», ценой и размером
        when: посетитель открывает карточку
        then: видит цену, «В наличии», размер, технику, год и кнопку заявки
      - id: AS-2
        given: работа «Продана» или «Частная коллекция»
        when: посетитель открывает карточку
        then: цена не показывается, виден статус, кнопка предлагает заказать похожую
      - id: AS-3
        given: скрытая работа
        when: посетитель открывает её адрес или галерею
        then: работы нет в галерее и sitemap, адрес отдаёт 404
    acceptance_criteria:
      - id: AC-1
        description: Поля карточки отдаются сервером и есть в структурированных данных
          (VisualArtwork с размерами, Offer для работ в наличии)
        done: false
      - id: AC-2
        description: Пустое поле не показывает пустую подпись
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - работы с разными статусами и заполненностью
        when: рендер карточки
        then:
          - показаны только заполненные поля, цена по правилу статуса
        verification:
          - automated
        level: unit
      - id: TS-2
        given:
          - скрытая работа
        when: запрос галереи, карточки и sitemap
        then:
          - работа отсутствует, карточка 404
        verification:
          - automated
        level: e2e

  - id: US5
    title: Админ правит новые поля в карточке работы вручную
    priority: P2
    description: В существующей форме работы в админке появляются поля статус, размеры,
      год, основа, техника, короткое описание, «сильная работа», «переснять фото»,
      «скрыта с сайта».
    motivation:
      problem: Точечные правки не должны требовать таблицы.
      value: Админка самодостаточна.
      consequence_if_skipped: Для правки одной цены придётся гонять файл.
    why_priority: Удобство; импорт покрывает массовый сценарий.
    independent_test: Изменить статус и размер в форме, проверить карточку на сайте.
    acceptance_scenarios:
      - id: AS-1
        given: форма работы в админке
        when: админ меняет статус и размеры и сохраняет
        then: карточка на сайте показывает новые значения
    acceptance_criteria:
      - id: AC-1
        description: Валидация полей формы совпадает с правилами импорта
        done: false
    test_scenarios:
      - id: TS-1
        given:
          - форма работы
        when: сохранение с новыми полями
        then:
          - значения сохранены, некорректные отклонены с подсказкой на русском
        verification:
          - automated
        level: unit

edge_cases:
  - id: EC-1
    description: Файл экспортирован из Google Sheets (формулы IMAGE, валидации, другие стили)
    expected_behavior: Формулы читаются как значения, IMAGE игнорируется, результат как
      у исходной выгрузки
  - id: EC-2
    description: В строке указан несуществующий ID
    expected_behavior: Строка пропускается с ошибкой, остальные применяются
  - id: EC-3
    description: Два раза один и тот же ID в файле
    expected_behavior: Вторая строка — ошибка «дубль ID», применяется первая
  - id: EC-4
    description: Нет строки версии формата «format v1» в листе «Как заполнять»
    expected_behavior: Предупреждение уровня файла, импорт продолжается
  - id: EC-5
    description: Новая работа с названием, совпадающим с существующей
    expected_behavior: Создаётся черновик, предупреждение о возможном дубле
  - id: EC-6
    description: Короткое описание длиннее 300 символов
    expected_behavior: Предупреждение, поле не меняется (без обрезки)
  - id: EC-7
    description: Пустые строки, хвост из 200 заготовленных строк генератора
    expected_behavior: Пропускаются молча
  - id: EC-8
    description: Два админа применяют файлы одновременно
    expected_behavior: Второе применение получает отказ «импорт уже выполняется»

functional_requirements:
  - id: FR-001
    text: Система MUST находить листы по имени («Каталог», «Фото с выставок») и колонки
      по заголовку первой строки без учёта регистра, пробелов и ё/е; обязательны ID и Название
    story_refs: [US1]
  - id: FR-002
    text: Система MUST распознавать значения по правилам контракта v1 (цена с пробелами,
      ₽ и запятой; «по запросу»; год с «г.»; размеры с запятой; статусы списком; да/+/1)
    story_refs: [US1]
  - id: FR-003
    text: WHEN значение не распознано THEN система MUST выдать предупреждение с номером
      строки и колонкой и не менять это поле; ошибка строки MUST пропускать только строку
    story_refs: [US1, US2]
  - id: FR-004
    text: Пустая ячейка MUST означать «не менять», значение «-» MUST очищать поле
    story_refs: [US2]
  - id: FR-005
    text: Система MUST поддерживать режим предпросмотра без изменения данных с отчётом
      по строкам (было → стало, предупреждения, ошибки) и сводкой
    story_refs: [US1]
  - id: FR-006
    text: Применение MUST быть атомарным, идемпотентным и сохранять снимок старых
      значений для отката последнего импорта
    story_refs: [US2, US3]
  - id: FR-007
    text: Строка без ID MUST создавать скрытый черновик без фото в категории по умолчанию
    story_refs: [US2]
  - id: FR-008
    text: Статус «Не моя работа» и «нет» в «Фото с выставок» MUST скрывать работу, не удаляя
    story_refs: [US2, US4]
  - id: FR-009
    text: Файл MUST отклоняться с понятным сообщением, если это не xlsx, больше 5 МБ,
      больше 2000 строк, нет листа «Каталог» или обязательных колонок
    story_refs: [US1]
  - id: FR-010
    text: Карточка работы MUST показывать размер Ш × В см, технику, основу, год, статус,
      цену по правилу статуса, короткое описание (или первые 160 символов полного) и историю
    story_refs: [US4]
  - id: FR-011
    text: Скрытые работы MUST отсутствовать в галерее, sitemap и публичном API, карточка — 404
    story_refs: [US4]
  - id: FR-012
    text: Карточка MUST содержать структурированные данные VisualArtwork (размеры, техника,
      год) и Offer для работ в наличии
    story_refs: [US4]
  - id: FR-013
    text: Форма работы в админке MUST позволять править все новые поля с той же валидацией,
      что и импорт
    story_refs: [US5]
  - id: FR-014
    text: Признак «в продаже» MUST вычисляться из статуса «В наличии» без поломки текущего
      поведения
    story_refs: [US4]

key_entities:
  - id: E-1
    name: Работа (существующая)
    description: Дополняется статусом, шириной и высотой в см, годом, основой, техникой,
      коротким описанием, признаками «сильная», «переснять фото», «скрыта с сайта»
  - id: E-2
    name: Журнал импорта
    description: Кто и когда применил файл, сводка, снимок старых значений изменённых
      полей и список созданных черновиков — для отката последнего импорта
  - id: E-3
    name: Отчёт импорта
    description: Результат предпросмотра или применения — сводка и строки с изменениями
      и замечаниями; не хранится, кроме сводки в журнале

success_criteria:
  - id: SC-001
    description: Заполненная мамой таблица на 150 работ переносится на сайт за 5 минут
      работы админа, включая проверку предпросмотра
    measurable_via: Ручной прогон с секундомером на реальном файле
  - id: SC-002
    description: 0 ошибок сервера на наборе из 10 испорченных файлов
    measurable_via: Автотесты с фикстурами
  - id: SC-003
    description: После импорта 100% работ в наличии показывают цену или «по запросу»
      и статус
    measurable_via: Проверка галереи после импорта
  - id: SC-004
    description: Карточки проходят валидатор структурированных данных без ошибок
    measurable_via: Проверка 5 карточек в валидаторе разметки

assumptions:
  - id: A-1
    description: Порядок размеров — ширина × высота; мама подтверждает в таблице
  - id: A-2
    description: Смена категории, загрузка фото, импорт листа «О себе» и синхронизация
      с Google Sheets API — вне объёма v1
  - id: A-3
    description: Импорт выполняет только авторизованный админ; файл не хранится после
      обработки
  - id: A-4
    description: Реализация начинается после merge фичи 004 (несколько фото работы), так
      как обе меняют работу и её форму в админке
  - id: A-5
    description: Генератор шаблона — scripts/catalog/build_catalog.py, строка «format v1»
      в листе «Как заполнять»

project_name: Mom's Art Portfolio (angelamoiseenko.ru) —
version: 2.0.0
ratified: '2026-06-27'
last_amended: '2026-06-27'
principles:
- id: P1
  name: I. Spec-Driven Development
  description: Никакая фича не начинается без спецификации. Сначала spec → clarify
    → plan → tasks → implement. Код без спеки = технический долг.
  severity: recommended
  gate_condition: Feature PR references an approved spec.yaml (and, where applicable,
    plan.yaml/tasks.yaml) for the feature branch before implementation commits are
    merged; PRs introducing new functionality without a linked spec are rejected
    in review.
- id: P2
  name: II. Чистая архитектура
  description: '- Backend: C# ASP.NET Core 8+ с Clean Architecture (MomSite.API /
    MomSite.Core / MomSite.Infrastructure)

    - Frontend: Next.js (App Router), React, TypeScript strict mode

    - Стили: Tailwind CSS

    - Файловое хранилище: S3 (Timeweb)

    - Контейнеризация: Docker Compose (dev + prod), Nginx reverse proxy с SSL

    - Логирование: Serilog'
  severity: recommended
  gate_condition: Backend code lives under MomSite.API / MomSite.Core / MomSite.Infrastructure
    (Clean Architecture layering, no cross-layer violations) and uses ASP.NET Core
    8+; frontend is a Next.js App Router project using React + TypeScript strict
    mode; styling uses Tailwind CSS; file storage calls target S3 (Timeweb); the
    stack runs via Docker Compose (dev + prod) behind an Nginx reverse proxy with
    SSL; backend logging goes through Serilog. CI/review checks reject code that
    violates any of these stack choices.
- id: P3
  name: III. Качество кода (NON-NEGOTIABLE)
  description: '- Backend: следовать C# conventions, async/await everywhere, nullable
    reference types enabled

    - Frontend: TypeScript strict, никаких `any`, компоненты — функциональные с хуками

    - Максимум 50 строк на функцию/метод, максимум 200 строк на файл (стремиться к)

    - DRY, KISS, YAGNI — в этом порядке приоритета'
  severity: NON-NEGOTIABLE
  gate_condition: Linters/CI enforce C# conventions and async/await usage with nullable
    reference types enabled on backend projects; frontend TypeScript compiler runs
    in strict mode with zero `any` usages and components are functional (hooks-based,
    no class components); a static check flags any function/method exceeding 50
    lines or any file exceeding 200 lines for review; PR review confirms adherence
    to DRY/KISS/YAGNI in that priority order. Violations block merge.
- id: P4
  name: IV. Безопасность
  description: '- JWT токены — только через env variables, никогда в коде

    - CORS — явно перечисленные origins, никаких wildcard в production

    - Все пользовательские входы валидируются на backend

    - Пароли — через env переменную ADMIN_PASSWORD

    - Nginx: security headers (HSTS, X-Frame-Options, CSP, X-Content-Type-Options)

    - Rate limiting на nginx (api: 10r/s, login: 5r/m)'
  severity: recommended
  gate_condition: Static/secret scan confirms no JWT tokens or ADMIN_PASSWORD are
    hardcoded in source (only referenced via env variables); CORS configuration
    in production lists explicit allowed origins with no wildcard; backend validates
    all user input at the API boundary (model validation/guards present on every
    endpoint accepting input); Nginx config includes HSTS, X-Frame-Options, CSP,
    and X-Content-Type-Options headers; Nginx rate limiting is configured at 10r/s
    for api and 5r/m for login. CI/review rejects changes that regress any of these.
- id: P5
  name: V. Тестирование (NON-NEGOTIABLE)
  description: "- **Каждая задача** должна быть покрыта unit-тестами И integration-тестами\n\
    - Backend: unit-тесты (MomSite.Tests), integration-тесты для API endpoints\n-\
    \ Frontend: компонентные тесты (Jest + React Testing Library)\n- E2E: Playwright\
    \ для критических user flows\n- Тесты запускаются в CI перед деплоем\n- То, что\
    \ нельзя проверить автоматически, **проверяется вручную пользователем**\n- **Задача\
    \ НЕ считается закрытой**, пока:\n  1. Все автоматические тесты написаны и проходят\n\
    \  2. Если требуется ручная проверка — пользователь явно подтвердил (\"дал добро\"\
    )\n- Без подтверждения пользователя задачу НЕ закрывать и НЕ считать завершённой"
  severity: NON-NEGOTIABLE
  gate_condition: Every task's PR includes passing unit tests (MomSite.Tests for
    backend) and, where applicable, integration tests for API endpoints, plus Jest
    + React Testing Library component tests for frontend changes and Playwright
    E2E coverage for critical user flows; CI runs the full test suite and blocks
    deploy on failure; for changes requiring manual verification, the PR/task record
    contains explicit user confirmation ("дал добро") before the task is marked
    closed — absence of automated tests or, where required, unconfirmed manual
    verification blocks closing the task.
- id: P6
  name: VI. Git Workflow
  description: '- Основная ветка: `main` (protected)

    - Рабочие ветки: `feature/xxx`, `fix/xxx`, `chore/xxx`

    - Коммиты: conventional commits (`feat:`, `fix:`, `chore:`, `docs:`)

    - Один PR = одна логическая задача

    - Мерж в main только через PR с пройденным CI

    - Деплой: автоматический через GitHub Actions при push в main'
  severity: recommended
  gate_condition: main branch is protected; feature work happens on branches named
    feature/xxx, fix/xxx, or chore/xxx; commit messages follow Conventional Commits
    (feat:, fix:, chore:, docs:); each PR corresponds to exactly one logical task;
    merges to main are only allowed through a PR with a passing CI run; a push to
    main triggers automatic deploy via GitHub Actions. Branch protection rules and
    CI configuration are checked to enforce this.
- id: P7
  name: VII. SEO (CRITICAL)
  description: '- SEO — приоритет №1 для публичной части сайта, цель — топ поисковой
    выдачи

    - SSR/SSG обязателен для всех публичных страниц

    - Schema.org разметка (StructuredData компонент) на каждой странице

    - Мета-теги: title, description, og:image, og:type на каждой странице

    - Семантический HTML: правильные heading levels, alt на изображениях

    - Оптимизация Core Web Vitals: LCP, FID, CLS

    - sitemap.ts и robots.ts — автогенерация (Next.js App Router)

    - Canonical URLs, чистые человекочитаемые URL'
  severity: recommended
  gate_condition: Every public page is rendered via SSR/SSG (no client-only rendering
    for public routes); every public page renders a StructuredData (Schema.org)
    component; every public page sets title, description, og:image, and og:type
    meta tags; markup uses correct semantic heading order and alt text on all images;
    Core Web Vitals (LCP, FID, CLS) are measured and within Next.js/Lighthouse "good"
    thresholds; sitemap.ts and robots.ts are present and auto-generated; all public
    URLs are canonical and human-readable. CI/Lighthouse audit and manual review
    verify these before merge.
- id: P8
  name: VIII. Производительность (NON-NEGOTIABLE)
  description: '- Время открытия любой страницы < 200ms (TTFB + render)

    - Lighthouse score: 90+ по всем категориям

    - S3 для медиа-контента (не в БД)

    - Nginx gzip сжатие, статика с Cache-Control immutable

    - Next.js Image optimization

    - Минификация и tree-shaking'
  severity: NON-NEGOTIABLE
  gate_condition: Measured TTFB + render for any page is under 200ms; Lighthouse
    score is 90+ in every category; media content is served from S3, not stored
    in the database; Nginx serves gzip-compressed responses and sets Cache-Control
    immutable on static assets; images use Next.js Image optimization; production
    build output is minified with tree-shaking enabled. CI/Lighthouse run and manual
    performance check block merge/deploy if any threshold is not met.
- id: P9
  name: IX. Админ-панель (CRITICAL)
  description: '- Админка должна быть **самодостаточной**: хозяин сайта управляет
    всем контентом без разработчиков

    - Все операции должны работать **без ошибок**

    - UX: простой и понятный для нетехнического пользователя (русский язык, подтверждения,
    обратная связь)

    - Безопасность: JWT [Authorize], rate limiting на login

    - E2E тесты (Playwright) для админки

    - Каждая фича проходит **ручную проверку** пользователем перед закрытием'
  severity: recommended
  gate_condition: Every admin content-management operation (create/edit/delete for
    gallery, videos, biography, contacts, reviews, etc.) can be completed by the
    site owner with no developer involvement and completes without unhandled errors;
    admin UI text/confirmations/feedback are in Russian and understandable to a
    non-technical user; admin API endpoints require JWT [Authorize] and the login
    endpoint is rate-limited; Playwright E2E tests cover admin flows; each admin
    feature has an explicit manual user sign-off recorded before being marked closed.
- id: P10
  name: X. Простота и UX
  description: '- Сайт — портфолио художницы, должен быть красивым и быстрым

    - Mobile-first подход

    - Минимум JavaScript для посетителей, максимум — для админки

    ## Технический стек

    | Layer | Technology | Version |

    |-------|-----------|---------|

    | Backend API | ASP.NET Core (Clean Architecture) | 8+ |

    | ORM | Entity Framework Core | 8+ |

    | Database | PostgreSQL | latest |

    | File Storage | S3 (Timeweb) | — |

    | Frontend | Next.js (App Router) + React | latest |

    | Styling | Tailwind CSS | latest |

    | Auth | JWT Bearer | — |

    | Reverse Proxy | Nginx + SSL | — |

    | Container | Docker Compose | — |

    | CI/CD | GitHub Actions → SSH deploy | — |

    | Logging | Serilog | — |

    | Email | SMTP (Gmail) | — |

    | Hosting | VPS (89.169.3.32) | Ubuntu |

    | Domain | angelamoiseenko.ru | — |

    ## Deployment

    - VPS: `root@89.169.3.32`

    - Путь на сервере: `/root/mom_site/`

    - Деплой: `scripts/deploy_remote.sh <git-sha>`

    - Docker Compose prod: `docker-compose.prod.yml`

    - SSL: `/etc/ssl/angelamoiseenko.ru/`

    - Env: `/root/mom_site/.env`

    ## Development Workflow

    1. Создать спеку (`/speckit.specify`)

    2. Уточнить (`/speckit.clarify`)

    3. Спланировать (`/speckit.plan`)

    4. Разбить на задачи (`/speckit.tasks`)

    5. Проанализировать (`/speckit.analyze`)

    6. Реализовать по фазам (`/speckit.implement Phase N`)

    7. Тестировать после каждой фазы

    8. PR → CI → Code Review → Merge → Auto-deploy

    ## Governance

    - Конституция — главный документ, превалирует над всеми другими практиками

    - Изменения в конституцию — через PR с обоснованием

    - Все PR и ревью должны проверять соответствие конституции

    **Version**: 2.0.0 | **Ratified**: 2026-06-27 | **Last Amended**: 2026-06-27'
  severity: recommended
  gate_condition: Design/code review confirms the public site presents a polished,
    fast visual experience for a portfolio audience; layouts are built mobile-first
    (responsive from the smallest breakpoint up); visitor-facing pages ship the
    minimum JavaScript needed (no admin-only bundles/scripts loaded on public routes),
    while richer JavaScript is reserved for the admin panel.
